<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>
  <path d="M 32 16 L 96 16 L 96 40 L 56 40 L 56 72 L 32 72 Z" fill="#FF9900"/>
  <rect x="208" y="16" width="32" height="24" rx="12" fill="#FF9900"/>
  <rect x="32" y="88" width="192" height="140" rx="16" fill="#FF9900"/>
  <!-- Glyph: gear - 8 teeth, rotated for visual balance -->
  <g fill="#0a0a0a" transform="translate(128 158)">
    <!-- 8 rectangular teeth at 45deg intervals -->
    <g>
      <rect x="-10" y="-72" width="20" height="24"/>
      <rect x="-10" y="48"  width="20" height="24"/>
      <rect x="-72" y="-10" width="24" height="20"/>
      <rect x="48"  y="-10" width="24" height="20"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-10" y="-72" width="20" height="24"/>
      <rect x="-10" y="48"  width="20" height="24"/>
      <rect x="-72" y="-10" width="24" height="20"/>
      <rect x="48"  y="-10" width="24" height="20"/>
    </g>
    <!-- Body -->
    <circle cx="0" cy="0" r="52"/>
  </g>
  <!-- Center hole -->
  <circle cx="128" cy="158" r="18" fill="#FF9900"/>
</svg>
