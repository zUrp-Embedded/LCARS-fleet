<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>
  <path d="M 32 16 L 96 16 L 96 40 L 56 40 L 56 72 L 32 72 Z" fill="#9966CC"/>
  <rect x="208" y="16" width="32" height="24" rx="12" fill="#9966CC"/>
  <rect x="32" y="88" width="192" height="140" rx="16" fill="#9966CC"/>

  <!-- IDIC glyph: circle + equilateral triangle, gem at apex -->
  <!-- Circle (evidé) -->
  <circle cx="128" cy="160" r="56" 
          fill="none" stroke="#0a0a0a" stroke-width="9"/>

  <!-- Equilateral triangle, apex pointing up, apex lands on the circle's top arc -->
  <!-- Side length 104, centroid (128, 160): apex (128, 100), base-L (76, 190), base-R (180, 190) -->
  <polygon points="128,100 76,190 180,190" 
           fill="none" stroke="#0a0a0a" stroke-width="9" 
           stroke-linejoin="miter"/>

  <!-- Gemstone at the apex (intersection of circle + triangle top) -->
  <!-- Diamond shape, black solid -->
  <polygon points="128,92 138,104 128,120 118,104" fill="#0a0a0a"/>
  <!-- Gem facet highlight -->
  <polygon points="128,92 138,104 128,104" fill="#9966CC"/>
</svg>
