    <!-- Right bracket -->
    <polyline points="184,108 200,108 200,208 184,208"/>
  </g>
  <!-- Check -->
  <polyline points="84,162 116,190 172,128" 
            fill="none" stroke="#0a0a0a" stroke-width="18" 
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
