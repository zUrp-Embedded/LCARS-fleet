<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>
  <path d="M 32 16 L 96 16 L 96 40 L 56 40 L 56 72 L 32 72 Z" fill="#99CC66"/>
  <rect x="208" y="16" width="32" height="24" rx="12" fill="#99CC66"/>
  <rect x="32" y="88" width="192" height="140" rx="16" fill="#99CC66"/>
  <!-- Glyph: gate brackets [ ] with a bold check inside -->
