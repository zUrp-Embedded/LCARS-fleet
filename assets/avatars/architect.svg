<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <!-- Background LCARS panel -->
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>
  <!-- LCARS corner accent (top-left elbow) -->
  <path d="M 32 16 L 96 16 L 96 40 L 56 40 L 56 72 L 32 72 Z" fill="#CC99CC"/>
  <!-- LCARS right pill -->
  <rect x="208" y="16" width="32" height="24" rx="12" fill="#CC99CC"/>
  <!-- Role color fill area -->
  <rect x="32" y="88" width="192" height="140" rx="16" fill="#CC99CC"/>
  <!-- Glyph: stratified pyramid, 3 levels (architectural hierarchy) -->
  <!-- widths 64 / 96 / 144, gaps 12, span y 106-210 (centered in the plate) -->
  <g fill="#0a0a0a">
    <polygon points="128,106 160,138 96,138"/>
    <rect x="80" y="150" width="96" height="24"/>
    <rect x="56" y="186" width="144" height="24"/>
  </g>
</svg>
