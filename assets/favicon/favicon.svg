<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="geometricPrecision">
  <!-- Black panel background -->
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>

  <!-- LCARS elbow: 
       Outer corner radius 96, inner corner radius 24, 
       bar thickness 64, inset 32 -->
  <path d="M 224 32
           L 224 96
           L 152 96
           A 24 24 0 0 0 128 120
           L 128 224
           L 32 224
           L 32 128
           A 96 96 0 0 1 128 32
           Z"
        fill="#FF9900"/>

  <!-- Accent pills inside the L interior (lavender + sand) 
       Positioned in the dark quadrant enclosed by the elbow. 
       Disappear at 16px (favicon tab), readable at 32px+. -->
  <rect x="156" y="156" width="56" height="20" rx="10" fill="#CC99CC"/>
  <rect x="156" y="188" width="36" height="20" rx="10" fill="#FFCC66"/>
</svg>
