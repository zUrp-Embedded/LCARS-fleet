# ⚠ DEUX ROLES NE SONT PAS DANS CETTE CARTE, ET CE N'EST PAS UN OUBLI : `architect` et `starfleet`
# ont un SP ECRIT A LA MAIN (`sp_drafts/agent-architect-base.md`, `agent-starfleet-base.md`), ils ne
# composent AUCUN bloc. Consequence a ne pas decouvrir apres coup : une regle ajoutee a un
# `core/*` ci-dessous NE LES ATTEINT PAS. Mesure du 2026-08-12 — en deplacant la doctrine de sortie
# du `CLAUDE.md` compose vers `core/pod-sanctuary` et `core/evidence`, les huit roles composes l'ont
# recue et ces deux-la l'auraient perdue en silence ; il a fallu la leur porter a la main.
# Qui touche un bloc core verifie ces deux fichiers dans le meme geste.

# Role → SP block map. List order = assembly order; `role/*` always last.
# The generator (`mix lcars.sp.gen`) composes these blocks → `<catalogue>/sp_builder/sp_drafts/agent-<role>-base.md`.
# Block names resolve on the SEARCH PATH: `core/*` comes from the system catalogue unless a file of
# the same relative path sits here. This map is NOT on that path — it is the author's manifest.
#
# HARD RULE (no-fallback, cf. memory no-sp-no-pod-no-fleet). Every catalogue role owes EXACTLY ONE
# source for its SP: an entry here, or a draft. Never both, never neither. The generator refuses all
# three disagreements before composing anything (`Blocks.audit!/2`), and a listed block absent from
# disk fails at compose time. No SP → no pod → no fleet.
#
# ⚠ Until 2026-08-10 this header promised the first half and NOTHING enforced it: `generate!/2`
# iterates THIS MAP, never the catalogue, so a role in neither was simply not generated and died far
# later at spawn with `:agent_draft_missing`. The comment described the code it should have had — it
# now describes the code that exists.
#
# NB: `architect` AND `starfleet` (user-facing orchestrators, outside the pod socle) are NOT here — each
# keeps a manual draft (a different socle: a human in front — one per-project, one fleet-level). That is
# the legitimate "draft, no entry" case, and the audit passes it silently.

# --- PR judges (judge the diff in their workspace) ---
qualifier:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/test-evidence-review
  - role/qualifier

reviewer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/review-conformance
  - role/reviewer

# --- Producer (git-native: commits locally, the system pushes) ---
# `core/wake-longlived`: Monitor arming — long-lived pods ONLY (pipe/forever). One-shot judges
# never receive it: their single mandate is enqueued before spawn, no second wake can reach them.
engineer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/wake-longlived
  - core/evidence
  - core/producer-output
  - method/engineer-implement
  - role/engineer

# --- Producer d'EXCEPTION : resout un conflit de merge sur la PR d'un autre ---
# Meme socle producteur que l'engineer, MOINS `core/wake-longlived` : chief est one-shot, son
# unique mandat est enqueue avant le spawn et aucun second reveil ne peut l'atteindre (meme regle
# que les juges one-shot). Pas de bloc `method/` : sa methode EST le conflit qu'il a sous les yeux,
# pas une procedure a rejouer.
chief:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/producer-output
  - role/chief

# --- Producer documentaire (git-native sur la face que la carte nomme — `code` ou `workshop`,
# jamais `ops` : commits locaux, le systeme pousse) ---
# Meme socle que l'engineer (producteur pipe, wake-longlived) : seuls le bloc methode et le bloc
# role changent — la mecanique de livraison est IDENTIQUE, c'est la these du chantier face-projet.
scribe:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/wake-longlived
  - core/evidence
  - core/producer-output
  - method/scribe-redact
  - role/scribe

# --- Brief judge (pre-PR, read-only: no diff, the input is the brief) ---
scoper:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/brief-review
  - role/scoper

# --- Reserved seat: external auditor (duplicate of scoper by user arbitrage 2026-08-02 —
# a valid, provable profile that no card calls; see the header of its cap-profile) ---
# ⚠ ET CETTE COMPOSITION CONTREDIT `role/vulcan`, QUI DIT « tu ne juges aucun brief : tu relis le
# travail fini ». La liste ci-dessous est celle du scoper — `method/brief-review`, et pas de
# `core/judge-code-input`. Inerte aujourd'hui : le siège est un `ReservedSeat`, et l'admission le
# refuse d'elle-même (`{:error, {:role_reserved, "vulcan"}}`), donc aucune carte ne peut le
# dispatcher. À RÉCONCILIER LE JOUR OÙ LA BOÎTE S'OUVRE, et dans ce sens-là : c'est la méthode qui
# doit rejoindre le rôle, pas l'inverse — un auditeur externe qui relit du fini a besoin du bloc
# d'entrée code et d'une méthode de revue de livrable, pas d'une revue de brief.
vulcan:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/brief-review
  - role/vulcan

# --- Exception judge / final promotion (arbitrates the upstream verdicts; no diff) ---
# One-shot per-project judge (reorg 2026-07-19) — NO core/wake-longlived: its single eval mandate
# is enqueued before spawn, no second wake can reach it (same rule as the PR judges).
gatekeeper:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/gatekeeper-arbitrate
  - role/gatekeeper
