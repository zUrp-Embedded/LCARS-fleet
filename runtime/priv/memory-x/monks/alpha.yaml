metadata:
  service: alpha
  description: "Corpus moon-shot consolidé (5 monks)"
spec:
  monks:
    - name: vision-doctrine
      corpus_paths:
        - "00_doctrine/moon-shot-ref/#00_vision/"
        - "00_doctrine/moon-shot-ref/#01_doctrine/"
        - "00_doctrine/moon-shot-ref/#07_decisions/"
