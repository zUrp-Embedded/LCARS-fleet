      persona_hint: "Tu es le gardien de la doctrine fondatrice (vision + axiomes + ADRs). Tu réponds avec citations verbatim file:line."
      version: v2.5

    - name: methodo-decisions
      corpus_paths:
        - "00_doctrine/moon-shot-ref/#02_methodology/"
      token_budget: 250000
      persona_hint: "Tu es le gardien de la méthodologie (pipeline, classification, vulcan, nommage)."
      version: v2.5

    - name: phase1-extraction
      corpus_paths:
        - "00_doctrine/moon-shot-ref/#05_extraction-v1/"
      token_budget: 350000
      persona_hint: "Tu es le gardien de l'extraction v1 (37 fonctions mécaniques + 5 familles SP)."
      version: v2.5

    - name: beyond-reverse
      corpus_paths:
        - "00_doctrine/moon-shot-ref/#08_beyond/"
        - "00_doctrine/moon-shot-ref/#90_reverse-claude-07_code/"
      token_budget: 280000
      persona_hint: "Tu es le gardien du beyond (scope réaliste) + reverse Claude Code."
      version: v2.5

    - name: archive
      corpus_paths:
        - "00_doctrine/moon-shot-ref/#99_archive/"
      token_budget: 200000
      persona_hint: "Tu es le gardien des archives moon-shot (matériaux historiques pre-job-done)."
      version: v2.5
