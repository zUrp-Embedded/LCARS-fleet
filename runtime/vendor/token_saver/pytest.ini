; pytest — brique vendorée token_saver (LCARS)
;
; Fichier LCARS, hors sous-arbre vendoré : `src/`, `scripts/` et `tests/` sont
; des copies strictes de l'amont (ppgranger/token-saver @ 098873e), pour que le
; merge amont reste trivial. Voir VENDOR.md.
;
; PORTÉE : cette configuration ne couvre QUE la suite amont (`tests/`).
;
; Les tests LCARS (`lcars_tests/`) doivent tourner dans un PROCESSUS SÉPARÉ :
; importer `adapter` fige la configuration, élargit le vocabulaire d'échec et
; substitue la méthode du processeur `build` — tout cela est global au
; processus. Les tests amont valident la lib NON configurée par LCARS ; les
; exécuter ensemble ferait échouer 33 cas pour la seule raison que la
; configuration diffère (db_max_rows, redaction_allowlist, user_processors_dir…).
;
; Utiliser `./run_tests.sh`, qui lance les deux suites l'une après l'autre.
;
; Deux classes désélectionnées — elles portent sur ce que LCARS ne reprend pas :
;   TestAntigravityHook  → plateforme Antigravity non reprise (antigravity/).
;   TestBinScript        → wrapper CLI `bin/token-saver` non repris.
;
; Attendu : 797 passed, 5 deselected.

[pytest]
testpaths = tests
addopts =
    -q
    --deselect tests/test_core.py::TestAntigravityHook
    --deselect tests/test_cli.py::TestBinScript
