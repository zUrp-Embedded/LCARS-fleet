# projects.yaml — software project fleet
#
# Full production fleet for software projects.
# Extends fleet with user-facing roles + project workers.

extends: fleet

instances:

  # --- Tier 0 — Boundary User (permanent) ---

  - role: architect
    tier: 0
    scope: boundary-user
    model: opus[1m]
    stateless: false
    wakeable: false
    context_threshold: 75
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie

      - organisation/workflow
      - protocole
    skills:
      - plan
      - new-project
      - adopt-project
      - ponce
      - reverse
      - audit
      - harvest-emergency
      - handoff
    description: "User↔fleet interface. Arbitrage, priorisation, architecture."

  # --- Tier 1 — Orchestrator (permanent) ---

  - role: engineer
    tier: 1
    scope: sas-user
    model: claude-sonnet-4-6
    stateless: false
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie

      - organisation/workflow
    skills:
      - plan
      - harvest-emergency
      - handoff
    description: "Runs the fleet. Dispatches to workers."

  # --- Tier 2 — Project workers ---

  - role: dev
    tier: 2
    scope: code
    model: claude-sonnet-4-6
    stateless: false
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie
      - organisation/workflow
    skills:
      - harvest-emergency
      - handoff
    description: "Code only. Commits project code."
    headless:
      max_turns: 40
      timeout: 600
      allowed_tools: "Read,Grep,Glob,Bash,Write,Edit"



  - role: documenter
    tier: 2
    scope: documentation
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie
      - organisation/workflow
    skills:
      - harvest-emergency
    description: "Documentation. README, API docs, guides, translations."
    headless:
      max_turns: 20
      timeout: 300
      allowed_tools: "Read,Grep,Glob,Bash,Write,Edit,Agent"

  - role: researcher
    tier: 2
    scope: research
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie
    skills:
      - harvest-emergency
    # Decision: researcher does web research only — organisation/workflow not needed (no QA, no plans, no fleet conventions)
    description: "Web research. Deep search, structured reports, no filesystem writes."
    headless:
      max_turns: 25
      timeout: 600
      allowed_tools: "WebSearch,WebFetch,Read,Glob,Grep"

