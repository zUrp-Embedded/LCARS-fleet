# fleet.yaml — LCARS self-maintenance (minimum viable fleet)
#
# The infrastructure that keeps LCARS running: sysadmin, QA, review.
# All other profiles extend this base via "extends: fleet".

instances:

  # --- Tier 0 — Boundary OS (permanent) ---

  - role: starfleet
    tier: 0
    scope: boundary-os
    model: opus[1m]
    stateless: true
    sudo: full
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie

      - organisation/workflow
      - protocole
    skills:
      - lcars-fix
      - lcars-feature
      - push-github
      - onboard_v2
      - fleet-init
      - lcars-patch
      - plan
      - harvest-emergency
      - handoff
      - drift-audit
      - new-project
      - adopt-project
    description: "Fleet sysadmin. LCARS owner, deploy, system escalation."

  # --- Tier 2 — LCARS QA + Review (permanent, headless) ---

  - role: qualifier
    tier: 2
    scope: test
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie
      - organisation/workflow
    skills:
      - harvest-emergency
    description: "LCARS QA. GO-7 compliance, hooks validation, skills verification, directive coherence."
    headless:
      max_turns: 25
      timeout: 300
      allowed_tools: "Read,Grep,Glob,Bash,Agent"

  - role: reviewer
    tier: 2
    scope: analysis
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie

      - organisation/workflow
    skills:
      - ponce
      - reverse
      - audit
      - harvest-emergency
    description: "Reviewer. Plan validation gate, code review, ponce, reverse, audit."
    headless:
      max_turns: 30
      timeout: 600
      allowed_tools: "Read,Grep,Glob,Bash,Agent"

  # --- External advisory (interactive, stateless) ---

  - role: consultant
    tier: 2
    scope: advisory
    model: opus[1m]
    stateless: true
    wakeable: false
    context_threshold: 60
    system_prompt:
      - anthropic-lcars
      - core
      - organisation/topologie

      - organisation/workflow
      - protocole
    skills:
      - sonde
      - ponce
      - reverse
      - audit
    description: "LCARS-internal advisory. Full context, interactive, stateless."
