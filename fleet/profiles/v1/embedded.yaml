# embedded.yaml — hardware/firmware project fleet
#
# Extends projects with cross-compilation and physical deployment.
# For firmware, embedded Linux, IoT, hardware-in-the-loop.

extends: projects

instances:

  - role: builder
    tier: 2
    scope: build
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    description: "Build engineer. Cross-compilation, CI, toolchains, packaging."
    headless:
      max_turns: 25
      timeout: 600
      allowed_tools: "Read,Grep,Glob,Bash,Agent"

  - role: deployer
    tier: 2
    scope: physical
    model: claude-sonnet-4-6
    stateless: true
    context_threshold: 60
    description: "Physical deployment. Flash, SSH, hardware-in-loop, staging."
    headless:
      max_turns: 20
      timeout: 600
      allowed_tools: "Read,Grep,Glob,Bash,Agent"
