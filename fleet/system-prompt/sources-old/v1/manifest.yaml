# manifest.yaml — Source de verite pour l'assemblage system-prompt
#
# build-sp.sh lit ce fichier pour assembler le SP de chaque agent.
# fleet.yaml reference les cles de blocs dans system_prompt: [].
# Tout ajout/suppression de .md passe par ce manifest — plus de case hardcode.
#
# STARDATE: 2026.090
# STATUS: OPERATIONAL

api_version: 2

# --- SP blocks — assembles par build-sp.sh ---
# position: ordre d'injection (plus bas = plus tot dans le SP = plus stable en cache)
# target: "all" ou liste de roles. "self" = role de l'agent (implicite).
# cacheable: true si le contenu ne change pas entre sessions (beneficie du cache prompt)
# required: true si l'absence est une erreur fatale

blocks:

  anthropic-lcars:
    path: ../anthropic-lcars.md
    position: 1
    target: all
    cacheable: true
    required: true
    separator: "\n\n<!-- === LCARS FLEET — mandatory core rules === -->\n"
    description: "Base Anthropic SP expurge + overlay LCARS. Upstream, ne pas editer."

  core:
    path: core/#*.md
    type: glob
    sort: alpha
    position: 2
    target: all
    cacheable: true
    required: true
    description: "8 fichiers fondamentaux (#0 axiomes → #7 shell). Ordre par prefixe."

  organisation/topologie:
    path: organisation/topologie.md
    position: 3
    target: all
    cacheable: true
    required: false
    separator: "\n<!-- === LCARS FLEET — organisation === -->\n"
    description: "Qui fait quoi. Tiers, scopes, escalade, containment. Tous les agents en ont besoin."

  organisation/infrastructure:
    path: organisation/infrastructure.md
    position: 3
    target: [starfleet, architect, engineer, reviewer, consultant]
    cacheable: true
    required: false
    description: "Comment c'est construit. IPC, chemins, git, deploy, permissions."

  organisation/workflow:
    path: organisation/workflow.md
    position: 3
    target: [starfleet, architect, engineer, dev, qualifier, reviewer, documenter, researcher, consultant]
    cacheable: true
    required: false
    description: "Comment on travaille. Edition, plans, conventions, code."

  protocole:
    path: user/protocole.md
    position: 4
    target: [starfleet, architect, consultant]
    cacheable: true
    required: false
    description: "Protocole utilisateur. Frozen."

  role:
    path: roles/{role}.md
    position: last
    target: self
    cacheable: false
    required: true
    description: "Fichier role par agent. Toujours en dernier."

# --- CLAUDE.md (v7 #04 decision: Option B — two explicit layers) ---
# system-prompt.md = fleet rules (assembled by build-sp.sh from this manifest)
# CLAUDE.md = user entry point / override (always injected, even if near-empty)
# Separation is by design, not accident. CLAUDE.md @imports below are deployed by deploy-claude.sh.
claude_imports:

  protocole-user:
    path: user/protocole-user.md
    target: all
    mechanism: "@import"
    deployed_as: "~/sp-sources/user/protocole-user.md"
    description: "Personnalisation mots-cles utilisateur."

  profile:
    path: user/profile.md
    target: interactive
    mechanism: "@import"
    strip_for: headless
    deployed_as: "~/sp-sources/user/profile.md"
    description: "Profil utilisateur. Retire pour agents headless."

# --- Modes de chargement (pour --bare et variantes) ---
# Chaque mode definit quels blocs sont inclus.
# fleet.yaml peut specifier mode: au lieu de system_prompt: [].
# v7 #04: modes reflect actual distribution post-hardening.
# build-sp.sh reads system_prompt: from fleet.yaml per agent (not modes).
# Modes are reference documentation for --bare and manual invocations.
modes:
  full:
    blocks: [anthropic-lcars, core, organisation/topologie, organisation/infrastructure, organisation/workflow, protocole, role]
    description: "Tous les blocs — Tier 0 interactif (starfleet, architect, consultant)."

  standard:
    blocks: [anthropic-lcars, core, organisation/topologie, organisation/workflow, role]
    description: "Base + topologie + workflow — Tier 1+2 workers."

  bare:
    blocks: [core, role]
    description: "Sans Anthropic — agent avec directives LCARS uniquement."

  minimal:
    blocks: [role]
    description: "Identite seule — agent vierge pour tests."

# --- Contraintes d'assemblage ---
assembly:
  default_separator: "\n"
  output: "{home}/.claude/system-prompt.md"
  idempotent: true
