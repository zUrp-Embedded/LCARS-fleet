# =============================================================================
#  ROLE : dev — celui qui ecrit le code
# =============================================================================
#
# Un fichier de ce dossier decrit UN role. Le nom du fichier n'a aucune importance :
# c'est `metadata.name` qui fait foi, et c'est ce nom que les cartes appellent.
#
# CE QU'UN ROLE DECIDE, ET CE QU'IL NE DECIDE PAS — la distinction fondatrice :
#
#   Le ROLE dit ce qu'un agent a le DROIT de faire, ce qu'il RECOIT, ce qu'il REND,
#   et combien de temps il VIT.
#   La CARTE (workflow/canon/workflow_maps/) dit QUI fait quoi, DANS QUEL ORDRE,
#   SUR QUELLE BRANCHE, et QUI JUGE QUOI.
#
# Donc : ne cherchez pas ici sur quelle branche le dev travaille, ni a quelle etape
# du pipeline il intervient. Ce n'est pas une omission — ces deux questions se
# repondent par ticket, dans la carte, et le meme role sert plusieurs pipelines.
#
# Le contrat complet du fichier : cap-profile-v2.5.json (cote runtime). Les objets
# y sont FERMES : une cle inventee n'est pas ignoree, elle refuse le demarrage.
# -----------------------------------------------------------------------------

kind: CapabilityProfile

metadata:
  # Le nom appele par les cartes (`steps.<etape>.role: dev`) et par le jury.
  name: dev

  # bwrap = l'agent tourne dans un bac a sable. C'est la seule valeur a utiliser.
  # L'autre valeur de l'enum (`none`) fait tourner l'agent a nu sur la machine :
  # elle existe pour des tests du runtime, et la porte de spawn la refuse.
  containment: bwrap

  # Un entier 0..15, UNIQUE dans le catalogue. Il sert d'identifiant de role dans
  # l'identifiant de session, et il porte UNE semantique a connaitre :
  #   0  = orchestrateur global, JAMAIS tue par le menage automatique.
  #   1+ = role ordinaire.
  # Ce catalogue n'a pas d'orchestrateur global permanent, donc 0 reste libre.
  role_index: 2

spec:
  # --- Les responsabilites structurelles ------------------------------------
  #
  # C'est la cle la PLUS importante du catalogue, et la moins evidente.
  #
  # Le runtime ne connait aucun nom de role. Il ne sait pas ce qu'est un « dev ».
  # Quand il a besoin de savoir QUI produit, QUI signe une fusion, QUI tranche un
  # conflit, il cherche le role qui DECLARE la capacite correspondante ici.
  #
  # Les cinq capacites, et la regle de cardinalite que le demarrage verifie :
  #
  #   producer          celui qui fabrique le livrable     >= 1 (plusieurs est normal)
  #   exception_judge   celui qui signe la fusion          == 1 exactement
  #   conflict_resolver celui qui tranche un blocage       == 1 exactement
  #   project_delegate  celui qui arbitre pour un projet   == 1 exactement
  #   onboarder         celui qui peut accueillir un projet
  #
  # Zero ou deux sur une capacite unique : le demarrage REFUSE et nomme le probleme.
  # C'est voulu — un catalogue incoherent doit tomber au deploiement, pas au premier
  # ticket, trois heures plus tard, loin de la cause.
  #
  # Corollaire : renommer `dev` en `frontend` ne casse rien, tant que la capacite
  # reste declaree. Les noms de role vous appartiennent.
  capabilities: [producer]

  # --- Ce que l'agent a le droit de faire -----------------------------------
  scope:
    # La liste des outils Claude Code autorises. Tout ce qui n'est pas ici est absent.
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      # Monitor + ToolSearch : le rail par lequel le runtime reveille le pod et lui
      # remet du travail. Un role qui recoit des taches en a besoin.
      - Monitor
      - ToolSearch
      # Bash GENERIQUE, et c'est delibere : npm, git local, les tests, le build.
      # Ne PAS restreindre Bash a une liste de commandes — la moindre commande hors
      # liste declenche une demande de permission a laquelle personne ne repond, et
      # le pod se fige. Ce qui borne reellement l'agent est ailleurs :
      #   - le bac a sable, qui decide des dossiers accessibles ;
      #   - `git_ops_denied` ci-dessous, qui coupe les operations git dangereuses.
      - Bash
      - TaskCreate
      - TaskUpdate
      - TaskList
      - TaskGet
      - TaskStop

    disallowedTools:
      # Ce dev ne navigue pas sur le web. Les noms vont par PAIRES : les minuscules
      # sont les outils cote serveur Anthropic, les capitalises sont les outils de
      # Claude Code dans le pod. Fermer une face laisse l'autre ouverte.
      - web_search
      - web_fetch
      - WebSearch
      - WebFetch
      # Execution de code hors du pod — inutile ici, le pod a deja Bash.
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash

    # Operations git INTERDITES a l'agent, meme s'il a Bash.
    #
    # `push` merite son explication, parce que c'est un choix d'architecture et pas
    # une precaution : le dev commite dans son espace de travail, et c'est le SYSTEME
    # qui pousse, apres avoir verifie l'identite de l'auteur et l'absence de secrets.
    # L'agent ne voit donc jamais la forge. Il ne peut pas ouvrir de ticket, pas
    # commenter, pas fusionner — il code, il rend, le systeme publie.
    git_ops_denied: [push]

  # --- Ce que l'agent sait --------------------------------------------------
  knowledge:
    # Les skills (skills/canon/) montees dans ce pod. Liste blanche : [] = aucune.
    skills: []
    # Deux mecanismes de memoire longue, non utilises par ce catalogue.
    monk_registry: null
    monk_instance: null

  # --- Comment l'agent est lance et combien de temps il vit -----------------
  invocation:
    # QUATRE valeurs, et le choix se fait sur UNE question :
    # l'agent doit-il se souvenir de ce qu'il a fait au tour precedent ?
    #
    #   one-shot  il fait sa tache et meurt. Pour un juge : chaque verdict doit etre
    #             rendu sur piece, sans souvenir du precedent.
    #   pipe      il reste vivant et se fait re-briefer. Pour un producteur : quand
    #             une revue renvoie son travail a corriger, il se souvient du
    #             pourquoi de ses choix. Le relancer a froid, c'est le faire
    #             redecouvrir son propre code.
    #   run       la duree d'un cycle complet.
    #   forever   il vit tant que son projet vit.
    lifetime_scope: pipe

    # Sur quoi la place du pod est indexee :
    #   instance  un pod par TICKET — deux tickets, deux devs en parallele.
    #   project   un pod pour tout le depot, re-briefe entre les tickets.
    #
    # `instance` avec `pipe` : le dev d'un ticket survit aux corrections DE CE
    # ticket, et meurt avec lui. C'est le reglage naturel d'un producteur.
    slot_scope: instance

    # Modele et effort de raisonnement. Ce sont les deux reglages a bouger en
    # premier si le cout ou la qualite ne vous conviennent pas.
    model: opus
    effort: high

    # false : ce role n'est pas lance au demarrage de la flotte, il est lance
    # quand un ticket le demande.
    boot_at_start: false

    # null : l'agent execute son brief lui-meme. Une valeur ici delegue le travail
    # a un sous-agent (voir `code-reviewer`, qui en utilise un).
    # Attention : un sous-agent impose `lifetime_scope: one-shot`.
    subagent_template: null

    host_native: false
    bridge_enabled: false

  # --- Les modes operatoires -------------------------------------------------
  #
  # Un modop est un fragment d'instructions ajoute au prompt du role pour inflechir
  # sa maniere de travailler (modop-bundles/<nom>/sp.md).
  #
  #   default      applique a chaque lancement, sans que la carte ait a le demander
  #   optional     une carte peut le demander par etape (`steps.<etape>.modops`)
  #   incompatible refuse en combinaison
  modop_set:
    default: []
    optional: [tdd]
    incompatible: []

  project: null

  # Combien de temps sans signe de vie avant que le runtime considere l'agent
  # bloque. 1800 s : une generation longue sur un gros fichier depasse largement
  # quelques minutes, et couper un producteur au milieu coute plus que d'attendre.
  timeouts:
    response_sec: 1800

  # --- Le couple entree / sortie, et pourquoi il se lit en une fois ----------
  #
  # Ces trois cles vont ensemble et decrivent la meme chose vue de trois cotes.
  # C'est le pivot du fichier : un producteur et un juge different d'abord ici.
  #
  #   brief_kind: worker      l'agent recoit un ORDRE et il AGIT
  #   deliverable_mode:       il rend du CODE COMMITE dans son espace de travail
  #     git_native
  #   interlocutor: fleet     personne n'est au bout du fil — il ne pose pas de
  #                           questions, il fait et il rend
  #
  # Comparez avec `code-reviewer` : judge / payload / fleet. Meme moteur, quatre
  # cles differentes, un metier different.
  brief_kind: worker
  deliverable_mode: git_native
  interlocutor: fleet
