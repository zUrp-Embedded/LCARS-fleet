# =============================================================================
#  ROLE : tech-lead — l'interlocuteur humain, et l'arbitre du projet
# =============================================================================
#
# A LIRE APRES `dev.yaml`. C'est le seul role de ce catalogue avec lequel un humain
# discute. Tous les autres travaillent sans personne au bout du fil.
#
# TROIS CAPACITES SUR UN SEUL ROLE, et c'est le point a comprendre :
#
#   onboarder          il peut accueillir un nouveau projet dans la flotte
#   project_delegate   il arbitre pour ce projet (un seul par catalogue)
#   conflict_resolver  il tranche un blocage epuise (un seul par catalogue)
#
# Le catalogue de reference de LCARS distribue ces trois-la sur trois roles
# differents, parce qu'il modelise une organisation avec un accueil permanent, un
# architecte par projet et un arbitre de dernier recours. Une equipe web de cinq
# personnes n'a pas ces trois personnes : elle a un lead.
#
# LA REGLE GENERALE : une capacite se pose sur le role que VOTRE metier a, pas un
# role par capacite. Le runtime ne demande pas trois personnes, il demande de
# savoir qui repond a trois questions. Il est parfaitement legitime que ce soit la
# meme.
#
# ET L'INVERSE EST VRAI AUSSI : le jour ou vous voulez un accueil separe de
# l'arbitrage — par exemple parce que le lead technique n'est pas celui qui ouvre
# les projets — vous creez un role, vous y deplacez `onboarder`, et rien d'autre ne
# bouge. C'est une ligne de YAML, pas une modification du runtime.
# -----------------------------------------------------------------------------

kind: CapabilityProfile

metadata:
  name: tech-lead
  containment: bwrap
  role_index: 1

spec:
  capabilities: [onboarder, project_delegate, conflict_resolver]

  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - Monitor
      - ToolSearch
      # Le SEUL role a qui on ouvre le web : il redige des tickets, et pour cela il
      # a parfois besoin de verifier une API ou une version de bibliotheque.
      # Attention aux PAIRES de noms : `WebSearch`/`WebFetch` capitalises sont les
      # outils qui tournent DANS le pod ; `web_search`/`web_fetch` en minuscules
      # sont leurs jumeaux cote serveur, refuses plus bas. Ouvrir une face sans
      # fermer l'autre laisse deux chemins la ou on en voulait un.
      - WebSearch
      - WebFetch
      # Le canal forge. C'est ce qui distingue reellement ce role des autres : il
      # peut ouvrir un ticket et repondre dessus, EN SON NOM. Tous les autres roles
      # sont aveugles a la forge — ils recoivent leur travail et rendent leur
      # resultat par le runtime, qui publie a leur place.
      #
      # Retirer ces lignes ne casse rien : vous obtenez un lead qui lit et conseille
      # sans pouvoir ouvrir de ticket. C'est un choix defendable si vous voulez que
      # tous les tickets viennent d'un humain.
      - mcp__fleet__create_issue
      - mcp__fleet__get_issue
      - mcp__fleet__get_issue_status
      - mcp__fleet__list_issues
      - mcp__fleet__comment_issue
      - mcp__fleet__list_escalations
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Liste VIDE, seul role du catalogue dans ce cas : le lead travaille dans son
    # propre espace de lecture du projet et n'y produit pas de livrable juge. Il
    # n'est pas un producteur — regardez `capabilities` : `producer` n'y est pas.
    git_ops_denied: []

  knowledge:
    skills: []
    monk_registry: null
    monk_instance: null

  invocation:
    # `forever` : il vit tant que son projet vit. Un lead qui redemarre a chaque
    # ticket redecouvre son projet a chaque ticket.
    lifetime_scope: forever
    # `project` (et non `instance`) : UN lead pour tout le depot, pas un par
    # ticket. C'est le pendant de `forever` — les deux disent « cet agent
    # appartient au projet », pas a une tache.
    slot_scope: project
    model: opus
    effort: high
    # false : il n'est pas lance au demarrage de la flotte, mais a l'accueil de son
    # projet. Ce catalogue n'a AUCUN role permanent lance au boot — les agents
    # apparaissent quand il y a du travail.
    boot_at_start: false
    subagent_template: null
    host_native: false
    # Les trois reglages du dialogue humain, et ils vont ensemble :
    #   remote_control  le pod est pilotable depuis l'exterieur
    #   bridge_enabled  le canal de conversation est ouvert
    #   wake_send_keys  on le reveille en lui ENVOYANT du texte, pas juste un signal
    # Un role `interlocutor: fleet` n'a besoin d'aucun des trois.
    remote_control: true
    bridge_enabled: true
    wake_send_keys: true

  modop_set:
    default: []
    optional: []
    incompatible: []

  project: null

  timeouts:
    response_sec: 3600

  # `worker` et non `judge` : il recoit des ordres et il agit — il ne rend pas de
  # verdict sur le travail d'un autre.
  brief_kind: worker
  # `both` : la flotte lui parle ET un humain lui parle. C'est la seule valeur de
  # ce catalogue qui autorise une question a un humain ; partout ailleurs, un agent
  # qui poserait une question attendrait indefiniment.
  interlocutor: both
