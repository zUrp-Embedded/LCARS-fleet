# Cap-profile: admiral
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# admiral = le SIEGE MACHINE du sysadmin ([BL-6-101], chantier admiral 2026-08-19). L'agent que
# l'admin lance A LA MAIN pour une seance de fix, et qu'il REGARDE travailler. HORS SANDBOX
# (`containment: none`) — sinon il n'a aucun interet : il doit pouvoir toucher le systeme.
#
# ⚠ LE SEUL PROFIL HORS SANDBOX DU CANON, ET IL NE S'ATTEINT QUE PAR UN GESTE NOMME :
#   * la porte generique refuse tout `containment: none` (SpawnAdmission, 422) — SAUF avec
#     l'acquittement explicite `host_native_ack: true`, que seul l'operateur pose
#     (`lcars admiral`). Aucun chemin automatique ne passe par cette porte avec ce champ ;
#   * aucune carte de workflow ne nomme ce role — le dispatcher ne peut pas le spawner ;
#   * `boot_at_start: false` + PermanentBoot exclut les host-native — le boot ne le lance pas.
#   Un DEUXIEME profil hors sandbox exige son propre arbitrage (le temoin de pre-condition du
#   control_router le refuse), jamais l'heritage de celui-ci.
#
# ⚠ RIEN NE SE KEY SUR LA CHAINE `admiral` (`00` §5) : ce nom est celui du PROFIL. Le siege OS est
# l'uid 1000 (GUARD A/B), le login forge est VARIABLE (celui de l'installeur), l'assignee des
# issues systeme est une projection (`45-sudoers-toolchain`). Le pod tourne sous l'uid du
# LANCEUR (un humain de fleet — GUARD B interdit le siege lui-meme d'etre en amont d'un pod) :
# c'est le « porteur a lui » de [BL-6-102].
kind: CapabilityProfile
metadata:
  name: admiral
  # vitrine: Votre poste | Le seul pod hors du bac à sable, sous votre uid — votre siège dans la boîte, obtenu à la main, jamais dispatché comme un agent.
  containment: none
  # Champ requis par le schema ; pour un pod hors sandbox il DOCUMENTE, il ne confine pas — le
  # mur d'egress est un objet bwrap (socket -> socat -> proxy), et ce pod n'en a aucun. `egress`
  # dit l'intention vraie : cet agent atteint la forge et le monde directement.
  network: egress
  # Pas de compte forge de ROLE : ses lectures forge passent par le master token que son skill
  # `system-issues` lit sur le disque (0640 root:lcars-admin — atteignable parce que la seance
  # tourne chez un humain que l'admin supervise, et par ssh/root en secours). Meme asymetrie
  # declaree que starfleet, meme champ.
  forge_identity: false
  # Hors sandbox : AUCUN mount a declarer — bwrap n'existe pas ici, le pod voit la boite.
  mounts: []
spec:
  capabilities: []
  brief_kind: worker
  # L'admin le lance et le REGARDE (`00` §8.2) : la surveillance attrape le visible et l'absurde.
  interlocutor: human
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - WebFetch
      - WebSearch
      - ToolSearch
      - TodoWrite
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # La baseline universelle (`baseline/git-denied.yaml`) porte les patterns destructifs ; rien
    # de plus ici — on ne protege pas la boite contre son admin (modele de menace, `01` §2).
    git_ops_denied: []
  knowledge:
    # Le skill `system-issues` N'EST PAS ICI, et c'est le dessin (`05` §7) : il vit dans le
    # `~/.claude` du SIEGE, pose par le provisioning, jamais dans le catalogue — un skill du
    # catalogue serait montable dans n'importe quel pod par deux fautes de frappe.
    skills: []
    monk_registry: null
    monk_instance: null
  invocation:
    # Une SEANCE de fix : l'agent vit le temps que l'admin le regarde, puis s'arrete.
    lifetime_scope: run
    slot_scope: instance
    # Face-humain (g24_17) : la porte doit exister — la seance est SA conversation.
    remote_control: true
    model: opus
    effort: high
    boot_at_start: false
    subagent_template: null
    host_native: true        # G24-12 : host_native exige containment none — les deux sont la
    wake_send_keys: false
    bridge_enabled: false
  modop_set:
    # `adresser-un-agent` est dans le default de TOUS les roles, et le contrat
    # `sp.adresser_un_agent` le tient. Ce n'est pas un mode commutable : il n'existe aucune conduite
    # ou il serait juste d'ecrire a un agent en le prenant pour un executant. Il ne doit donc
    # apparaitre dans AUCUN `incompatible:` — l'y nommer le retirerait legalement a un role.
    default: [long-session-discipline, adresser-un-agent]
    optional: []
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
