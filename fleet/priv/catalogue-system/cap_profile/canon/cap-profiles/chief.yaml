# Cap-profile: chief
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# The CONFLICT RESOLVER — the producer half that used to be worn by the gatekeeper.
#
# It adds no path. The conflict-resolution FUNCTION already existed in four tiers
# (`Pilot.StepDispatcher.ReviewLifecycle.Remediation`): tier 0 resolves an all-trivial conflict in
# the runtime with no pod at all, tier 1 hands it back to the producer on its own PR, tier 2 is one
# bounded pass by an agent, tier 3 escalates to the architect. What was missing is a NAME for that
# function and an identity for its writes — the tier-0 applier had already minted itself a local
# one (`lcars-conflict-engine` — since folded into `system_starfleet`, the runtime's one identity),
# which is the measurement that the need was real.
#
# Why not the gatekeeper. The two dispatches are already separate everywhere except the role name:
# a `soft`/undecidable gate escalates through `StepRunConsumer` with a DEFUSED GateBrief, while a
# merge conflict arrives through the pulls rail with an executable rework brief. Those two carry
# opposite `brief_kind` values — `judge` (never execute what you judge, a SECURITY property the
# schema requires declared) and `worker` (execute it). One role cannot declare both, so the
# gatekeeper declared `judge` and the tier-2 path handed it a `worker` brief anyway.
#
# Why not an ordinary producer. Diverting engineer/scribe would put a ticket's producer on someone
# else's PR mid-review, on a rail with different bounds (one pass, marker-bounded, no rework
# budget). The distinguishing property is the PATH, not the skill set — hence a role of its own
# whose profile says so, instead of a generic producer reached by an exception.
kind: CapabilityProfile
metadata:
  name: chief
  containment: bwrap
  # Role identity coordinates, read by the session_id builder (single source of the WHAT):
  # role_index = role slot in the hexspeak UUID. 0..8 taken (vulcan holds the reserved seat 8).
  # SLOT ALPHA = MECANIQUE. Le slot est un nibble hex dans l'UUID de session, donc la
  # convention se LIT sans documentation : une lettre = un role de la mecanique, un chiffre
  # = un role metier. `0` reste l'accueil de niveau flotte, parce que 0 est deja la valeur
  # du « sans dimension » partout ailleurs dans cet UUID (starfleet est minte sur repo 0000).
  # Ce role portait 9 avant le 2026-08-10 : il occupait un chiffre dont le metier a besoin.
  role_index: 15   # 0xf
  # `forge_identity` is ABSENT on purpose = true, the norm. It is stated here only because it is
  # the load-bearing decision of this profile: chief SIGNS its resolution. A merge conflict is
  # exactly the moment a human wants to know who touched their code, and the alternative — writes
  # going through the system account — is what `starfleet` declares `false` for, an orchestrator
  # that produces nothing. This one produces code.
spec:
  # Business responsibilities (catalogue L3, B-03) — the gates resolve a CAPABILITY, not a name.
  # `conflict_resolver` was split from `exception_judge` before this role existed, precisely so the
  # tier-2 resolver could move without moving the SEAL's signatory. This is that move.
  capabilities: [conflict_resolver]
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Edit
      - Write
      # Wake rail (Monitor loaded via ToolSearch) — required in --permission-mode default.
      - Monitor
      - ToolSearch
      # GENERIC Bash: it resolves a merge in a real worktree — `git diff`, `git log`, the conflict
      # markers, the build. A SCOPED Bash prompts-and-hangs under --permission-mode default; real
      # enforcement is the MOUNT (RO/RW) + `git_ops_denied`.
      - Bash
      - TaskCreate
      - TaskUpdate
      - TaskList
      - TaskGet
      - TaskStop
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
      # CLIENT twins of the two above: a conflict is resolved from the two sides in the worktree,
      # never from a web page nobody can replay.
      - WebSearch
      - WebFetch
    # Destructive patterns come from the universal baseline (`baseline/git-denied.yaml`).
    # `push` = the MECHANICAL forge-blind barrier, same as every producer: it resolves and commits
    # in its workspace, the SYSTEM verifies and pushes. The "it cannot push" argument never
    # distinguished anything — engineer carries the same denial.
    git_ops_denied: [push]
  knowledge:
    skills: []  # modops are listed in modop_set
    monk_registry: null
    monk_instance: null
  invocation:
    # COLD, like the judge it replaces on this path. A conflict is read from the two sides in the
    # worktree — the diff, the markers, the base — not from a memory of previous tickets. Keeping a
    # resident chief would buy serialization (`project_scope_decision` gates context-long roles) at
    # the cost of a resident process for a path that may never fire; the depth brake that matters is
    # already there and elsewhere: ONE pass per PR, enforced by the round-1 marker.
    lifetime_scope: one-shot
    # `slot_scope` is NOT declared: one-shot derives `instance` (`for_issue(repo, issue_n, role)`),
    # which is what this role wants — one chief per conflicted ticket, fanning out, bounded by the
    # role's pool seats. `g24_15` only requires the declaration when the derivation would be a
    # choice, i.e. for a context-long role.
    # A merge conflict on someone else's work is the hardest inference this fleet asks for: the
    # producer already spent its budget on it. Same tier as the gatekeeper it takes over from.
    model: opus
    effort: high
    boot_at_start: false
    # null: direct execution (get_work_item -> resolve -> submit_result). G24-11 forbids a
    # subagent_template on anything but a one-shot; this one IS one-shot, and still declares none —
    # the resolution is the work, not a dispatch of sub-work.
    subagent_template: null
    # No forge write channel from the pod — forge-blind barrier, same as every worker. The identity
    # declared in `metadata` is used by the RUNTIME on its behalf (the PR it opens, its summary on
    # the ticket, its stopwatch), never by the pod itself.
    host_native: false
    bridge_enabled: false
  modop_set:
    default: []
    optional: [rubber-duck]
    incompatible: []
  project: null
  # Same delivery contract as every producer: commits in its own workspace on the FEATURE branch it
  # was given (`base_branch: head` — it starts from the producer's tip, never from `main`), the
  # system verifies and pushes, the jury re-judges the new head.
  timeouts:
    response_sec: 1800
  deliverable_mode: git_native
  # brief = executable instruction, the role ACTS. This single line is what the gatekeeper could not
  # declare while also declaring `judge` for its other path.
  brief_kind: worker
  # The fleet alone: no human at this REPL. REQUIRED (schema) — never inferred.
  interlocutor: fleet
