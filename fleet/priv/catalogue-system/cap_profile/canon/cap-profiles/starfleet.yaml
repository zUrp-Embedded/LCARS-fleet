# Cap-profile: starfleet
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# starfleet = the GLOBAL fleet orchestrator (front-desk + project organizer) — the user-facing
# FLEET-LEVEL controller. SANDBOXED (bwrap) like a briefing role: it reads project code to frame and
# organizes repos, so it belongs INSIDE the sanctuary (the world is protected from it, and its doctrine
# is protected from the human's ~/.claude). NO root / NO host-native — the machine-tending concern
# (systemd/ACL/provisioning) belongs to `admiral`, the host-native seat; starfleet is a plain bwrap pod.
# (Reorg 2026-07-19: starfleet takes the global-orchestrator role; the arch specializes per-project.)
kind: CapabilityProfile
metadata:
  name: starfleet
  # vitrine: Le standard | Permanent. Il démarre la flotte, tient l'audit et sert de guichet quand aucun projet n'est en cause.
  containment: bwrap
  # SEUL AVEC starfleet a porter `egress` : ce role parle a un humain, et le priver du web le
  # castre — il cadre, il arbitre, il va chercher. Tous les autres roles restent au defaut
  # `vendor-only` : leur matiere de reference arrive par leur brief, leur lot, ou la face montee.
  # C'est une DECLARATION, pas une derivation : le jour ou un producteur en a besoin, il le dit.
  network: egress
  # Role identity (the metadata IS the single source of the WHAT): role_index = role slot in the
  # UUID — and 0 IS starfleet, the ONLY fleet-scoped pod (repo 0000 in its UUID, kill_class 0 →
  # `pkill -f 1badcafe`/`2badcafe` never touch it). The old `protected`/`fleet_level` bits are GONE
  # (reorg 2026-07-19): both collapsed into "role_index 0" once every other role went per-project.
  role_index: 0
  # NO forge identity (the EXPLICIT declaration of the one asymmetry, BL-6-45): starfleet holds
  # no forge account and no role token — every forge write it causes goes through the SYSTEM
  # (its MCP tools delegate; zero as_role("starfleet") site, measured). The four-list equality
  # check (catalogue == forge.tf == ROLES == PROV_ROLES) excludes it on THIS field — the
  # asymmetry lives here, in the data, never as an exception coded into the control.
  forge_identity: false
  # Large focal length (cf. DESIGN-carte-des-roles §2/§5): starfleet sees the WHOLE project space.
  # RW on both — NOT to edit files routinely (the onboarding skills do the structured
  # work, system-side), but as a LEVER to act as the human's hand when needed. Default runtime activity
  # is low. (An ordinary parametric pod: this wide RW mount is the only thing that sets its focal length.)
  # RO on both faces (user, 2026-08-05). The RW was declared for a "manual fix, an exceptional
  # intervention on the human's behalf" — a lever the nominal flow never uses: every portfolio
  # gesture goes through an MCP tool executed RUNTIME-side (`ProjectOnboard`), `project_revise_card`
  # included. What it bought was an exception; what it cost was the widest write surface in the
  # fleet, on every project present and future, held by the ONLY role with `interlocutor: both` —
  # the most steerable pod carrying the broadest hand.
  #
  # Closed knowingly, and the user said so: the exception path goes away with it, and a better
  # answer will be designed if its absence is felt. Losing a lever nobody pulled is cheaper than
  # keeping one anybody can.
  # The second mount used to name `/home/projects.work` and describe it as "the DOC" — TRUE when it
  # was written, because a project then had ONE non-code tree holding everything. The three faces
  # split it, and this mount did not follow: it kept pointing at the tree that became the RECORD
  # (briefs, verdicts, provenance) while its comment still promised the drafting one. What this
  # role needs is the upstream of tickets, so the mount follows the intent, not the old path.
  #
  # Consequence, deliberate: NO pod reads the ops tree any more. What was asked, what was judged
  # and what was proven are readable by the runtime and by a human on the box — by nothing else.
  # The face enum already made that tree unwritable by any producer; this makes it unread too.
  mounts:
    - path: /home/projects        # RO: read any project, act on it only through the runtime verbs
      mode: ro
    - path: /home/projects.workshop    # RO: the drafting face — backlog, plans, specs, upstream of tickets
      mode: ro
spec:
  # Business responsibilities (catalogue L3, B-03) — the gates resolve a CAPABILITY, not a name.
  capabilities: [onboarder]
  # Worker role (interactive front-desk): brief = executable instruction, never a judge. REQUIRED (schema).
  brief_kind: worker
  # Fleet AND human on the same terminal: front-desk reached through Claude Desktop, and still
  # dispatched by the fleet. Both contracts are injected. REQUIRED (schema).
  interlocutor: both
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - WebFetch       # PascalCase: native Claude Code tool, allowed pod-side
      - WebSearch
      - ToolSearch     # loads the deferred tools (Monitor, mcp__fleet__*)
      - Monitor        # wake-by-flag (watch.sh) — wake without content send-keys
      # 6-136 — MÊME RAISON QUE POUR L'ARCHITECT, ET C'EST LE MÊME MODOP. `brainstorming` est en
      # `modop_set.optional` ici aussi et ordonne un `TodoWrite` que ce rôle n'avait pas. Sous
      # `--permission-mode default`, l'absence ne fait pas éviter l'outil : elle fait PROMPTER, et
      # le pod gèle en tenant son créneau (mesuré sur banc le 2026-08-09, cf. architect.yaml).
      # ⚠ LA RAISON CI-DESSUS A CHANGÉ LE 2026-08-19 (sortie de superpowers) : le bundle
      # `brainstorming` qui ORDONNAIT ce TodoWrite n'existe plus. L'outil RESTE, et c'est
      # délibéré — le retirer parce que son commanditaire a disparu rejouerait exactement le
      # gel 6-136 : sous `--permission-mode default`, un outil absent d'`allowedTools` ne se
      # saute pas, il PROMPTE, et un pod n'a personne pour répondre. La règle écrite plus haut
      # tient toute seule sans le modop : la liste couvre ce que le rôle peut LÉGITIMEMENT
      # atteindre, et un rôle de conception atteint légitimement une liste de tâches.
      - TodoWrite
      # Fleet MCP tools of the FLEET-MASTER: ONLY the portfolio head (create/adopt a project + card
      # framing). NOT the delegation head (create_issue/status/escalations/comment) — that stays the
      # per-project architect (cf. DESIGN-carte-des-roles §5/§13: starfleet manages the box from outside,
      # it does not do a project's métier). The universal work-item pair comes from the launcher.
      # L'OFFRE, PUIS LES CARTES — dans cet ordre, parce qu'une carte appartient a un catalogue et
      # que `project_create` refuse un catalogue qui n'est pas installe ici. Sans ce premier verbe,
      # ce role repondait « quels catalogues ? » en DERIVANT `card_list` : juste tant que chaque
      # catalogue installe porte au moins une carte, et faussement court des qu'un n'en porte pas.
      - mcp__fleet__catalogue_list  # framing FIRST: the offer a project is enrolled INTO
      - mcp__fleet__card_list  # then the cards of that offer, each naming its catalogue
      - mcp__fleet__project_create       # start a fresh project (repo + its three faces + card)
      - mcp__fleet__project_install       # twin of project_create: ADOPTS an existing repo
      - mcp__fleet__project_open         # third verb: RELAUNCH a project already on the machine
      - mcp__fleet__project_revise_card  # BL-6-29: revise an engraved card (human chooses, future tickets only)
      - mcp__fleet__project_close        # BL-6-30: park a project (marker issue; running brick finishes, next never starts)
      - mcp__fleet__project_adopt        # BL-6-32: publish a disk-only project (inverse of import; local content never overwritten)
      - mcp__fleet__project_publish      # phase-2: publish a LINKED project OUT to its external forge (gh/glab, rolling PR/MR, async). Onboarder-gated; starfleet emits the request, the token stays host-side, never in a pod. Was UNREACHABLE (tool existed, no grant) — this line is the fix.
      # LES DEUX VERBES DU DEPOT, et leur absence ici etait un piege actif : le SP de ce role decrit
      # le flux depuis le 2026-08-11, et un outil hors `allowedTools` sous `--permission-mode
      # default` ne se contente pas d'etre absent — il PROMPTE, et le pod GELE en attendant une
      # reponse que personne ne donne (mesure 2026-08-09, plus haut dans ce fichier). Une doctrine
      # qui decrit une surface non accordee ne rate pas : elle bloque.
      - mcp__fleet__deposit_list        # ce que l'humain a pousse dans son espace perso et que la fleet ne porte pas
      - mcp__fleet__deposit_import       # la TROISIEME porte : reprendre ce depot dans l'org d'un catalogue
      # LE PENDANT LECTURE des gestes projet ci-dessus, et il manquait : sans lui ce role repond
      # « quels projets ? » par ce qu'il devine, alors que l'outil rend la carte GRAVEE, le
      # `card_source` (declaree par un humain / jamais declaree / illisible) et le `state`. Un
      # projet qui n'a rien declare n'est pas un projet qui a choisi le defaut.
      - mcp__fleet__project_list        # BL : l'inventaire avec sa carte, sa source et son etat
      - mcp__fleet__project_import  # BL-6-31: repatriate from GitHub/GitLab (adoption gate: foreign .claude refused, CLAUDE.md filtered)
      - mcp__fleet__forge_list          # les forges externes du pool de l'humain (read-only) — pour proposer un lien de publish
      - mcp__fleet__forge_link        # lie un projet a une forge (ecrit le binding) — intention reversible, PAS un push (approve + merge restent les gates)
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Destructive patterns come from the universal baseline (`baseline/git-denied.yaml`) — not duplicated.
    git_ops_denied: []
    # (no `outputs`: the ready-room/outbox line came from the machine-tending role starfleet used to
    # carry — the fleet-master produces no deliverable to a commons dir. Removed 2026-07-19.)
  knowledge:
    # Pruned 2026-08-02 (BL-6-22): memory-query/brainstorming/plan named skills that never
    # existed (cf. architect.yaml, same note). card-revision is the FIRST real one — the
    # card-revision interview for revise_project_card (BL-6-29's skill half), mounted RO at
    # ~/.claude/skills/card-revision by the launcher.
    skills:
      - card-revision
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: forever  # permanent front-desk
    # DECLARED, not derived (g24_15): one starfleet per fleet, the same identity for its whole
    # life. Same reason as the architect — the derivation agrees, and that is not the point.
    slot_scope: project
    # DECLARED (g24_16): `interlocutor: both` — the fleet-level front desk a human talks to.
    # Invisible would make the door unreachable.
    remote_control: true
    model: opus
    effort: high
    # ACTIVATED (reorg 2026-07-19): starfleet is the boot front-desk (the arch → on-demand per-project).
    # The onboarding gate admits starfleet (require_onboarder) AND the forge is provisioned on the TEST
    # forge (account in org Owners — create+delete proven — + role token deployed at the layout). The
    # WORK forge (NAS) needs the same forge-master gesture at its next deploy.
    boot_at_start: true
    subagent_template: null
    host_native: false       # `admiral` is the host-native seat; this one is an ordinary sandboxed pod
    # Human-terminal class (like the architect): the REPL is the human's conversation (Desktop
    # bridge) — NO kick send-keys at all, engage included (live 2026-07-19: a resumed starfleet took
    # the bootstrap engage drizzle ~3 min to the cap). Flag-only; the human/bridge side is the armer.
    wake_send_keys: false
    bridge_enabled: true     # user-facing front-desk → needs the Desktop bridge (like the arch)
    # (no `rubber_duck_enabled`: it is a DEAD flag — zero consumer in lib/ (the rubber-duck behaviour
    # lives in the modops/SP). Removed here 2026-07-19; the full field nuke is on the sabrer-list.)
  modop_set:
    # `adresser-un-agent` : dans le default de TOUS les roles, tenu par le contrat
    # `sp.adresser_un_agent`. Il arrive par l'ENVELOPPE (`sp_template.eex`, `@modop_fragments`), donc
    # il atteint ce role et l'architecte SANS toucher a leur SP ecrit a la main — la composition par
    # blocs, elle, leur est fermee (`Blocks.audit!` : une seule source par role, jamais deux).
    default: [long-session-discipline, adresser-un-agent]
    # ⚖ USER 2026-08-19 — SORTIE DE SUPERPOWERS. Les bundles retirés de cette liste (brainstorming)
    # étaient dérivés de superpowers et INERTES : aucun appelant de production n'active un
    # bundle `optional` (`CapProfile.resolve/4` est toujours appelé à deux arguments), donc
    # ils étaient livrés et jamais composés. Le tri n'a rien trouvé à rapatrier — leur
    # doctrine était soit importée telle quelle, soit déjà couverte par nos propres blocs.
    optional: [rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
