# Manifeste du CATALOGUE SYSTEME — la mecanique, pas le metier.
#
# CE QU'IL CONTIENT, ET POURQUOI CES QUATRE-LA
#
# Les roles que le RUNTIME va chercher lui-meme pour tenir sa propre mecanique. Le critere se teste
# seul : est-ce qu'une CARTE le nomme ? Un role nomme par une carte est du metier — c'est le
# producteur, c'est le juge. Un role que le runtime resout par capacite, sans que rien ne le
# selectionne, est de la mecanique.
#
#   starfleet    l'accueil de niveau flotte — role_index 0, existe avant tout projet
#   architect    le delegue du projet — le runtime l'`ensure` par depot
#   gatekeeper   le signataire du sceau — exactement un
#   chief        le resolveur de conflit tier-2 — exactement un
#
# Corollaire, et c'est la regle de tri : `producer` est la SEULE capacite selectionnable par carte.
# Les quatre autres — onboarder, project_delegate, exception_judge, conflict_resolver — sont
# resolues par le runtime et uniques. Ce sont les capacites du catalogue systeme.
#
# CE QU'IL N'EST PAS : un catalogue qu'on remplace. Il n'a pas de molette, il est embarque et
# resolu comme les schemas et les planchers. Un operateur apporte son METIER ; il ne choisit pas sa
# mecanique. C'est ce qui rend verifiable la phrase « ce catalogue est complet » : le systeme est
# present et intact, le metier est conforme.
#
# LES MODES OPERATOIRES qui vivent ici y sont parce que des roles systeme les declarent. Ils
# restent visibles du metier par l'union des deux racines : un catalogue metier en herite sans les
# recopier, et ajoute les siens. Un meme nom des deux cotes est un REFUS — un nom doit vouloir dire
# une seule chose.

api_version: 1
