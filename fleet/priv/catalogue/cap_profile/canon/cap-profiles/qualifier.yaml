# Cap-profile: qualifier
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: qualifier
  containment: bwrap
  # Role identity coordinates, read by the session_id builder (single source of the WHAT):
  # role_index = role slot in the hexspeak UUID.
  role_index: 4
spec:
  # PR judge ("the tests are honest" — a REVIEW). Receives a DEFUSED GateBrief (context +
  # deliverable + verdict contract, NO executable instruction — I-CBC) instead of the issue
  # body: without it (default `worker`) the qualifier would EXECUTE the build instead of
  # judging it. Entry dual of deliverable_mode (output = `payload` default: a verdict, not a git patch).
  brief_kind: judge
  # The fleet alone: no human at this REPL. `engage` opens a work-item cycle and there is nobody
  # to answer. REQUIRED (schema) — never inferred.
  interlocutor: fleet
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # GENERIC Bash (git read + mix test/pytest + shell). A SCOPED Bash pattern-list hangs in
      # --permission-mode default (off-pattern command -> prompt). Real enforcement = the MOUNT
      # (RO/RW) + git_ops_denied (push/rebase hard-denied -> forge-blind).
      - Bash
      # Report writing: Write/Edit bounded by the RW MOUNT (not by the tool-list).
      - Write
      - Edit
      # Wake rail (Monitor loaded via ToolSearch) — required in --permission-mode default.
      - Monitor
      - ToolSearch
      # LA MESURE, ET ELLE NE DONNE AUCUN ACCES. Ce role juge un LIVRABLE : sans elle son verdict
      # sur la pertinence d'une suite est une opinion, et une carotte qui controle une opinion est
      # un RNG en uniforme. L'outil ne prend qu'un NOM de sonde — depot, PR, SHAs et chemins de
      # preuve viennent du canal et des declarations du projet, jamais du fil (§10c : un juge qui
      # choisirait sa base choisirait celle qui l'arrange).
      #
      # Ni `scoper` ni `gatekeeper` ne l'ont, et l'omission est une decision : le scoper juge un
      # BRIEF, le gatekeeper juge une EXCEPTION. Aucun des deux n'a de livrable sous les yeux, donc
      # aucun des deux n'a rien a mesurer — leur donner l'outil ouvrirait un dispatch de runner
      # pour une question qu'ils ne posent pas.
      - mcp__fleet__run_probe
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
      # CLIENT twins of the two above: `web_search`/`web_fetch` deny Anthropic's SERVER-SIDE
      # tools, `WebSearch`/`WebFetch` are the Claude Code tools running INSIDE the pod. Denying
      # one face leaves the other open. This role does not browse: both faces are closed.
      - WebSearch
      - WebFetch
    # `push --force` and `reset --hard` come from the universal baseline
    # (`baseline/git-denied.yaml`) — not duplicated here. Qualifier-specific
    # restrictions remain: no push (verdict-only) and no rebase (preserves
    # the tested history).
    git_ops_denied: ["push", "rebase"]
  knowledge:
    skills: []  # modops are listed in modop_set
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    # ⚖ USER 2026-08-19 — RETOUR À OPUS. Le passage en sonnet était un contournement de banc (pluie
    # de 529 sur opus le 18), pas un arbitrage. Et le doc 04 du chantier rails l'argumentait déjà
    # dans l'autre sens : juger un faux-vert est une tâche d'ADVERSAIRE, pas de conformité — c'est
    # le juge dont les findings alimentent la courbe de tolérance de la carte, et il était le moins
    # cher des deux jurés.
    model: opus        # catalogue -> --model (alias or full name; tunable)
    effort: high       # catalogue -> --effort {low,medium,high,xhigh,max}; tunable
    boot_at_start: false
    # ⚖ USER 2026-08-19 : PAS de superpowers chez les juges (pour le moment). Débranché, et trois
    # faits mesurés qui vont dans le même sens que la décision :
    #   1. AUCUN SOUS-AGENT N'EXISTE. `subagent_template` est un fragment de SP concaténé dans le
    #      prompt du juge lui-même (`SPBuilder.compose` → `sp_md <> agent_draft`). Rien n'est
    #      spawné, rien n'est délégué : le juge lisait « Tu es un spec-reviewer subagent … Meurs »
    #      à propos de LUI-MÊME. Le mot « subagent » est un fossile de la provenance du texte.
    #   2. LE FRAGMENT DÉCRIT UNE ARCHITECTURE QUI N'EST PAS LA NÔTRE : il fait lire `spec.md` et
    #      `plan.md`, que le template de projet LCARS ne contient pas (il livre `CLAUDE.md` et
    #      `README.md`). On demandait à un juge de lire des fichiers qui n'existent pas.
    #   3. IL PORTAIT UN SECOND CONTRAT DE SORTIE SANS DESTINATION : « Genère JSON output » (forme
    #      `verdict`/`severity_max`/`issues`) suivi de « Meurs » — aucun `submit_result`, aucun
    #      payload. Le juge tenait donc DEUX contrats pour la même matière, dont un aboutissant au
    #      vide, pendant que le rail réclamait `details.findings_v1` et le mesurait absent.
    # Ce qui était à NOUS dans ce fragment n'est pas perdu : le plancher mécanique conditionnel
    # (lot B) et la grille de sévérité sont rapatriés dans les blocs du catalogue (method/… et
    # core/judge-verdict), où ils sont composés par sp-map et régénérés par `mix lcars.sp.gen`.
    subagent_template: null
    host_native: false
    bridge_enabled: false
    # `true` depuis le 2026-08-11 — LEVEE DU CONTOURNEMENT (design slots-desktop du 2026-07-19,
    # valide user). Cette ligne portait `false` avec pour motif « ephemeral, churny judge » : un juge
    # creait un slot Desktop neuf a chaque passage, donc on l'a rendu invisible plutot que STABLE.
    # C'etait traiter le symptome. Le socle qui rend l'identite stable existe maintenant —
    # `SeedStore.capture_slot_bridge/2` (capture + fusion de la ligne bridge_status) et
    # `Scaffold.maybe_recall_restore/1` (resume-si-graine) — et la capture est ARMEE PAR CE DRAPEAU
    # (`pod.ex:265`, « a no-RC pod never registers »). Le mettre a `true`, c'est donc allumer le
    # mecanisme, pas ajouter du churn : le slot se RE-ATTACHE au lieu de se multiplier.
    remote_control: true
  modop_set:
    default: []
    # ⚖ USER 2026-08-19 — SORTIE DE SUPERPOWERS. Les bundles retirés de cette liste (dual-review)
    # étaient dérivés de superpowers et INERTES : aucun appelant de production n'active un
    # bundle `optional` (`CapProfile.resolve/4` est toujours appelé à deux arguments), donc
    # ils étaient livrés et jamais composés. Le tri n'a rien trouvé à rapatrier — leur
    # doctrine était soit importée telle quelle, soit déjà couverte par nos propres blocs.
    optional: []
    incompatible: []
    # (fire-mode REMOVED — codex audit F-05 2026-07-19: its v1.5 output model — JSON on stdout,
    # self-exit one-shot — predates MCP submit_result and contradicted the runtime protocol; the
    # anti-conversation discipline lives in the base worker SP blocks.)
  project: null
