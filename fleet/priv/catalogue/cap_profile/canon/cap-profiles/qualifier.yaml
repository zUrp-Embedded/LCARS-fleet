# Cap-profile: qualifier
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: qualifier
  containment: bwrap
  # Role identity coordinates, read by the session_id builder (single source of the WHAT):
  # role_index = role slot in the hexspeak UUID.
  role_index: 4
spec:
  # PR judge ("the tests are honest" — a REVIEW). Receives a DEFUSED GateBrief (context +
  # deliverable + verdict contract, NO executable instruction — I-CBC) instead of the issue
  # body: without it (default `worker`) the qualifier would EXECUTE the build instead of
  # judging it. Entry dual of deliverable_mode (output = `payload` default: a verdict, not a git patch).
  brief_kind: judge
  # The fleet alone: no human at this REPL. `engage` opens a work-item cycle and there is nobody
  # to answer. REQUIRED (schema) — never inferred.
  interlocutor: fleet
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # GENERIC Bash (git read + mix test/pytest + shell). A SCOPED Bash pattern-list hangs in
      # --permission-mode default (off-pattern command -> prompt). Real enforcement = the MOUNT
      # (RO/RW) + git_ops_denied (push/rebase hard-denied -> forge-blind).
      - Bash
      # Report writing: Write/Edit bounded by the RW MOUNT (not by the tool-list).
      - Write
      - Edit
      # Wake rail (Monitor loaded via ToolSearch) — required in --permission-mode default.
      - Monitor
      - ToolSearch
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
      # CLIENT twins of the two above: `web_search`/`web_fetch` deny Anthropic's SERVER-SIDE
      # tools, `WebSearch`/`WebFetch` are the Claude Code tools running INSIDE the pod. Denying
      # one face leaves the other open. This role does not browse: both faces are closed.
      - WebSearch
      - WebFetch
    # `push --force` and `reset --hard` come from the universal baseline
    # (`baseline/git-denied.yaml`) — not duplicated here. Qualifier-specific
    # restrictions remain: no push (verdict-only) and no rebase (preserves
    # the tested history).
    git_ops_denied: ["push", "rebase"]
  knowledge:
    skills: []  # modops are listed in modop_set
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: sonnet        # catalogue -> --model (alias or full name; tunable)
    effort: high       # catalogue -> --effort {low,medium,high,xhigh,max}; tunable
    boot_at_start: false
    subagent_template: spec-reviewer
    host_native: false
    bridge_enabled: false
    remote_control: false  # invisible to Claude Desktop (ephemeral, churny judge) — no --remote-control
  modop_set:
    default: []
    optional: [dual-review]
    incompatible: []
    # (fire-mode REMOVED — codex audit F-05 2026-07-19: its v1.5 output model — JSON on stdout,
    # self-exit one-shot — predates MCP submit_result and contradicted the runtime protocol; the
    # anti-conversation discipline lives in the base worker SP blocks.)
  project: null
