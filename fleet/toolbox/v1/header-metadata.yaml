# header-metadata.yaml — GO-7 header definitions for apply-headers.py
#
# Adding a new file: add an entry here with module, subsystem, desc1, desc2.
# Set to null to explicitly exclude a file from header application.
#
# Usage: python3 fleet/toolbox/apply-headers.py [--dry-run]

files:
  .claude/hooks/check-secrets.sh:
    module: SECRET-GUARD
    subsystem: HOOKS / SECURITY
    desc1: Blocks commits containing hardcoded secrets.
    desc2: Scans staged files for credentials and API keys.
  .claude/hooks/on-prompt.sh:
    module: PROMPT-HOOK
    subsystem: HOOKS / LIFECYCLE
    desc1: Executed on every Claude prompt submission.
    desc2: Updates fleet state and manages context flow.
  .claude/hooks/on-stop.sh:
    module: ON-STOP
    subsystem: HOOKS / LIFECYCLE
    desc1: Writes action=shutdown status=done on clean exit.
    desc2: Fires on Stop event — NOT on crash or WSL reboot.
  .claude/hooks/post-directional-handoff-reminder.sh:
    module: HANDOFF-REMIND
    subsystem: HOOKS / IPC
    desc1: Reminds to update directional handoff files.
    desc2: Triggered after Write/Edit tool operations.
  .claude/hooks/pre-scope-check.sh:
    module: SCOPE-CHECK
    subsystem: HOOKS / SECURITY
    desc1: PostToolUse scope enforcement.
    desc2: Detects cross-boundary file writes per instance role.
  .claude/hooks/session-startup.sh:
    module: SESSION-INIT
    subsystem: HOOKS / LIFECYCLE
    desc1: Initializes instance state at session start.
    desc2: Sets FLEET_SESSION, loads instance identity.
  .claude/skills/cross-arm64/profiles/cds.yaml:
    module: CDS-PROFILE
    subsystem: SKILLS / CROSS-ARM64
    desc1: ''
    desc2: ''
  docker/entrypoint.sh:
    module: DOCKER-ENTRY
    subsystem: DOCKER / RUNTIME
    desc1: Docker entrypoint — starts fleet inside container.
    desc2: Sets up environment, launches services.
  docker-compose.yml: null
  fleet/colorize-handoff.py:
    module: HANDOFF-COLOR
    subsystem: FLEET / DISPLAY
    desc1: Colorizes handoff file output for terminal display.
    desc2: ANSI highlighting for STATE fields and roles.
  fleet/drift-check.sh:
    module: DRIFT-CHECK
    subsystem: HOOKS / LIFECYCLE
    desc1: Alerte si >= 10 commits depuis dernier audit.
    desc2: ''
  fleet/filter-build-output.py:
    module: BUILD-FILTER
    subsystem: FLEET / BUILD
    desc1: Filters compiler output for relevant messages.
    desc2: Strips noise, keeps errors, warnings, progress.
  fleet/fleet-action-done.sh:
    module: ACTION-DONE
    subsystem: FLEET / IPC
    desc1: Signals action completion in the fleet state.
    desc2: Updates action=done + notifies waiting instance.
  fleet/fleet-bug.sh:
    module: BUG-REPORT
    subsystem: FLEET / IPC
    desc1: Sends a bug report to starfleet via spool IPC.
    desc2: Used by dev/qualifier to surface issues.
  fleet/fleet-build-yaml.sh:
    module: BUILD-YAML
    subsystem: FLEET / CONFIG
    desc1: Generates fleet.yaml from template or profile.
    desc2: Blueprint builder utility.
  fleet/fleet-check-coherence.sh:
    module: CHECK-COHERENCE
    subsystem: FLEET / INTEGRITY
    desc1: deployed copies in each instance home.
    desc2: Reports drift via spool IPC — never auto-fixes.
  fleet/fleet-context-check.sh:
    module: CONTEXT-CHECK
    subsystem: HOOKS / LIFECYCLE
    desc1: Reads active JSONL to compute real context window %.
    desc2: Emits warning when soft threshold is reached.
  fleet/fleet-doctor.sh:
    module: FLEET-DOCTOR
    subsystem: FLEET / DIAG
    desc1: Automated fleet environment diagnostic.
    desc2: Checks instances, mounts, handoffs, claude, fleet-hub.
  fleet/fleet-done.sh:
    module: TASK-DONE
    subsystem: FLEET / STATE
    desc1: Marks the current task as done in STATE.
    desc2: Sets action=done, status=idle, clears blocker.
  fleet/fleet-env.sh:
    module: FLEET-ENV
    subsystem: CORE
    desc1: Centralized fleet paths and variables.
    desc2: Single source of truth for all fleet scripts.
  fleet/fleet-init-project.sh:
    module: INIT-PROJECT
    subsystem: FLEET / MEMORY
    desc1: Bootstraps agent context for a project.
    desc2: Injects filtered L2 domain memory + session-context.
  fleet/fleet-inject.sh:
    module: MSG-INJECT
    subsystem: FLEET / IPC
    desc1: Injects a message into a running Claude session.
    desc2: Uses tmux send-keys to deliver text to instance.
  fleet/fleet-l2-hits.sh:
    module: L2-HITS
    subsystem: FLEET / MEMORY
    desc1: Increments the hits counter in an L2 entry's frontmatter.
    desc2: Called by agents when an L2 entry proves useful.
  fleet/fleet-launch.sh:
    module: LAUNCHER
    subsystem: FLEET / LIFECYCLE
    desc1: Launches the fleet tmux session.
    desc2: 'v2: single-distro multi-user — sudo -u <user> -i'
  fleet/fleet-lock-cleanup.sh:
    module: LOCK-CLEANUP
    subsystem: FLEET / MAINT
    desc1: Removes stale lock files left by crashed builds.
    desc2: Safe to run when no active builds are running.
  fleet/fleet-maintenance.sh:
    module: MAINTENANCE
    subsystem: FLEET / CRON
    desc1: Routine StarFleet maintenance tasks (cron, shell only).
    desc2: Zero token cost — pure deterministic shell.
  fleet/fleet-restart.sh:
    module: RESTART
    subsystem: FLEET / LIFECYCLE
    desc1: Restarts a fleet instance in its tmux pane.
    desc2: Kills, re-sources, re-launches with clean state.
  fleet/fleet-sanitize-memory.sh:
    module: SANITIZE-MEMORY
    subsystem: FLEET / MEMORY
    desc1: Sanitizes MEMORY.md across all instances.
    desc2: 'Whitelist: Identity + Completed sections only.'
  fleet/fleet-send.sh:
    module: FLEET-SEND
    subsystem: IPC / SPOOL
    desc1: Spool-based IPC — replaces broker, inject, notify.
    desc2: Drops a message file into inbox/<dest>/, then wakes
  fleet/fleet-session-log.sh:
    module: SESSION-LOG
    subsystem: FLEET / METRICS
    desc1: Logs session duration at handoff/offline.
    desc2: 'Anti-corruption: long sessions = drift risk signal.'
  fleet/fleet-shutdown-clean.sh:
    module: SHUTDOWN-CLEAN
    subsystem: FLEET / LIFECYCLE
    desc1: Moves pending ACTIONS to DONE as [interrupted] on
    desc2: fleet shutdown. Keeps context clean for next boot.
  fleet/fleet-state.sh:
    module: STATE-MANAGER
    subsystem: FLEET / HANDOFF
    desc1: Updates STATE fields in the active handoff.
    desc2: 'Handles: action, status, blocker, ref, waiting.'
  fleet/fleet-system.yaml: null
  fleet/fleet-update.sh:
    module: FLEET-UPDATE
    subsystem: FLEET / LIFECYCLE
    desc1: Pull runtime from GitHub + deploy to all agents.
    desc2: Replaces self-update.sh. Single update entry point.
  fleet/fleet.yaml: null
  fleet/git-hooks/install-hooks.sh:
    module: INSTALL-HOOKS
    subsystem: GIT-HOOKS / SETUP
    desc1: Installs fleet git hooks into .git/hooks/.
    desc2: TPD protection, QA gate, GO-7 enforcement.
  fleet/handoff-trim.sh:
    module: HANDOFF-TRIM
    subsystem: FLEET / MAINT
    desc1: Trims handoff files to prevent unbounded growth.
    desc2: Keeps HEADER + STATE sections, rotates old logs.
  fleet/herald.sh:
    module: HERALD
    subsystem: FLEET / IPC
    desc1: Sends a signal with message to a fleet instance.
    desc2: Entry point for manual inter-instance messaging.
  fleet/lcars-test.sh:
    module: LCARS-TEST
    subsystem: TMUX / UI
    desc1: Layout réplique le monitor fleet.
    desc2: ''
  fleet/light_off.sh:
    module: LIGHT-OFF
    subsystem: FLEET / DISPLAY
    desc1: Turns off the status light indicator.
    desc2: Sends OFF signal to the physical or virtual LED.
  fleet/light_on.sh:
    module: LIGHT-ON
    subsystem: FLEET / DISPLAY
    desc1: Turns on the status light indicator.
    desc2: Sends ON signal to the physical or virtual LED.
  fleet/profiles/minimal.yaml: null
  fleet/profiles/standard.yaml: null
  fleet/provisioning/deploy.sh:
    module: DEPLOY
    subsystem: FLEET / INSTALL
    desc1: Syncs fleet/, .claude/, memory/ to each instance.
    desc2: ''
  fleet/provisioning/provision-fleet.sh:
    module: INSTALL
    subsystem: FLEET / INSTALL
    desc1: Real installer — called by bootstrap /install.sh.
    desc2: Runtime is already in place when this runs.
  fleet/provisioning/onboard-preflight.sh:
    module: ONBOARD-PREFLIGHT
    subsystem: FLEET / INSTALL
    desc1: Pre-flight checks for onboarding.
    desc2: 'Output: structured KEY=VALUE, one per line.'
  fleet/provisioning/post-install-offline.sh:
    module: POST-INSTALL-OFF
    subsystem: FLEET / INSTALL
    desc1: Post-install steps for offline/air-gapped setup.
    desc2: Runs without network access.
  fleet/provisioning/post-reboot.sh:
    module: POST-REBOOT
    subsystem: FLEET / INSTALL
    desc1: One-shot post-reboot fleet bootstrap.
    desc2: Copies credentials from wizard, provisions agents,
  fleet/provisioning/provision-spool.sh:
    module: PROVISION-SPOOL
    subsystem: FLEET / INSTALL
    desc1: Creates /var/spool/fleet/ directory tree.
    desc2: Must run with sudo. Idempotent.
  fleet/provisioning/provision-system.sh:
    module: PROVISION-SYSTEM
    subsystem: FLEET / INSTALL
    desc1: System-level provisioning. Blueprint-driven.
    desc2: --check = doctor (read-only, structured output).
  fleet/provisioning/provision-users.sh:
    module: PROVISION-USERS
    subsystem: FLEET / INSTALL
    desc1: Per-user provisioning. Blueprint-driven.
    desc2: Loops over fleet.yaml instances, sets up each home.
  fleet/rpi-img-mount.sh:
    module: RPI-MOUNT
    subsystem: FLEET / BUILD
    desc1: Mounts a Raspberry Pi image for inspection.
    desc2: Handles loop device setup and partition offsets.
  fleet/starfleet-notes-check.sh:
    module: NOTES-CHECK
    subsystem: FLEET / IPC
    desc1: Checks starfleet-notes.md for pending items.
    desc2: Alerts if unread notes remain after session end.
  fleet/tmux.conf:
    module: TMUX-CFG
    subsystem: FLEET / CONFIG
    desc1: tmux configuration for the architect-lead instance.
    desc2: Theme, keybinds, mouse, status bar.
  fleet/toolbox/apply-headers.py:
    module: APPLY-HEADERS
    subsystem: TOOLBOX / MAINT
    desc1: Idempotent — skips files already up-to-date.
    desc2: ''
  fleet/toolbox/backup-wsl.sh:
    module: BACKUP-WSL
    subsystem: TOOLBOX / MAINT
    desc1: Backs up the WSL2 environment to a tar archive.
    desc2: Exports distro, compresses, checks target space.
  fleet/toolbox/claude-update:
    module: CLAUDE-UPDATE
    subsystem: TOOLBOX / MAINT
    desc1: Updates Claude Code fleet binary via GCS direct download.
    desc2: SHA256 verified. Writes install metadata (fixes /doctor).
  fleet/toolbox/patch-json.py:
    module: PATCH-JSON
    subsystem: TOOLBOX / DEPLOY
    desc1: JSON settings patcher for deploy.sh.
    desc2: Hook registration + field updates. Idempotent.
  fleet/toolbox/check-backup.sh:
    module: BACKUP-CHECK
    subsystem: TOOLBOX / MAINT
    desc1: Verifies integrity of WSL2 backup archives.
    desc2: Checks file size, age, and tar listing validity.
  fleet/toolbox/update-header-dates.sh:
    module: HEADER-DATES
    subsystem: TOOLBOX / MAINT
    desc1: Run before push to keep stardates current.
    desc2: ''
  fleet/wake-instance.sh:
    module: WAKE
    subsystem: FLEET / IPC
    desc1: Sends a wake signal to a fleet instance.
    desc2: 'v2: single-distro multi-user — tmux pane lookup.'
  fleet/watch-handoff.sh:
    module: WATCH-HANDOFF
    subsystem: FLEET / DISPLAY
    desc1: Watches a handoff file for real-time changes.
    desc2: Uses inotifywait or polling with colorized output.
  install.sh:
    module: BOOTSTRAP
    subsystem: INSTALL
    desc1: Entry point — bootstrap only.
    desc2: Ensures runtime exists, then delegates to the real
  fleet/provisioning/deploy-lib.sh:
    module: DEPLOY-LIB
    subsystem: PROVISIONING / DEPLOY
    desc1: Shared functions for deploy.sh sub-scripts.
    desc2: sync_tree, fleet_cp, register_hook, colors. Sourced, never called.
  fleet/provisioning/deploy.d/deploy-claude.sh:
    module: DEPLOY-CLAUDE
    subsystem: PROVISIONING / DEPLOY
    desc1: Deploy .claude/, credentials, CLAUDE.md, directives, role.md.
    desc2: Sourced by deploy.sh. Injects conversation language from blueprint.
  fleet/provisioning/deploy.d/deploy-fleet.sh:
    module: DEPLOY-FLEET
    subsystem: PROVISIONING / DEPLOY
    desc1: Deploy fleet/ to agent homes + instance-utils to ~/.local/bin/.
    desc2: Sourced by deploy.sh. Auto-discovers scripts via DEPLOY marker.
  fleet/provisioning/deploy.d/deploy-bashrc.sh:
    module: DEPLOY-BASHRC
    subsystem: PROVISIONING / DEPLOY
    desc1: Patch .bashrc for all agents (AUTOCOMPACT, SESSION, AUTO_LAUNCH).
    desc2: Sourced by deploy.sh. Includes v5.3 migrations.
  fleet/provisioning/deploy.d/deploy-hooks.sh:
    module: DEPLOY-HOOKS
    subsystem: PROVISIONING / DEPLOY
    desc1: Deploy protocol + wire hooks into settings.local.json.
    desc2: Sourced by deploy.sh. Reads hooks.yaml manifest.
  fleet/provisioning/deploy.d/deploy-infra.sh:
    module: DEPLOY-INFRA
    subsystem: PROVISIONING / DEPLOY
    desc1: Deploy spool dirs, systemd units, toolbox, symlinks, chown.
    desc2: Sourced by deploy.sh. Handles IPC infrastructure + git hooks.
  fleet/provisioning/provision.d/provision-packages.sh:
    module: PROVISION-PACKAGES
    subsystem: PROVISIONING / SYSTEM
    desc1: Install apt packages + yq binary.
    desc2: Sourced by provision-system.sh. IDIC-compliant (x86_64/aarch64).
  fleet/provisioning/provision.d/provision-groups.sh:
    module: PROVISION-GROUPS
    subsystem: PROVISIONING / SYSTEM
    desc1: Create fleet group + agent Linux users.
    desc2: Sourced by provision-system.sh. Blueprint-driven.
  fleet/provisioning/provision.d/provision-sudoers.sh:
    module: PROVISION-SUDOERS
    subsystem: PROVISIONING / SYSTEM
    desc1: Write all /etc/sudoers.d/ files for fleet.
    desc2: Sourced by provision-system.sh. Per-role from blueprint scope.
  fleet/provisioning/provision.d/provision-directories.sh:
    module: PROVISION-DIRS
    subsystem: PROVISIONING / SYSTEM
    desc1: Create system directories + IPC spool structure.
    desc2: Sourced by provision-system.sh. Sets ownership + permissions.
  fleet/provisioning/provision.d/provision-claude-bin.sh:
    module: PROVISION-CLAUDE
    subsystem: PROVISIONING / SYSTEM
    desc1: Install Claude Code CLI binary to /usr/local/bin/.
    desc2: Sourced by provision-system.sh. Downloads via install.sh.
  fleet/provisioning/provision.d/provision-git.sh:
    module: PROVISION-GIT
    subsystem: PROVISIONING / SYSTEM
    desc1: Configure git repos, SSH key, identity, remote URL.
    desc2: Sourced by provision-system.sh. StarFleet SSH key + shared repo.
  fleet/provisioning/provision.d/provision-wsl.sh:
    module: PROVISION-WSL
    subsystem: PROVISIONING / SYSTEM
    desc1: Configure /etc/wsl.conf + ready-room drvfs mount.
    desc2: Sourced by provision-system.sh. WSL-only, skips on native Linux.
