# SOURCE: fleet/services/console.tmux.conf
# AUTHOR: consultant
# STARDATE: 2026-07-31
# STATUS: config tmux de la CONSOLE WEB uniquement (ttyd) — pas celle des pods
#
# Pourquoi ce fichier existe : sans lui, la console perd le haut de l'ecran. tmux possede l'ecran
# (mode alternatif), donc le scrollback de xterm.js cote navigateur ne voit RIEN — la molette ne
# remonte pas, et tout ce qui defile au-dessus du viewport est inatteignable. Les deux reglages
# ci-dessous rendent la molette et l'historique.
#
# PORTEE : ce fichier ne s'applique qu'au serveur tmux de la console (socket par defaut de
# l'humain, lance par console.sh avec `-f`). Les pods ont LEURS sockets (`-S <sock>` par pod,
# bwrap_launch) et ne sont pas concernes : aucune interference avec le sanctuaire.

# La molette entre en copy-mode et fait defiler l'historique (le comportement attendu dans un
# navigateur). Une app qui demande la souris (Claude Code en plein ecran) la recoit quand meme :
# tmux route vers l'app en mode alternatif, et vers l'historique sinon.
set -g mouse on

# 50 000 lignes de scrollback : un build, un gate ou une session d'agent depassent tres vite les
# 2 000 par defaut, et ce qui sort du buffer est perdu pour de bon.
set -g history-limit 50000

# Le terminal servi par ttyd gere 256 couleurs + le vrai gras : le dire a tmux, sinon la palette
# LCARS et le rendu de Claude Code degradent.
set -g default-terminal "tmux-256color"

# Navigation de l'historique aux touches vi (k/j, /recherche) — cheap et attendu.
setw -g mode-keys vi

# ─── LE COPIER-COLLER, ET LE PRIX DE `mouse on` ──────────────────────────────────────────────────
# Constat en direct : avec la souris captee par tmux, la selection du NAVIGATEUR ne se fait plus —
# tmux prend le drag, et relacher le clic efface la selection. Deux sorties, gardees toutes les deux
# parce qu'elles servent a des moments differents :
#
#   1. SHIFT + glisser  → contourne la capture souris ; on retrouve la selection native du
#      navigateur et son Ctrl+Shift+C / clic droit. Marche TOUT DE SUITE, sans reglage.
#   2. Alt+m            → bascule `mouse` off/on. Souris OFF = selection navigateur partout, mais
#      plus de molette (le scrollback revient aux touches : prefixe + [ puis k/j ou /recherche).
#      Alt et PAS Ctrl+lettre : Chrome mange les Ctrl+<lettre> avant xterm.js (gotcha nomme dans
#      le triage d'avril 2026 — un binding critique en Ctrl ne serait jamais recu).
set -g @scroll-note "Shift+glisser = selection navigateur · Alt+m = souris off/on"
bind -n M-m set -g mouse \; display "souris #{?mouse,ON (molette),OFF (selection navigateur)}"

# La selection tmux part AUSSI vers le presse-papier du poste quand le terminal sait recevoir
# l'OSC 52 (xterm.js le supporte selon la build de ttyd — si ca ne marche pas, la sortie 1
# ci-dessus reste vraie). Sans ca, ce qu'on selectionne ne vit que dans le buffer tmux.
# (`-s` : c'est une option SERVEUR, pas de session — un `set -g` la pose dans le vide, verifie.)
set -s set-clipboard on

# Pas de delai sur Echap : sinon la sortie d'un mode dans une app TUI traine (~500 ms percus
# comme une latence de l'interface).
set -sg escape-time 10

# ─── BARRE DE STATUT — l'etat de la fleet en permanence sous les yeux ────────────────────────────
# La sonde est `console-status.sh`, qui reprend la detection de `fleet_v2 status` (has-session sur
# le socket du daemon + comptage des socks de pods) SANS son bloc version : `cmd_version` retombe
# sur `git status --porcelain` quand build_info.txt manque (fleet_v2:344), et un git toutes les
# 15 s pour afficher deux mots, non. La sonde sort TOUJOURS 0 et TOUJOURS une ligne : une barre qui
# echoue afficherait du bruit, et l'humain croirait la fleet dans un etat qu'elle n'est pas.
#
# 15 s et pas 5 : la barre n'est pas un moniteur temps reel, c'est un coup d'oeil. Le deck
# d'observation (`base+1`) est la surface qui rafraichit vite.
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour223"
set -g status-left " #[fg=colour214,bold]#S#[default] "
set -g status-left-length 24
# `#h` = hostname court (« bridge »). L'heure est aussi dans le prompt maison, mais le prompt
# DEFILE — la barre, non : elle reste vraie quand la sortie d'un build a pousse le prompt hors
# de l'ecran.
set -g status-right " #[fg=colour214]#(/opt/lcars/console-status.sh)#[default] · #h · %H:%M "
set -g status-right-length 64
setw -g window-status-current-style "fg=colour214,bold"
