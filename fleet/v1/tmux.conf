set -g mouse on

# Status bar en haut
set -g status on
set -g status-position top
set -g status-interval 5

# Couleurs status — palette LCARS/btop-dark
# colour214=#FFAF00(orange actif)  colour223=#FFD7AF(pêche texte)  colour233=#121212(noir profond)
# colour23=#005F5F(teal foncé inactif)  colour73=#5FAFD7(teal clair texte inactif)
set -g status-bg colour233
set -g status-fg colour223
set -g status-left-length 30
set -g status-left "#[bg=colour214,fg=colour232,bold]  LCARS  #[bg=colour233,fg=colour214]▌ #[fg=colour223]#S "
set -g status-right "#[fg=colour214]▐#[bg=colour214,fg=colour232,bold] %H:%M  "
set -g status-interval 30

# Onglets — centré / inactif: teal foncé / actif: bloc orange LCARS
set -g status-justify centre
set -g window-status-style bg=colour23,fg=colour73
set -g window-status-current-style bg=colour214,fg=colour232,bold
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-separator ""

# Messages tmux (ligne de commande prefix)
set -g message-style bg=colour214,fg=colour232,bold

# Copy mode — sélection en orange
set -g mode-style bg=colour214,fg=colour232

# Bordures de panes — heavy / inactif: teal foncé / actif: orange
set -g pane-border-lines heavy
set -g pane-border-style fg=colour23
set -g pane-active-border-style fg=colour214

# Navigation Alt+Flèches (sans prefix)
bind -n M-Left  previous-window
bind -n M-Right next-window

# Focus fenêtres fleet (sans prefix)
bind -n M-m select-window -t :=monitor
bind -n M-a select-window -t :=architect
bind -n M-d select-window -t :=dev
bind -n M-e select-window -t :=engineer
bind -n M-q select-window -t :=qualifier
bind -n M-t select-window -t :=terminal

# Focus panes dans monitor (sans prefix)
# monitor.1 = status (haut), monitor.2 = starfleet (bas-gauche), monitor.3 = btop (bas-droite)
bind -n M-s select-window -t :=monitor \; select-pane -t .2

# Mode vi pour le scroll
set -g mode-keys vi

# Historique
set -g history-limit 10000

# Numérotation windows depuis 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Titre terminal hôte — désactivé car set-titles on laisse passer
# les escape sequences \e]0; / \e]2; de Claude Code, écrasant les
# pane titles fixés par fleet-launch.sh (select-pane -T <agent>).
set -g set-titles off

# Preserve pane titles set by fleet-launch.sh (select-pane -T <agent>)
# allow-rename off  : bloque \ek (bash/zsh PROMPT_COMMAND rename)
# automatic-rename off : bloque tmux lui-même de renommer
set -g allow-rename off
setw -g automatic-rename off

# Pas de délai ESC (important pour vim/claude)
set -sg escape-time 0
