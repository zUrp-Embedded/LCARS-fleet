# Pipeline V2 — judge-ping (smoke-test e2e ticket-driven)
#
# Date: 2026-05-26
# Statut: POC — pipeline minimal pour valider la chaîne complète ticket
#         Gitea → fleet_pilot (rail forge-driven) → spawn pod judge → claude REPL
#         → MCP get_task / submit_result → pod.completed.
# NB : le moteur RAM `Pipeline.Executor` + `StageRunner` et le catalogue
#      `forge-routing.yaml` (qui référençaient ce POC) sont SUPPRIMÉS. Ce fichier
#      n'est référencé par aucun code Elixir ; il subsiste comme fixture POC.
#
# Format : flat v1 (`name/version/stages` top-level). L'enveloppe v2.5
# `kind/metadata/spec/...` du canon doctrine n'est PAS consommée par le loader
# (qui lit `pipeline["stages"]` direct). Trou doctrine↔code à reload séparément.

name: judge-ping
version: 1

stages:
  audit:
    role: qualifier
    # `noop` modop = identité (cf. apps/fleet_cap_profile/priv/canon/
    # modop/noop/profile.yaml). Le schema v1 exige `profile` non-vide
    # min 1 ; on référence noop quand on n'a pas besoin d'overlay sur
    # le rôle de base. La composition role="qualifier" + modops=["noop"]
    # = qualifier.yaml inchangé (le noop n'ajoute aucun overlay).
    profile: noop
    # Pas de needs : stage racine unique.
    # Pas de gate : Gates.evaluate retourne :pass par défaut.
    timeout_sec: 600
