# Pipeline V2 — mandate-gate (#8, 2026-06-18)
#
# Date: 2026-06-18
# Statut: actif — gate dure de revue de mandat (consultant) AVANT dispatch engineer.
# Dérivé de: DECISIONS-attribution-promotion-concurrence-2026-06-18 + design #8 (build-spec passe 2-4).
# Consommé par: Fleet.Pipeline.Loader / Fleet.Pilot.Entry (type:->carte) + StageDispatcher.carte_role.
#
# La carte EST la machine à états : le 1er stage (racine needs:[]) est mandate-review (consultant en
# mode JUGE, mandate_kind:judge per-stage — le profil consultant reste worker pour l'audit). L'engineer
# (stage build) ne part QUE quand le consultant a validé le mandat (gate dure mécanique : le poller ne
# dispatche build qu'une fois la route avancée à `build`). Mandat non-exécutable → escalade arch
# (await_human), PAS rework du consultant (re-juger ne corrige pas un mauvais mandat — l'arch corrige).

kind: Pipeline
metadata:
  name: mandate-gate
  description: "Revue du mandat (consultant-juge) AVANT l'engineer. Mandat exécutable → build ; non → escalade arch."
  applicable_intensity: [L1, L2, L3, L4]
  applicable_regime: [R1, R2]

spec:
  stages:

    # --- Stage 1 (racine) : revue du mandat par le consultant (mode JUGE) ---
    mandate-review:
      role: consultant
      profile: consultant.yaml      # profil worker (audit), passé en JUGE par mandate_kind ci-dessous
      mandate_kind: judge           # #8.B : override per-stage → GateBrief désamorcé (verdict, pas de prod)
      judge_target: mandate         # #8.E : juge le MANDAT (ticket.body), PAS un livrable/PR → pré-PR,
                                    #        avance issue-level, no-PR légitime (vs deliverable = fail-loud)
      needs: []                     # racine DAG
      inputs:
        - ticket.body               # le mandat rédigé par l'arch
      # #8.E : verdict-de-juge-SUR-ISSUE (gate_decide branché sur mandate_kind:judge) →
      #   continue      → advance(build)         (mandat exécutable)
      #   abandon       → close                  (mandat à jeter)
      #   escalate_user → await_human (arch)     (mandat à retravailler par l'arch)
      timeout_sec: 600

    # --- Stage 2 : implémentation (engineer), gated par la validation du mandat ---
    build:
      role: engineer
      profile: engineer.yaml
      needs: [mandate-review]       # ne part QUE si mandate-review a avancé la route ici
      inputs:
        - ticket.body
      timeout_sec: 1800

  on_failure:
    notify_role: starfleet
    cleanup: false
