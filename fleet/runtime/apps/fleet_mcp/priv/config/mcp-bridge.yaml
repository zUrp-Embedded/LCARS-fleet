# Bridge config V2 — Phoenix.PubSub topics ↔ MCP channels
# Date : 2026-05-18
# Référencé par : 04_design-notes/ring4/fleet_mcp.md §"Config bridge"
# Schema : 07_code/runtime-v2/apps/fleet_mcp/priv/schema/mcp-bridge-v1.json (à créer engineer Lot 1)
# Consommé par : Fleet.MCP.Bridge.init/1 — mapping bidirectionnel topics fleet.events ↔ MCP channels broadcast
#
# 2 directions :
#   1. Pod publie via MCP channel → Bridge forward vers Phoenix.PubSub topic (côté fleet umbrella)
#   2. Fleet umbrella broadcast Phoenix.PubSub topic → Bridge forward vers MCP channel push (côté pod)

bridges:

  # === Direction 1 : MCP → Phoenix.PubSub ===
  mcp_to_pubsub:
    - mcp_channel: "fleet-control.memory.*"
      pubsub_topic: "fleet.events"
      event_type_prefix: "memory.query"
      # Pod query Memory-X via MCP → bridge forward au broker Memory côté fleet
    - mcp_channel: "fleet-control.coord.*"
      pubsub_topic: "fleet.events"
      event_type_prefix: "coord"
    - mcp_channel: "fleet-control.audit.*"
      pubsub_topic: "fleet.events"
      event_type_prefix: "audit.verdict"
    - mcp_channel: "fleet-forge.*"
      pubsub_topic: "fleet.events"
      event_type_prefix: "gitea"

  # === Direction 2 : Phoenix.PubSub → MCP ===
  pubsub_to_mcp:
    - pubsub_topic: "fleet.events"
      event_type: "coord.action.*"
      mcp_channel_template: "fleet-control.{target_role}.coord"
      # Coord action broadcast → push vers cap-profile subscribed
    - pubsub_topic: "fleet.events"
      event_type: "audit.verdict.*"
      mcp_channel_template: "fleet-control.{target_role}.audit"
    - pubsub_topic: "fleet.events"
      event_type: "gitea.opened"
      mcp_channel_template: "fleet-forge.{assignee}"
      # Webhook Gitea opened → push vers worker assignee
    - pubsub_topic: "fleet.events"
      event_type: "gitea.comment"
      mcp_channel_template: "fleet-forge.{assignee}"

# Gate runtime :
# Fleet.MCP.Bridge.init/1 valide que tous les pubsub_topic existent (Phoenix.PubSub already started).
# Si un mapping ne résout pas → log warning + skip mapping (graceful degradation).

# Évolution :
# Ajout d'un channel = nouveau mapping dans mcp_to_pubsub OU pubsub_to_mcp (selon direction).
# Pas de modification core ring 1+4 nécessaire (table déclarative consommée par Fleet.MCP.Bridge).
