# Cap-profile : architect
# Date : 2026-05-18
# Référencé par : design-notes/ring2/cap-profiles.md (tableau récap §L108)
# Schema : ../../07_code/runtime-v2/apps/fleet_cap_profile/priv/schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: architect
  # bwrap (réaligné #5.2 2026-06-20) : l'arch est persistant ET sandboxé. Son besoin réel = voir tous les
  # projets (via mounts catalogue ci-dessous), PAS "être le home de l'humain" (effet de bord host_launch,
  # nocif : contamination doctrine BUG-3 + zéro sandbox). En bwrap, HOME=pod_dir → claude lit pod_dir/.claude,
  # plus le ~/.claude humain → BUG-3 disparaît à la racine. Interactif via `lcars attach` (marche sur bwrap).
  containment: bwrap
  mounts:
    - path: /home/projects        # RO : lire le code pour cadrer les briefs (tous les projets d'un coup)
      mode: ro
    - path: /home/projects.work   # RW : écrire la DOC (moon-shot/beyond), en amont des tickets
      mode: rw
spec:
  scope:
    # Convention nommage tools (cohérent fleet_cap_profile G24-9 F-CONT-RISK gate) :
    #   - PascalCase  = tools Claude Code natifs côté pod, validés via `can_use_tool` permission callback
    #   - snake_case  = server tools API Anthropic (bypass can_use_tool, exécutés server-side)
    # Les 2 espaces de noms sont DISJOINTS — pas de contradiction quand un nom apparaît dans les 2 listes
    # (ex: `WebFetch` allowed côté pod + `web_fetch` disallowed côté server API)
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - WebFetch       # PascalCase : tool Claude Code natif autorisé côté pod
      - WebSearch      # PascalCase : tool Claude Code natif autorisé côté pod
      - ToolSearch     # PascalCase : charge les tools déférés (Monitor, mcp__fleet__*)
      - Monitor        # PascalCase : réveil-par-flag (watch.sh) — wake sans send-keys de contenu (ADR-G pt3)
    disallowedTools:
      # snake_case : server tools API Anthropic bypassant can_use_tool — F-CONT-RISK gate
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Patterns destructeurs déclarés au baseline universel
    # (`_baseline-git-denied.yaml`, intangibles) — pas dupliqués ici.
    git_ops_denied: []
    outputs: ["/home/ready-room/outbox/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
      - methodologie-doctrine-yolo
      - methodologie-regles-yolo
    skills:
      - memory-query
      - brainstorming
      - plan
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: forever  # G24-10 : boot_at_start: true requires forever (pod permanent Type 1)
    model: opus        # catalogue → --model (alias/nom complet ; tunable)
    effort: high       # catalogue → --effort {low,medium,high,xhigh,max} ; tunable
    boot_at_start: true
    subagent_template: null
    mcp_channels: ["fleet-control.*", "fleet-forge.*"]
    host_native: false
    max_alive_sec: null  # forever — pod permanent jusqu'à shutdown fleet
    heartbeat_keepalive: false
    bridge_enabled: true
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: true
    output_format: text
  injects:
    gitconfig: true
    forge_signing_allowed: false
  modop_set:
    default: [long-session-discipline]
    optional: [brainstorming, rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
