# Cap-profile : reviewer
# Date : 2026-05-18
# Référencé par : design-notes/ring2/cap-profiles.md (tableau récap §L112)
# Schema : ../../07_code/runtime-v2/apps/fleet_cap_profile/priv/schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: reviewer
  containment: bwrap
spec:
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash(git diff:*)
      - Bash(git log:*)
      - Bash(git show:*)
      - Bash(git blame:*)
      - Write
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # `push --force` et `reset --hard` déclarés au baseline universel
    # (`_baseline-git-denied.yaml`) — pas dupliqués ici. Restent les
    # restrictions spécifiques reviewer (note narrative seule, ne touche
    # pas le workspace) : pas de push/rebase/commit.
    git_ops_denied: ["push", "rebase", "commit"]
    outputs: ["/home/commons/reviewer/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
    skills: []  # modops listés dans modop_set
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: opus        # catalogue → --model (alias/nom complet ; tunable)
    effort: high       # catalogue → --effort {low,medium,high,xhigh,max} ; tunable
    boot_at_start: false
    subagent_template: code-quality-reviewer
    mcp_channels: ["fleet-control.reviewer.*", "fleet-forge.reviewer"]  # fleet-control: Memory-X + coord ; fleet-forge: routing tickets Gitea
    host_native: false
    max_alive_sec: 1800
    heartbeat_keepalive: false
    bridge_enabled: false
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: false
    output_format: json
  injects:
    gitconfig: false
    forge_signing_allowed: false
  modop_set:
    default: [fire-mode]
    optional: [dual-review]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
