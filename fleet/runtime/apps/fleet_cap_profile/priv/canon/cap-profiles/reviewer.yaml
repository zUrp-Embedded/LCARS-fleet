# Cap-profile : reviewer
# Date : 2026-05-18
# Référencé par : design-notes/ring2/cap-profiles.md (tableau récap §L112)
# Schema : ../../07_code/runtime-v2/apps/fleet_cap_profile/priv/schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: reviewer
  containment: bwrap
  # Coordonnees d'identite du role, lues par le builder de session_id (source unique du QUOI) :
  # role_index = slot role dans l'UUID hexspeak ; protected = tier epargne par le kill des workers ;
  # fleet_level = instance unique sans dimension projet (repo 0000).
  role_index: 5
  protected: false
  fleet_level: false
spec:
  # ②.1d — juge de PR (DN §1.4 : « le code fait le brief », une REVIEW). Reçoit un GateBrief DÉSAMORCÉ
  # (contexte + livrable + contrat de verdict, AUCUNE instruction exécutable — I-CBC) au lieu du corps
  # de l'issue : sans ça (défaut `worker`), le reviewer exécuterait le build au lieu de juger. Dual
  # d'entrée de deliverable_mode (sortie = `payload` par défaut : verdict, pas un patch git).
  mandate_kind: judge
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # #kill-yolo : Bash GÉNÉRIQUE (scopé = hang en default mode). Enforcement = MOUNT (RO/RW)
      # + git_ops_denied (push/rebase/commit hard-denied → forge-aveugle ET commit).
      - Bash
      # Rapport : Write/Edit bornés par le MOUNT RW (pas la tool-list).
      - Write
      - Edit
      # #kill-yolo : rail wake (Monitor via ToolSearch) — requis en --permission-mode default.
      - Monitor
      - ToolSearch
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # `push --force` et `reset --hard` déclarés au baseline universel
    # (`_baseline-git-denied.yaml`) — pas dupliqués ici. Restent les
    # restrictions spécifiques reviewer (note narrative seule, ne touche
    # pas le workspace) : pas de push/rebase/commit.
    git_ops_denied: ["push", "rebase", "commit"]
    outputs: ["/home/commons/reviewer/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
    skills: []  # modops listés dans modop_set
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: opus        # catalogue → --model (alias/nom complet ; tunable)
    effort: high       # catalogue → --effort {low,medium,high,xhigh,max} ; tunable
    boot_at_start: false
    subagent_template: code-quality-reviewer
    mcp_channels: ["fleet-control.reviewer.*", "fleet-forge.reviewer"]  # fleet-control: Memory-X + coord ; fleet-forge: routing tickets Gitea
    host_native: false
    max_alive_sec: 1800
    heartbeat_keepalive: false
    bridge_enabled: false
    remote_control: false  # invisible Claude Desktop (juge éphémère, churny) — pas de --remote-control
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: false
    output_format: json
  injects:
    gitconfig: false
    forge_signing_allowed: false
  modop_set:
    default: [fire-mode]
    optional: [dual-review]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
