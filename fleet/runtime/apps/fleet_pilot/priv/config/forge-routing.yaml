# Forge routing — catalogue déclaratif consommé par `Fleet.Pilot.Routing`
# (lu par `Fleet.Pilot.AutoDispatcher` sur chaque event Bus `gitea.*`).
#
# Chaque route match :
#   - `on` : list d'event_types Bus à écouter (ex `gitea.opened`, `gitea.labeled`)
#   - `when` : filtres sur les champs extraits du payload Gitea
#     * `type` : valeur après "type:" dans issue.labels (ex "poc", "sysadmin")
#     * `state` : valeur après "state:" dans issue.labels (ex "dispatched")
#     * `assignee` : login d'un des issue.assignees (ex "engineer")
# La 1ère route qui match gagne (ordre = priorité).
#
# Sémantique d'invocation : Pipeline.start_pipeline(pipeline, %{ticket_id, ask})
# où `ask` = issue.body (brief markdown du worker).
#
# Convention `type:` / `state:` / `assignee` cf.
# `beyond_#4/02_methodologies/conventions/convention-tickets-gitea.md`.

routes: []
# Le catalogue prod sera peuplé au fur et à mesure que les pipelines
# canoniques sont câblés (poc-cycle, sysadmin-action, etc.). Vide par
# défaut = mode "auto-dispatch désactivé" (zéro action sur tickets
# entrants). Les tests overrident :forge_routing_path pour fournir
# des routes fixtures.
