# Registry des events canon (BL-027 — fork « subscribers directs = canon »).
#
# `events.yaml` est un **registry PUR** : ses CLÉS sont les `authorized_event_types`
# (chargées au boot par `Fleet.EventRouter.Catalog.load!/0` → `Bus.broadcast/2`
# fail-loud sur tout type hors registry). Tout event émis DOIT avoir sa clé ici.
#
# La **consommation** se fait par **subscribers directs** (Phoenix.PubSub :
# `Bus.subscribe` + `handle_info`) — PAS par une table de dispatch. Le GenServer
# `Dispatch` (table `event → handle_event/1`, jamais câblée) a été RETIRÉ. Qui
# consomme quel event est documenté dans le moduledoc de chaque consommateur
# (`AuditConsumer`, `DriftMonitor`, `Spawner.PublishConsumer`,
# `API.WS`, `Pilot.HopConsumer`, …). (Le moteur RAM `Pipeline.Executor`, qui
# fut consommateur, est supprimé : le rail forge-driven `Pilot.HopConsumer` l'a
# remplacé.)
#
# Valeurs = `[]` (registry pur). Le schéma (`events-v1.json`) tolère une liste de
# handlers `Fleet.*` non vide pour un éventuel futur ré-câblage, mais le runtime
# n'en consomme aucune.
events:
  # --- Pod lifecycle (Spawner.Pod) ---
  # Z5 (nettoyage hollow producers) : `Spawner.Pod` n'émet QUE `pod.completed` + `pod.failed`
  # (call-sites vérifiés). `pod.allocate`/`transition`/`release`/`terminated`/
  # `refuse_pattern_match` étaient enregistrés mais JAMAIS produits (0 producteur, 0 consumer
  # type-spécifique) = mensonge de registry (I-CBC : le registry doit refléter la réalité).
  # Retirés ; à ré-ajouter AVEC un producteur si la progression pod devient observable.
  pod.completed: []
  pod.failed: []
  # pod.drift : conservé — consommé par DriftMonitor (SF-D1) ; son producteur manquant
  # (fleet_ipc_filter inexistant) = hollow CONSUMER côté starfleet (hors-fleet, non-négo #2),
  # pas un hollow producer ; non touché ici.
  pod.drift: []
  # wake.failed (#5.2 [5]) : émis par `Spawner.Pod` quand le kick d'onboarding est abandonné après N
  # tentatives (agent jamais acké) — payload `pod_id`/`reason`/`pane`. Consommé par
  # `Pilot.HopConsumer` (`type: :"wake.failed"` → escalade `:sp_suspect`, pane attaché au issue).
  # Producteur ET consumer réels → clé légitime (était absente = consommé-hors-registry, I-CBC rouge).
  wake.failed: []
  # spawn.failed : émis par `Spawner.PublishConsumer` (source :spawner) quand le dispatch d'un
  # `admin.spawn.request` LÈVE (CapProfile/spawn_pod plante de façon inattendue) → le spawn est droppé.
  # L'API REST a déjà répondu HTTP 202 « queued » au client AVANT ce dispatch async → sans cet event le
  # drop est SILENCIEUX (l'admin croit le pod en file ; zéro pod, zéro alarme). Jumelle de `pod.failed`,
  # même cycle. Payload `cap_profile_name`/`issue_id`/`reason`. Producteur réel ; consumer (dashboard/
  # opérateur) à venir — clé légitime (sans elle le broadcast ferait UnregisteredError → re-drop muet).
  spawn.failed: []

  # --- Credentials ---
  oauth.refresh.failed: []

  # --- Audit gatekeeper / forge tickets / tick ---
  # R09 : `audit.verdict` (2 segments) — aligné sur le consommateur réel
  # (DriftMonitor `%Fleet.Event{type: :"audit.verdict"}`) + l'atome pré-enregistré
  # (Starfleet.Application). L'ancienne clé `audit.verdict.gatekeeper` (3 segments,
  # jamais émise) était désalignée du consommateur → consommateur mort.
  audit.verdict: []
  # Z5 #9 : le producteur (`WebhooksGitea`, `gitea.<action>` dynamique) + les atomes
  # pré-enregistrés (`event_router/application.ex` `to_existing_atom`) émettent CES 10
  # actions. N'avoir que opened/closed → les 8 autres broadcastaient en `UnregisteredError`
  # SILENCIEUX (rescue `:ok`) → webhook 200 OK mais event jamais routé (drop muet). Registry
  # aligné sur le producteur (sinon un subscriber `gitea.*` ne voit jamais reopened/merged/edited/…).
  gitea.opened: []
  gitea.closed: []
  gitea.reopened: []
  gitea.merged: []
  gitea.edited: []
  gitea.created: []
  gitea.synchronized: []
  gitea.deleted: []
  gitea.push: []
  gitea.unknown: []

  # --- Signaux OS (SignalsOS, source :event_router) ---
  # R09 : émis par SignalsOS sur SIGUSR1/SIGTERM/SIGHUP — registrés ici pour
  # éviter le drop silencieux (UnregisteredError rescue). Pas de consommateur
  # routé pour l'instant (le drain passe par ExecStop/Shutdown, pas par signal).
  os.signal.sigusr1: []
  os.signal.sigterm: []
  os.signal.sighup: []

  # --- Admin spawn ---
  admin.spawn.request: []

  # --- Boot lifecycle (BootOrchestrator) ---
  fleet.boot_complete: []
  fleet.boot_partial: []
  fleet.boot_failed: []

  # --- Coord (Policies, source :coord) ---
  # ASYMÉTRIE VOULUE (producteur réel, 0 consommateur routé) : `Coord.Policies` émet
  # ces 3 events (notify_dashboard / escalate_human / autres), mais aucun subscriber
  # n'écoute encore `coord.*` sur le Bus. Clés légitimes (un producteur les émet → drop
  # silencieux évité) ; un consommateur (dashboard / opérateur) viendra s'abonner.
  coord.notification_routed: []
  coord.escalation_triggered: []
  coord.action_dispatched: []

  # --- Pipeline (source :pipeline) ---
  # ASYMÉTRIE INVERSE (consommateur réel, 0 producteur courant) : `pipeline.failed`
  # est consommé par `Starfleet.DriftMonitor` (→ Cat 5) et `pipeline.completed` matché
  # par `API.WS` (`pipeline.*`). Le producteur était le moteur RAM `Pipeline.Executor`,
  # SUPPRIMÉ — le rail forge-driven (`Pilot.HopConsumer`) ferme l'issue au lieu d'émettre
  # `pipeline.failed`. Clés conservées (consommateur câblé) ; à ré-émettre si le rail
  # forge-driven publie un signal d'échec/complétion de pipeline.
  pipeline.failed: []
  pipeline.completed: []
  pipeline.stage.completed: []
  # deliverable.published (slot-freeze) : emis par Pilot.HopCompleter (source :pipeline — la publication
  # EST une op pipeline via Deliverable.publish) APRES push + PR confirmes, porte `pod_id` (le pod
  # producteur, depuis le payload pod.completed). Consomme par Spawner.Pod : un pod resident (pipe) passe
  # :publishing -> :ready (son workspace a ete LU/pousse, il peut etre reset pour le issue suivant sans
  # courser le push). Producteur reel.
  deliverable.published: []

  # --- post_extract.git ---
  # ASYMÉTRIE INVERSE (consommateur réel, 0 producteur courant) : consommés par
  # `Starfleet.AuditConsumer`. Le producteur était le moteur RAM `Pipeline.Executor`
  # (publication post-extract), SUPPRIMÉ. `Pipeline.Git.publish/1` ne broadcast pas
  # lui-même. Clés conservées (consommateur câblé) ; à ré-émettre par le rail forge-driven
  # si la publication git redevient observable sur le Bus.
  git.published: []
  git.publish_failed: []

  # --- Cat 5 broadcasts (Cat5Escalator, source :starfleet) ---
  starfleet.audit_cat5_pod_drift: []
  starfleet.audit_cat5_pipeline_failed: []
  starfleet.audit_cat5_oauth_refresh_failed: []

  # --- TaskQueue lifecycle (source :task_queue) ---
  work_item_enqueued: []
  work_item_assigned: []
  work_item_completed: []
  work_item_cleared: []
  work_item_failed: []
  state_corrupt: []

  # --- Extensions V2 (MCPWatcher / MCPMonitor) ---
  sdk_upstream_alert: []
  mcp_server_crashed: []
