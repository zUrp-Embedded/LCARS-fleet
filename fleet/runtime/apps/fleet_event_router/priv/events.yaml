events:
  pod.allocate:
    - Fleet.Spawner.EventHandler
  pod.transition:
    - Fleet.Spawner.EventHandler
  pod.release:
    - Fleet.Spawner.EventHandler
  pod.refuse_pattern_match:
    - Fleet.Starfleet.DriftHandler
  pod.drift:
    - Fleet.Starfleet.EscalateHandler
  # finding Vulcan S7 — émis par fleet_credentials OAuthRefresher sur refresh-failed permanent.
  # Consommé par Fleet.Starfleet.DriftMonitor (subscribe Bus) → Cat5Escalator.
  oauth.refresh.failed:
    - Fleet.Starfleet.DriftMonitor
  permission_relay_request:
    - Fleet.API.RelayHandler
  audit.verdict.gatekeeper:
    - Fleet.Coord.GatekeeperHandler
  gitea.opened:
    - Fleet.Spawner.TicketHandler
  gitea.closed:
    - Fleet.Spawner.TicketHandler
  tick:
    - Fleet.Pipeline.TickHandler
  # B10/#583 Sprint 1 — admin.spawn.request : émis par fleet_api/rest.ex
  # POST /api/admin/spawn ; consumé par Fleet.Spawner.PublishConsumer
  # qui dispatche Fleet.Spawner.spawn_pod.
  admin.spawn.request:
    - Fleet.Spawner.PublishConsumer
  # B10/#583 Sprint 1 — events lifecycle Fleet.Starfleet.BootOrchestrator
  # (Task post-start fleet_starfleet). Pas de handler dispatch (subscribers
  # libres : dashboard, audit). Pré-enregistrés starfleet @starfleet_event_atoms.
  fleet.boot_complete:
    - Fleet.Starfleet.AuditConsumer
  fleet.boot_partial:
    - Fleet.Starfleet.AuditConsumer
  fleet.boot_failed:
    - Fleet.Starfleet.AuditConsumer
  # B10/#593 D11 — events lifecycle Pod GenServer (post-init Port stream).
  # pod.completed : claude one-shot result is_error=false
  # pod.failed    : claude one-shot result is_error=true
  # pod.terminated: Port exit_status reçu (final, stop normal Pod)
  # Subscribers : AuditConsumer pour log forensique. LifecycleConsumer
  # Sprint 2 #583 différé reprendra le dispatch pipeline aval.
  pod.completed:
    - Fleet.Starfleet.AuditConsumer
  pod.failed:
    - Fleet.Starfleet.AuditConsumer
  pod.terminated:
    - Fleet.Starfleet.AuditConsumer
  # RETIRÉ 2026-06-02 (audit deep-02 P2) : `pod.result_submitted` (tuple émis par fleet_mcp sur
  # submit_result) n'est PLUS émis — remplacé par `task_queue.task_completed` en struct %Fleet.Event{}.
  #
  # NOTE dual-stack (audit deep-02 P0/P1) : les events de cycle de tâche du broker (`task_queue.*` :
  # task_enqueued/assigned/completed/failed + state_corrupt) sont émis en **struct %Fleet.Event{}**
  # (broadcast direct), consommés DIRECTEMENT (ex. Fleet.Spawner.Pod pattern-match), PAS via cette table
  # Dispatch — qui ne route que les tuples `{atom, map}` legacy (cf. dispatch.ex handle_info/2). Ils ne
  # sont donc volontairement PAS listés ici tant que Dispatch ne supporte pas les structs (= unification
  # du canon d'event, rework). Y mettre des handler-entries serait trompeur (jamais fan-out).
