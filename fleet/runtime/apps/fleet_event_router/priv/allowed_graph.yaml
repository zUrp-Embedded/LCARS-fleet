# allowed_graph.yaml — topologie de dependances REELLE de l'umbrella, figee.
#
# Source de verite du check `layering.dependency_graph` (lcars.contracts.check) : il refuse toute
# DERIVE — une arete compile (mix.exs in_umbrella) non declaree ici, une arete declaree ici mais
# absente du code (fantome), ou une dep MONTANTE (ring inferieur -> ring superieur) non exceptee.
#
# Regle : une dep va vers le BAS (ring inferieur) ou reste intra-ring. Le PubSub (Bus, event_router
# ring 0) est EXEMPT (tout le monde publie/consomme, ce n'est pas une dep de couche). Encode le graphe
# ACTUEL -> le check NAIT VERT et fige l'existant ; toute arete ajoutee/retiree ensuite le fait rougir
# tant qu'elle n'est pas re-declaree ici (force la conscience d'un changement de topologie).
#
# Aligne 2026-07-04 sur le graphe compile reel (post-rename fleet_workflow, post-suppression
# fleet_task_monitor, renumerotation D4). Verifie : les 38 aretes compile sont TOUTES descendantes ou
# intra-ring (zero montante) — d'ou zero exception cote `edges`. Les seams montants sont DYNAMIQUES.

rings:
  # Ring 0 — substrat (0 dep, le FOND du graphe)
  fleet_event_router: 0
  fleet_cap_profile: 0
  # Ring 1 — primitives pod + frontiere vendor
  fleet_credentials: 1
  fleet_sp_builder: 1
  fleet_project_bootstrap: 1
  fleet_task_queue: 1
  fleet_spawner: 1
  # Ring 2 — coordination + policy
  fleet_mcp: 2
  fleet_workflow: 2
  fleet_coord: 2
  fleet_starfleet: 2
  # Ring 3 — driver forge
  fleet_pilot: 3
  # Ring 4 — surface externe
  fleet_api: 4
  fleet_observation: 4

# Aretes COMPILE (mix.exs `in_umbrella: true`). Toutes descendantes ou intra-ring.
# `from` depend de `to`. Le check compare CE set (bidirectionnel) au reel extrait des mix.exs.
edges:
  - {from: fleet_api, to: fleet_event_router}
  - {from: fleet_api, to: fleet_pilot}
  - {from: fleet_api, to: fleet_mcp}
  - {from: fleet_api, to: fleet_spawner}
  - {from: fleet_api, to: fleet_starfleet}
  - {from: fleet_api, to: fleet_cap_profile}
  - {from: fleet_coord, to: fleet_event_router}
  - {from: fleet_credentials, to: fleet_cap_profile}
  - {from: fleet_credentials, to: fleet_event_router}
  - {from: fleet_mcp, to: fleet_event_router}
  - {from: fleet_mcp, to: fleet_task_queue}
  - {from: fleet_mcp, to: fleet_credentials}
  - {from: fleet_observation, to: fleet_spawner}
  - {from: fleet_observation, to: fleet_cap_profile}
  - {from: fleet_observation, to: fleet_event_router}
  - {from: fleet_pilot, to: fleet_event_router}
  - {from: fleet_pilot, to: fleet_workflow}
  - {from: fleet_pilot, to: fleet_spawner}
  - {from: fleet_pilot, to: fleet_credentials}
  - {from: fleet_pilot, to: fleet_cap_profile}
  - {from: fleet_project_bootstrap, to: fleet_cap_profile}
  - {from: fleet_project_bootstrap, to: fleet_credentials}
  - {from: fleet_sp_builder, to: fleet_cap_profile}
  - {from: fleet_spawner, to: fleet_cap_profile}
  - {from: fleet_spawner, to: fleet_sp_builder}
  - {from: fleet_spawner, to: fleet_credentials}
  - {from: fleet_spawner, to: fleet_event_router}
  - {from: fleet_spawner, to: fleet_project_bootstrap}
  - {from: fleet_spawner, to: fleet_task_queue}
  - {from: fleet_starfleet, to: fleet_event_router}
  # H3 2026-07-04 : Fleet.Layout (autorite layout container, R0) consommee par AuditLog.
  - {from: fleet_starfleet, to: fleet_cap_profile}
  - {from: fleet_starfleet, to: fleet_spawner}
  - {from: fleet_task_queue, to: fleet_event_router}
  - {from: fleet_workflow, to: fleet_cap_profile}
  - {from: fleet_workflow, to: fleet_spawner}
  - {from: fleet_workflow, to: fleet_credentials}
  - {from: fleet_workflow, to: fleet_event_router}
  - {from: fleet_workflow, to: fleet_task_queue}

# Seams dynamiques (dispatch runtime injecte par config, PAS des deps compile mix.exs). Ils n'apparaissent
# donc PAS dans le graphe compile (a) et ne sont pas soumis a la regle de ring compile. `direction` note
# s'ils MONTENT (assumes : le seam existe PRECISEMENT pour eviter le cycle compile) ou descendent/intra.
# `marker` = motif grepe dans le code de l'app `from` : s'il n'y matche PLUS, le seam est MORT (le code a
# bouge) -> le yaml est stale -> le check ROUGIT (versant "seams vivants"). Releve 2026-07-04 (sub-agent).
seams:
  # MONTANTS (assumes — le seam evite l'inversion de ring compile)
  - {from: fleet_spawner, to: fleet_mcp, direction: up, marker: "mcp_socket_provisioner",
     reason: "config-injection provision/release socket MCP per-pod (R1->R2, evite le cycle compile)"}
  - {from: fleet_mcp, to: fleet_pilot, direction: up, marker: "forge_client|project_onboard",
     reason: "ForgeClient (create/get issue) + ProjectOnboard delegues au pilot (R2->R3)"}
  # DESCENDANTS / intra-ring (direction correcte, mais non declares en mix.exs -> documentes ici)
  - {from: fleet_mcp, to: fleet_spawner, direction: down, marker: "pod_resolver",
     reason: "resolution du role du pod depuis le registre Spawner (identite = canal socket)"}
  - {from: fleet_starfleet, to: fleet_task_queue, direction: down, marker: "Fleet.TaskQueue",
     reason: "comptage in_flight des work items pendant le drain graceful"}
  - {from: fleet_starfleet, to: fleet_mcp, direction: intra, marker: "Fleet.MCP.Supervisor",
     reason: "monitor liveness du substrat pod-facing (inspection arbre OTP)"}
