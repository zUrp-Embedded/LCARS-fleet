; pytest — brique vendorée token_saver (LCARS)
;
; Fichier LCARS, hors sous-arbre vendoré : `src/` et `tests/` restent des
; copies strictes de l'amont (ppgranger/token-saver @ 098873e), pour que le
; merge amont reste trivial. Voir VENDOR.md.
;
; Deux classes sont désélectionnées — elles portent sur la couche
; d'intégration amont que LCARS remplace, pas sur le moteur :
;
;   TestShouldCompress   → core.should_compress() importe scripts.hook_pretool
;                          (routage), que nous réécrivons. Le moteur lui-même
;                          (core.compress) est couvert par TestCompress.
;   TestAntigravityHook  → plateforme Antigravity non reprise.
;   TestBinScript        → wrapper CLI `bin/token-saver` non repris (LCARS
;                          appelle le moteur depuis son propre wrap.py).
;
; Attendu : 623 passed.

[pytest]
testpaths = tests
addopts =
    -q
    --deselect tests/test_core.py::TestShouldCompress
    --deselect tests/test_core.py::TestAntigravityHook
    --deselect tests/test_cli.py::TestBinScript
