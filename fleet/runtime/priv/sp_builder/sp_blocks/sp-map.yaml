# Role → SP block map. List order = assembly order; `role/*` always last.
# The generator (`mix lcars.sp.gen`) composes these blocks → `priv/sp_builder/sp_drafts/agent-<role>-base.md`.
#
# HARD RULE (no-fallback, cf. memory no-sp-no-pod-no-fleet): a catalogue role with no entry here, OR a listed
# block absent from disk → the generator FAILS (fail-loud). No SP → no pod → no fleet.
# A non-regression test checks: all blocks exist + the committed flat == the regeneration (no-drift).
#
# NB: `architect` AND `starfleet` (user-facing orchestrators, outside the pod socle) are NOT here — each
# keeps a manual draft (a different socle: a human in front — one per-project, one fleet-level). All other
# roles spawned via `assets.ex` are covered → the no-fallback flip of `read_agent_draft` is done (no more
# worker-base fallback).

# --- PR judges (judge the diff in their workspace) ---
qualifier:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/test-evidence-review
  - role/qualifier

reviewer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/review-conformance
  - role/reviewer

# --- Producer (git-native: commits locally, the system pushes) ---
# `core/wake-longlived`: Monitor arming — long-lived pods ONLY (pipe/forever). One-shot judges
# never receive it: their single mandate is enqueued before spawn, no second wake can reach them.
engineer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/wake-longlived
  - core/evidence
  - core/producer-output
  - method/engineer-implement
  - role/engineer

# --- Producer documentaire (git-native sur la face ops : commits locaux, le systeme pousse) ---
# Meme socle que l'engineer (producteur pipe, wake-longlived) : seuls le bloc methode et le bloc
# role changent — la mecanique de livraison est IDENTIQUE, c'est la these du chantier face-projet.
scribe:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/wake-longlived
  - core/evidence
  - core/producer-output
  - method/scribe-redact
  - role/scribe

# --- Brief judge (pre-PR, read-only: no diff, the input is the brief) ---
scoper:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/brief-review
  - role/scoper

# --- Reserved seat: external auditor (duplicate of scoper by user arbitrage 2026-08-02 —
# a valid, provable profile that no card calls; see the header of its cap-profile) ---
vulcan:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/brief-review
  - role/vulcan

# --- Exception judge / final promotion (arbitrates the upstream verdicts; no diff) ---
# One-shot per-project judge (reorg 2026-07-19) — NO core/wake-longlived: its single eval mandate
# is enqueued before spawn, no second wake can reach it (same rule as the PR judges).
gatekeeper:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/gatekeeper-arbitrate
  - role/gatekeeper
