# Role → SP block map. List order = assembly order; `role/*` always last.
# The generator (`mix lcars.sp.gen`) composes these blocks → `priv/sp_drafts/agent-<role>-base.md`.
#
# HARD RULE (no-fallback, cf. memory no-sp-no-pod-no-fleet): a catalogue role with no entry here, OR a listed
# block absent from disk → the generator FAILS (fail-loud). No SP → no pod → no fleet.
# A non-regression test checks: all blocks exist + the committed flat == the regeneration (no-drift).
#
# NB: `architect` (user-facing, outside the pod socle) is NOT here — it keeps its historical draft (a
# different socle: a human in front). All other roles spawned via `assets.ex` are covered → the no-fallback
# flip of `read_agent_draft` is done (no more worker-base fallback).

# --- PR judges (judge the diff in their workspace) ---
qualifier:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/test-evidence-review
  - role/qualifier

reviewer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-code-input
  - core/judge-verdict
  - method/review-conformance
  - role/reviewer

# --- Producer (git-native: commits locally, the system pushes) ---
engineer:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/producer-output
  - method/engineer-implement
  - role/engineer

# --- Brief judge (pre-PR, read-only: no diff, the input is the brief) ---
consultant:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/brief-review
  - role/consultant

# --- Exception judge / final promotion (arbitrates the upstream verdicts; no diff) ---
gatekeeper:
  - core/pod-sanctuary
  - core/runtime-contract
  - core/evidence
  - core/judge-verdict
  - method/gatekeeper-arbitrate
  - role/gatekeeper
