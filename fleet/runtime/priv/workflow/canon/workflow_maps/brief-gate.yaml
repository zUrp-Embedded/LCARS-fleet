# Pipeline V2 — brief-gate (#8, 2026-06-18)
#
# Date: 2026-06-18
# Statut: actif — gate dure de revue de brief (consultant) AVANT dispatch engineer.
# Dérivé de: DECISIONS-attribution-promotion-concurrence-2026-06-18 + design #8 (build-spec passe 2-4).
# Consommé par: Fleet.Workflow.Loader / Fleet.Pilot.Entry (type:->workflow_map) + StepDispatcher.workflow_map_role.
#
# La workflow_map EST la machine à états : le 1er step (racine needs:[]) est brief-review (consultant en
# mode JUGE, brief_kind:judge per-step — le profil consultant reste worker pour l'audit). L'engineer
# (step build) ne part QUE quand le consultant a validé le brief (gate dure mécanique : le poller ne
# dispatche build qu'une fois la route avancée à `build`). Brief non-exécutable → escalade arch
# (await_arch), PAS rework du consultant (re-juger ne corrige pas un mauvais brief — l'arch corrige).

kind: WorkflowMap
metadata:
  name: brief-gate
  description: "Revue du brief (consultant-juge) AVANT l'engineer. Brief exécutable → build ; non → escalade arch."
  presentation: "C1→C4 — La carte STANDARD : un consultant-juge valide le brief AVANT l'engineer (brief flou → escalade), puis jury qualifier + reviewer sur la PR. Le bon défaut pour du code qui compte."
  applicable_intensity: [C1, C2, C3, C4]
  applicable_regime: [R1, R2]

spec:
  # Jury de PR (source UNIQUE — la carte gouverne le jugement) : reviews demandées sur la PR
  # du producteur, approbations exigées avant sceau.
  jury: [qualifier, reviewer]
  # Budget anti-emballement (obligatoire, donnée map-level) : nb de restarts complets tolérés avant escalade.
  max_rework_rounds: 2
  steps:

    # --- Step 1 (racine) : revue du brief par le consultant (mode JUGE) ---
    brief-review:
      role: consultant
      brief_kind: judge           # #8.B : override per-step → GateBrief désamorcé (verdict, pas de prod)
      judge_target: brief         # #8.E : juge le BRIEF (ticket.body), PAS un livrable/PR → pré-PR,
                                    #        avance issue-level, no-PR légitime (vs deliverable = fail-loud)
      needs: []                     # racine DAG
      inputs:
        - ticket.body               # le brief rédigé par l'arch
      # #8.E : verdict-de-juge-SUR-ISSUE (gate_decide branché sur brief_kind:judge) →
      #   continue      → advance(build)         (brief exécutable)
      #   abandon       → close                  (brief à jeter)
      #   escalate_user → await_arch (arch)     (brief à retravailler par l'arch)
      timeout_sec: 600

    # --- Step 2 : implémentation (engineer), gated par la validation du brief ---
    build:
      role: engineer
      needs: [brief-review]       # ne part QUE si brief-review a avancé la route ici
      inputs:
        - ticket.body
      timeout_sec: 1800
