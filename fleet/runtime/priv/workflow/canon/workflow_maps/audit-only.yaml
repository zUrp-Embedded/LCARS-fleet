# Pipeline V2 — audit-only rev3 (B / §L441)
#
# Date: 2026-05-18 (rev1) — 2026-05-18 rev2 — 2026-06-10 rev3 (gatekeeper pattern B)
# Statut: actif — pipeline canonique V2 compatible Fleet.Workflow.Loader chantier 12 PROMOTED
# Dérivé de: design-notes/ring2/pipelines.md (audit-only existant) + format Loader chantier 12
# Référencé par: 06_modops/docs/cascade-mix-v2-rationale.md
# Consommé par: Fleet.Workflow.Loader → rail forge-driven (le moteur RAM Executor est supprimé).
#
# rev3 (B / §L441) : le step `gatekeeper-decision` (role: gatekeeper) est RETIRÉ.
#   Le gatekeeper est un juge d'EXCEPTION dispatché par une gate non-tranchable, JAMAIS
#   un step d'ordonnancement (§L441 ; GATE-D1). ⚠ SIGNAL (auditeur) : l'escalade
#   "si non-mécanique" n'est PLUS exprimée — en v2.5 les `rules` de gate sont
#   string-only (schema `additionalProperties:false`, `items:string`) et le chemin
#   terminal-string (`Gates.eval_terminal_string`) n'a PAS de branche `:nontranchable`.
#   Le SEUL véhicule d'escalade v2.5 est une gate `soft` (toujours dispatch). Re-encoder
#   l'escalade conditionnelle de l'audit en B = décision DIFFÉRÉE (soft trop large, ou
#   étendre schema+predicate string pour une bande-milieu). cf. JOURNAL re-analyse-2026-06-09.

kind: WorkflowMap
metadata:
  name: audit-only
  description: "Audit indépendant — pas de code généré. Consultant fire-mode (1 step, gate terminal). Escalade gatekeeper sur échec de règle (dispatch_gatekeeper)."
  presentation: "C0→C4 — AUDIT PUR : un consultant lit et rend un rapport, aucun code produit, pas de jury de PR. Pour évaluer l'existant à n'importe quel niveau de criticité."
  applicable_intensity: [C0, C1, C2, C3, C4]
  applicable_regime: [R1, R2]

spec:
  # Jury VIDE délibéré (fast-track C0/C1) : pas de juges de PR — le plancher mécanique
  # (identité, secrets, ancêtre, sceau) tient seul ; le consultant audite post-hoc.
  jury: []
  # Budget anti-emballement (obligatoire, donnée map-level) : nb de restarts complets tolérés avant escalade.
  max_rework_rounds: 2
  steps:

    # --- Step 1: audit (consultant fire-mode) ---
    audit:
      role: consultant
      needs: []  # racine DAG
      inputs:
        - ticket.body
        - audit_target  # files/repos à auditer (path explicit dans ticket.body)
      outputs:
        - audits/consultant-{date}.json
      gate:
        # F-C110 : ex-knobs fallback_invoke_gatekeeper/on_blocking_severity retirés — ils étaient INERTES
        # (le chemin terminal-string ne les évaluait pas), avoués tels quels. L'escalade gatekeeper vient
        # du type: terminal (StepRunConsumer {:dispatch_gatekeeper} sur règle en échec).
        type: terminal
        rules:
          - "audit_doc_exists AND audit_doc_non_empty"
      timeout_sec: 1800

# Metadata cycle
cycle:
  regime_default: R1  # audit = data déclarative
  score_target: 4/4
  profile_preuve: CONFORMANCE

# Sélection pipeline
selection_priority:
  - flag_pipeline_explicit
  - ticket_body_brief
  - intensity_json_pipeline_default
  - default
