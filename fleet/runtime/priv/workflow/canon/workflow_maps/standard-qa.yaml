# Pipeline V2 — standard-qa rev2 Loader-compatible
#
# Date: 2026-05-18 (rev1) — 2026-05-18 rev2 post-validation Lot 5 item 17
# Statut: actif — pipeline canonique V2 compatible Fleet.Workflow.Loader chantier 12 PROMOTED
# Dérivé de: design-notes/ring2/pipelines.md (standard-qa 6 step_runs) +
#            superpowers workflow (brainstorm→plan→TDD→dual-review→finish) ADAPT +
#            ring2/fleet_workflow.md chantier 12 PROMOTED format Loader (§Pourquoi cette note existe L19)
# Référencé par: 06_modops/docs/cascade-mix-v2-rationale.md, 06_modops/docs/pipeline-v2-loader-validation.md
# Consommé par: Fleet.Workflow.Loader (chantier 12 PROMOTED)

kind: WorkflowMap
metadata:
  name: standard-qa
  description: "Workflow méthodologique brainstorm → plan → implement (TDD) → spec-review → code-review → finish"
  applicable_intensity: [L2, L3, L4]  # L0-L1 fast-track via audit-only
  applicable_regime: [R1, R2]

spec:
  # Jury de PR (source UNIQUE — la carte gouverne le jugement).
  jury: [qualifier, reviewer]
  # Budget anti-emballement (obligatoire, donnée map-level) : nb de restarts complets tolérés avant escalade.
  max_rework_rounds: 2
  steps:

    # --- Step 1: brainstorm (design Socratique) ---
    brainstorm:
      role: architect
      profile: architect.yaml
      needs: []  # racine DAG
      inputs:
        - ticket.body
      outputs:
        - docs/specs/{date}-{slug}.md
      gate:
        type: terminal
        rules:
          - "spec_doc_exists AND spec_doc_non_empty"
          - "self_review_pass"  # MANDATORY Spec Self-Review fresh eyes (cf. modop:brainstorming rev2)
        human_approval_required: true
        approval_prompt: "Spec approved? (yes/edit/restart)"
      condition: "intensity_level >= L2"  # skip brainstorm si L0/L1 fast-track
      timeout_sec: 1800

    # --- Step 2: plan (TodoWrite + tasks 2-5min) ---
    plan:
      role: architect
      profile: architect.yaml
      needs: [brainstorm]
      inputs:
        - docs/specs/{date}-{slug}.md
      outputs:
        - docs/plans/{date}-{slug}.md
      gate:
        type: terminal
        rules:
          - "plan_doc_exists AND tasks_count >= 1"
          - "tasks_each_2_to_5_min"
          - "files_paths_exact"
        human_approval_required: true
        approval_prompt: "Plan approved? (yes/edit/restart)"
      timeout_sec: 1800

    # --- Step 3: implement (TDD + subagent-driven) ---
    implement:
      role: engineer
      profile: engineer.yaml  # cap-profile.modop_set inclut tdd + subagent-driven + rubber-duck + fire-mode
      needs: [plan]
      inputs:
        - docs/plans/{date}-{slug}.md
      outputs:
        - code/
        - tests/
        - git_commits/
      gate:
        type: hard
        rules:
          - "all_tests_pass"
          - "tdd_iron_law_respected"  # test written first per task (witnessed RED → GREEN)
          - "verification_checklist_complete"  # 8 items (cf. modop:tdd rev2)
      coordHook: before-next  # invoke fleet_coord chantier 14 hook entre steps
      timeout_sec: 3600

    # --- Step 4: spec-review (qualifier — spec compliance) ---
    spec-review:
      role: qualifier
      profile: qualifier.yaml  # cap-profile inclut subagent_template: spec-reviewer
      needs: [implement]
      inputs:
        - docs/plans/{date}-{slug}.md
        - git_diff_main_to_head
      outputs:
        - audits/spec-review-{date}.json
      gate:
        # type: terminal → une règle en échec (severity_max == critical) déclenche DÉJÀ l'escalade
        # gatekeeper (StepRunConsumer {:dispatch_gatekeeper}). F-C110 : les ex-knobs
        # fallback_invoke_gatekeeper/on_*_severity étaient une 2e couche morte (aucun code ne les lisait) —
        # retirés. Le gating par sévérité vit dans `rules` (opérande évalué par Gates.Predicate).
        type: terminal
        rules:
          - "severity_max != critical"
      timeout_sec: 600

    # --- Step 5: code-review (reviewer — code quality) ---
    code-review:
      role: reviewer
      profile: reviewer.yaml  # cap-profile inclut subagent_template: code-quality-reviewer
      needs: [spec-review]
      inputs:
        - git_diff_main_to_head
        - audits/spec-review-{date}.json
      outputs:
        - audits/code-review-{date}.json
      gate:
        # F-C110 : ex-knobs fallback_invoke_gatekeeper/on_*_severity retirés (morts). L'escalade gatekeeper
        # vient du type: terminal ; le gating par sévérité de `rules`.
        type: terminal
        rules:
          - "severity_max != critical"
      timeout_sec: 600

    # --- Step 6: finish (merge/PR/keep/discard) ---
    finish:
      role: starfleet  # ou engineer selon project (LCARS = starfleet, worker projet = engineer)
      profile: starfleet.yaml  # ou engineer.yaml selon project (override runtime)
      needs: [code-review]
      inputs:
        - git_diff_main_to_head
        - audits/spec-review-{date}.json
        - audits/code-review-{date}.json
      outputs:
        - git_merge_or_pr_or_cleanup
        - branch_cleanup_result
      gate:
        type: terminal
        human_approval_required: true
        approval_prompt: "Choose finish action: (a) merge to main, (b) create PR, (c) keep as-is, (d) discard (typed confirmation)"
      timeout_sec: 1800

  # (Ni `on_escalation` ni `on_failure` : CHAMPS MORTS — déclarés jadis, consommés par ZÉRO code (droppés
  # au normalize). La cible d'escalade n'est PAS configurable par map (le gatekeeper EST le juge d'exception
  # STRUCTUREL, GATE-D1) ; la policy d'échec vit dans le code, pas ici. Un champ déclaré-mais-inerte MENT
  # sur ce que le map contrôle → retiré, pour l'honnêteté du schéma.)

# Metadata cycle (cohérent doctrine cycle close 2026-05-09)
cycle:
  regime_default: R2  # refactor v1.5 → v2
  score_target: 4/4
  profile_preuve: CONFORMANCE

# Sélection pipeline (cohérent intensity-json.md PROMOTED #3.2 + chantier 12 PROMOTED)
selection_priority:
  - flag_pipeline_explicit  # --pipeline=standard-qa CLI override
  - ticket_body_brief     # brief dans ticket gitea body
  - intensity_json_pipeline_default  # intensity.json racine projet
  - default
