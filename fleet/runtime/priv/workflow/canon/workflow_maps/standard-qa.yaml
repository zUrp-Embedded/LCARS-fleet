# Pipeline V2 — standard-qa rev3 (réhabilitation 2026-07-18)
#
# Date: 2026-05-18 (rev1) — 2026-05-18 rev2 post-validation Lot 5 item 17 — 2026-07-18 rev3
# Statut: actif — carte de production C2+ (réhabilitée : steps DISPATCHABLES uniquement).
# Dérivé de: rev2 (6 steps méthodologiques brainstorm→plan→TDD→dual-review→finish) RÉDUITE aux
#            steps que le dispatch actuel SERT réellement. Constat live 2026-07-18 (citation-snoopy) :
#            un step `role: architect` spawnait un pod architecte ÉPHÉMÈRE (usurpation d'identité du
#            sas humain + work-order producteur jamais servi) et `role: starfleet` n'est pas un worker —
#            le projet partait en boucle reclaim/attente silencieuse. La méthode (TDD, plan) vit dans
#            les MODOPS du producteur et le jugement dans le JURY, pas dans des steps non-dispatchables.
# Consommé par: Fleet.Workflow.Loader → rail forge-driven ; jury lu par Fleet.Pilot.Roles.project_jury.

kind: WorkflowMap
metadata:
  name: standard-qa
  description: "Carte C2+ : revue du brief (consultant-juge) AVANT l'engineer, puis jury qualifier + reviewer sur la PR — la politique lourde du catalogue."
  presentation: "C2→C4 — La carte SÉRIEUSE : un consultant-juge valide le brief AVANT l'engineer (brief flou → escalade à l'architecte), l'engineer implémente, puis DEUX juges sur la PR (qualifier : conformité + le code compile ; reviewer : qualité du code). Même moteur que brief-gate aujourd'hui, matrice réservée C2→C4 : c'est ICI que les juges supplémentaires (tests runner, juges spécialisés) se brancheront."
  applicable_intensity: [C2, C3, C4]
  applicable_regime: [R1, R2]

spec:
  # Jury de PR (source UNIQUE — la carte gouverne le jugement).
  jury: [qualifier, reviewer]
  # Budget anti-emballement (obligatoire, donnée map-level) : nb de restarts complets tolérés avant escalade.
  max_rework_rounds: 2
  steps:

    # --- Step 1 (racine) : revue du brief par le consultant (mode JUGE) ---
    brief-review:
      role: consultant
      profile: consultant.yaml      # profil worker (audit), passé en JUGE par brief_kind ci-dessous
      brief_kind: judge             # gate dure : verdict, pas de prod (GateBrief désamorcé)
      judge_target: brief           # juge le BRIEF (ticket.body) → pré-PR, avance issue-level
      needs: []                     # racine DAG
      inputs:
        - ticket.body
      timeout_sec: 600

    # --- Step 2 : implémentation (engineer), gated par la validation du brief ---
    build:
      role: engineer
      profile: engineer.yaml
      needs: [brief-review]         # ne part QUE si brief-review a avancé la route ici
      inputs:
        - ticket.body
      timeout_sec: 3600

# Metadata cycle
cycle:
  regime_default: R2
  score_target: 4/4
  profile_preuve: CONFORMANCE

# Sélection pipeline
selection_priority:
  - flag_pipeline_explicit
  - ticket_body_brief
  - intensity_json_pipeline_default
  - default
