# RESERVED SEAT — the EXTERNAL auditor (codex / another vendor), not connectable today.
#
# WHAT VULCAN IS: the compliance auditor that runs on ANOTHER model provider, precisely to see
# what a judge from the same family as the producer never will — the blind spot is a matter of
# provenance, not of effort. Its disagreement with the native judges is information, never noise.
#
# WHY IT EXISTS NOW: three lists declare who exists (cap-profiles, forge.tf roles, token-mint
# ROLES) and nothing locks them together (BL-6-28). A seat kept on the forge without a profile
# here is a permanent divergence, and a check that must learn an exception is a check people
# stop reading. The reservation lives IN the source of truth, not next to it.
#
# WHY IT IS A DUPLICATE OF SCOPER (user arbitrage 2026-08-02): a VALID profile that is simply
# never called — no workflow card names vulcan, boot_at_start stays false, and the N1 vendor
# frontier has no launcher for its provider anyway (`bin/claude_launch.sh` is the only one).
# The day a `bin/<vendor>_launch.sh` exists, this file becomes an ordinary profile to recalibrate.
#
kind: CapabilityProfile
metadata:
  name: vulcan
  containment: bwrap
  # Role identity coordinates, read by the session_id builder (single source of the WHAT):
  # role_index = role slot in the hexspeak UUID.
  role_index: 8
spec:
  # NATIVE judge, like its peers: it judges the BRIEF (is it executable as written?) and receives a
  # defused GateBrief. It used to be a `worker` profile turned judge by a per-step override, which
  # described a dual nature it never had: every SP block it composes is a brief judge's
  # (`method/brief-review`, `role/vulcan`), and its only worker-shaped dispatch was a map written
  # for an auditor that was never built. REQUIRED (schema) — judge-ness is never inferred.
  brief_kind: judge
  # The fleet alone: no human at this REPL. `engage` opens a work-item cycle and there is nobody
  # to answer. REQUIRED (schema) — never inferred.
  interlocutor: fleet
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # GENERIC Bash (a SCOPED pattern-list hangs in --permission-mode default). Real
      # enforcement = the MOUNT (RO/RW) + git_ops_denied (push/reset/rebase/commit
      # hard-denied -> read-only toward the forge AND commit-less).
      - Bash
      # Report writing: Write/Edit bounded by the RW MOUNT (not by the tool-list).
      - Write
      - Edit
      # Wake rail (Monitor loaded via ToolSearch) — required in --permission-mode default.
      - Monitor
      - ToolSearch
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
      # CLIENT twins of the two above: `web_search`/`web_fetch` deny Anthropic's SERVER-SIDE
      # tools, `WebSearch`/`WebFetch` are the Claude Code tools running INSIDE the pod. Denying
      # one face leaves the other open. This role does not browse: both faces are closed.
      - WebSearch
      - WebFetch
    # `push --force`, `reset --hard`, `rebase main` etc. come from the universal
    # baseline (`baseline/git-denied.yaml`) — not duplicated here. Scoper-specific
    # restrictions remain: no push/reset/rebase/commit (it judges a brief, it never
    # touches the workspace).
    git_ops_denied: ["push", "reset", "rebase", "commit"]
  knowledge:
    skills: []  # modops are listed in modop_set, not in skills
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: opus        # catalogue -> --model (alias or full name; tunable)
    effort: high       # catalogue -> --effort {low,medium,high,xhigh,max}; tunable
    boot_at_start: false
    subagent_template: null
    host_native: false
    bridge_enabled: false
    remote_control: false  # invisible to Claude Desktop (ephemeral, churny brief-judge) — no --remote-control
  modop_set:
    default: []
    optional: [rubber-duck]
    incompatible: []
    # (fire-mode REMOVED — codex audit F-05 2026-07-19: its v1.5 output model — JSON on stdout,
    # self-exit one-shot — predates MCP submit_result and contradicted the runtime protocol; the
    # anti-conversation discipline lives in the base worker SP blocks.)
  project: null
