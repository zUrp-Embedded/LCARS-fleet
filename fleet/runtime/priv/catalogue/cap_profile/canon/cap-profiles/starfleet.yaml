# Cap-profile: starfleet
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# starfleet = the GLOBAL fleet orchestrator (front-desk + project organizer) — the user-facing
# FLEET-LEVEL controller. SANDBOXED (bwrap) like a briefing role: it reads project code to frame and
# organizes repos, so it belongs INSIDE the sanctuary (the world is protected from it, and its doctrine
# is protected from the human's ~/.claude). NO root / NO host-native anymore — the ex-sysadmin concern
# (systemd/ACL/provisioning) moves to a dedicated infra agent later; starfleet is a plain bwrap pod.
# (Reorg 2026-07-19: starfleet takes the global-orchestrator role; the arch specializes per-project.)
kind: CapabilityProfile
metadata:
  name: starfleet
  containment: bwrap
  # Role identity (the metadata IS the single source of the WHAT): role_index = role slot in the
  # UUID — and 0 IS starfleet, the ONLY fleet-scoped pod (repo 0000 in its UUID, kill_class 0 →
  # `pkill -f 1badcafe`/`2badcafe` never touch it). The old `protected`/`fleet_level` bits are GONE
  # (reorg 2026-07-19): both collapsed into "role_index 0" once every other role went per-project.
  role_index: 0
  # NO forge identity (the EXPLICIT declaration of the one asymmetry, BL-6-45): starfleet holds
  # no forge account and no role token — every forge write it causes goes through the SYSTEM
  # (its MCP tools delegate; zero as_role("starfleet") site, measured). The four-list equality
  # check (catalogue == forge.tf == ROLES == PROV_ROLES) excludes it on THIS field — the
  # asymmetry lives here, in the data, never as an exception coded into the control.
  forge_identity: false
  # Large focal length (cf. DESIGN-carte-des-roles §2/§5): starfleet sees the WHOLE project space.
  # RW on both — NOT to edit files routinely (the skills create_project/import_project do the structured
  # work, system-side), but as a LEVER to act as the human's hand when needed. Default runtime activity
  # is low. (An ordinary parametric pod: this wide RW mount is the only thing that sets its focal length.)
  mounts:
    - path: /home/projects        # RW: act on any project's main on the human's behalf, when needed
      mode: rw
    - path: /home/projects.work   # RW: the DOC (moon-shot/beyond), upstream of tickets
      mode: rw
spec:
  # Business responsibilities (catalogue L3, B-03) — the gates resolve a CAPABILITY, not a name.
  capabilities: [onboarder]
  # Worker role (interactive front-desk): brief = executable instruction, never a judge. REQUIRED (schema).
  brief_kind: worker
  # Fleet AND human on the same terminal: front-desk reached through Claude Desktop, and still
  # dispatched by the fleet. Both contracts are injected. REQUIRED (schema).
  interlocutor: both
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - WebFetch       # PascalCase: native Claude Code tool, allowed pod-side
      - WebSearch
      - ToolSearch     # loads the deferred tools (Monitor, mcp__fleet__*)
      - Monitor        # wake-by-flag (watch.sh) — wake without content send-keys
      # Fleet MCP tools of the FLEET-MASTER: ONLY the portfolio head (create/adopt a project + card
      # framing). NOT the delegation head (create_issue/status/escalations/comment) — that stays the
      # per-project architect (cf. DESIGN-carte-des-roles §5/§13: starfleet manages the box from outside,
      # it does not do a project's métier). get_work_item/submit_result (universal) come from the launcher.
      - mcp__fleet__list_workflow_cards  # framing FIRST: the catalogue the human picks the card from
      - mcp__fleet__create_project       # start a fresh project (repo + dual-dir + card)
      - mcp__fleet__import_project       # twin of create_project: ADOPTS an existing repo
      - mcp__fleet__open_project         # third verb: RELAUNCH a project already on the machine
      - mcp__fleet__revise_project_card  # BL-6-29: revise an engraved card (human chooses, future tickets only)
      - mcp__fleet__close_project        # BL-6-30: park a project (marker issue; running brick finishes, next never starts)
      - mcp__fleet__adopt_project        # BL-6-32: publish a disk-only project (inverse of import; local content never overwritten)
      - mcp__fleet__import_external_project  # BL-6-31: repatriate from GitHub/GitLab (adoption gate: foreign .claude refused, CLAUDE.md filtered)
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Destructive patterns come from the universal baseline (`baseline/git-denied.yaml`) — not duplicated.
    git_ops_denied: []
    # (no `outputs`: the ready-room/outbox line was a SYSADMIN reliquat left over from starfleet's
    # previous role — the fleet-master produces no deliverable to a commons dir. Removed 2026-07-19.)
  knowledge:
    # Pruned 2026-08-02 (BL-6-22): memory-query/brainstorming/plan named skills that never
    # existed (cf. architect.yaml, same note). card-revision is the FIRST real one — the
    # card-revision interview for revise_project_card (BL-6-29's skill half), mounted RO at
    # ~/.claude/skills/card-revision by the launcher.
    skills:
      - card-revision
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: forever  # permanent front-desk
    # DECLARED, not derived (g24_15): one starfleet per fleet, the same identity for its whole
    # life. Same reason as the architect — the derivation agrees, and that is not the point.
    slot_scope: project
    # DECLARED (g24_16): `interlocutor: both` — the fleet-level front desk a human talks to.
    # Invisible would make the door unreachable.
    remote_control: true
    model: opus
    effort: high
    # ACTIVATED (reorg 2026-07-19): starfleet is the boot front-desk (the arch → on-demand per-project).
    # The onboarding gate admits starfleet (require_onboarder) AND the forge is provisioned on the TEST
    # forge (account in org Owners — create+delete proven — + role token deployed at the layout). The
    # WORK forge (NAS) needs the same forge-master gesture at its next deploy.
    boot_at_start: true
    subagent_template: null
    host_native: false       # was true (sysadmin) — now an ordinary sandboxed pod
    # Human-terminal class (like the architect): the REPL is the human's conversation (Desktop
    # bridge) — NO kick send-keys at all, engage included (live 2026-07-19: a resumed starfleet took
    # the bootstrap engage drizzle ~3 min to the cap). Flag-only; the human/bridge side is the armer.
    wake_send_keys: false
    bridge_enabled: true     # user-facing front-desk → needs the Desktop bridge (like the arch)
    # (no `rubber_duck_enabled`: it is a DEAD flag — zero consumer in lib/ (the rubber-duck behaviour
    # lives in the modops/SP). Removed here 2026-07-19; the full field nuke is on the sabrer-list.)
  modop_set:
    default: [long-session-discipline]
    optional: [brainstorming, rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
