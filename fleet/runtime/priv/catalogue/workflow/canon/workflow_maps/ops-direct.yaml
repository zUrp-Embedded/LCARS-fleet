# Pipeline V2 — ops-direct (chantier face-projet, 2026-08-02)
#
# Date: 2026-08-02
# Statut: canon, INERTE tant que le moteur ne lit pas `face` (Phase 2 du chantier) — la
#         presentation le crie, cf. TECHNIQUE ci-dessous.
# Dérivé de: 00-PLAN/01-INVENTAIRE du chantier face-projet (work/beyond_#6) — arbitrages user.
# Consommé par: Fleet.Workflow.Loader (schema v2.5, clé `face` du step).
#
# LE CHEMIN DIRECT, et pourquoi il est direct — deux absences, toutes deux des DÉCISIONS :
#
#   PAS de scoper (pas de step brief-review) : sur un ticket ops, l'AUTEUR du brief est aussi le
#   juge du retour (l'arch écrit la demande de doc, l'arch relit le doc livré dans son mount RW).
#   Une porte de brief entre les deux arbitrerait un différend qui n'a qu'une partie. Propriété de
#   CE chemin, pas règle globale — un ticket ops routé un jour vers un jury retrouverait sa porte.
#
#   PAS de jury (`jury: []`, configuration supportée — précédent : audit-only, c0-poc) : les juges
#   sont calibrés sur du mécanique (tests, secrets, ancêtre) ; sur de la prose ils n'ont pas de
#   vérité terrain — trois opinions convergent vers la moyenne, chacune ajoutant la sienne, et le
#   livrable devient la bouillie des trois. L'arch juge le doc mergé, directement, dans son mount.
#   Le plancher mécanique (identité, secrets, ancêtre, sceau) tient seul, comme sur tout jury vide.

kind: WorkflowMap
metadata:
  name: ops-direct
  description: "Ticket documentaire — l'eng_doc rédige sur work/ops, merge scellé direct, l'arch relit dans son mount. Pas de scoper (l'auteur du brief juge le retour), pas de jury (pas de vérité terrain mécanique sur la prose)."
  presentation: "Carte TECHNIQUE (rail en construction — chantier face-projet Phase 2 non câblée : le moteur ignore encore `face`, la sélectionner aujourd'hui enverrait le producteur sur la mauvaise face). À terme : le chemin DIRECT des livrables documentaires, sur toute carte, à toute criticité."
  applicable_intensity: [C0, C1, C2, C3, C4]

spec:
  # Jury VIDE délibéré — cf. l'en-tête. Le plancher mécanique tient seul (précédent c0-poc).
  jury: []
  # Budget anti-emballement (obligatoire, donnée map-level). Sans jury il n'y a pas de
  # déclencheur de rework mécanique ; le budget borne les relances arch → nouveau ticket.
  max_rework_rounds: 2
  steps:

    # --- Step unique (racine ET terminal) : rédaction sur la face ops ---
    build:
      role: eng_doc
      # LA clé du chantier : le workspace du producteur clone work/ops, sa PR y retourne,
      # le réalignement post-merge suit cette face, et `main` devient sa référence RO.
      face: ops
      needs: []                     # racine DAG — et pas de successeur : chemin direct
      inputs:
        - ticket.body               # le brief rédigé par l'arch
