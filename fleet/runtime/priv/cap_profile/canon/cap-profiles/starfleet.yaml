# Cap-profile: starfleet
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# starfleet = the GLOBAL fleet orchestrator (front-desk + project organizer) — the user-facing
# FLEET-LEVEL controller. SANDBOXED (bwrap) like a briefing role: it reads project code to frame and
# organizes repos, so it belongs INSIDE the sanctuary (the world is protected from it, and its doctrine
# is protected from the human's ~/.claude). NO root / NO host-native anymore — the ex-sysadmin concern
# (systemd/ACL/provisioning) moves to a dedicated infra agent later; starfleet is a plain bwrap pod.
# (Reorg 2026-07-19: starfleet takes the global-orchestrator role; the arch specializes per-project.)
kind: CapabilityProfile
metadata:
  name: starfleet
  containment: bwrap
  # Role identity coordinates (the metadata IS the single source of the WHAT), read by the session_id
  # builder (SessionId.encode): role_index = role slot in the UUID (0 = starfleet) ; protected =
  # spared tier ; fleet_level = single instance, repo 0000 (no project dimension). kill_class derives
  # 0 (starfleet) from role_index 0 → `pkill -f 1badcafe`/`2badcafe` never touch it.
  role_index: 0
  protected: true
  fleet_level: true
  mounts:
    - path: /home/projects        # RO: read every project at once to frame/organize
      mode: ro
    - path: /home/projects.work   # RW: write the DOC (moon-shot/beyond), upstream of tickets
      mode: rw
spec:
  # Worker role (interactive front-desk): brief = executable instruction, never a judge. REQUIRED (schema).
  brief_kind: worker
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
      - WebFetch       # PascalCase: native Claude Code tool, allowed pod-side
      - WebSearch
      - ToolSearch     # loads the deferred tools (Monitor, mcp__fleet__*)
      - Monitor        # wake-by-flag (watch.sh) — wake without content send-keys
      # Fleet MCP tools of the global orchestrator (delegation + project organization) —
      # get_work_item/submit_result (universal) come from the launcher.
      - mcp__fleet__list_workflow_cards  # framing FIRST: the catalogue the human picks the card from
      - mcp__fleet__create_project
      - mcp__fleet__import_project       # twin of create_project: ADOPTS an existing repo
      - mcp__fleet__create_issue
      - mcp__fleet__get_issue_status
      - mcp__fleet__list_escalations     # return channel: reads the awaits-arch escalations
      - mcp__fleet__comment_issue        # return channel: replies on an in-flight ticket
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Destructive patterns come from the universal baseline (`_baseline-git-denied.yaml`) — not duplicated.
    git_ops_denied: []
    outputs: ["/home/ready-room/outbox/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
      - methodologie-doctrine-yolo
      - methodologie-regles-yolo
    skills:
      - memory-query
      - brainstorming
      - plan
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: forever  # permanent front-desk
    model: opus
    effort: high
    # PREPARED, not yet ACTIVATED. This profile DECLARES starfleet's target tool surface (the orchestrator
    # MCP tools below), but activation is a deliberate later step with THREE flips, none silent:
    #   1. this `boot_at_start` → true (+ the arch → on-demand + the create/relaunch flows);
    #   2. the MCP delegation/onboarding gate (`Delegation.require_architect`) must ADMIT starfleet — today
    #      those four tools are architect-only server-side, so starfleet would be refused if it called them;
    #   3. a `starfleet` forge token deployed (issues authored in starfleet's own account, like the arch).
    # Until all three land, starfleet is defined but does not boot and cannot yet delegate.
    boot_at_start: false
    subagent_template: null
    mcp_channels: ["fleet-control.*", "fleet-forge.*"]
    host_native: false       # was true (sysadmin) — now an ordinary sandboxed pod
    max_alive_sec: null
    heartbeat_keepalive: false
    bridge_enabled: true     # user-facing front-desk → needs the Desktop bridge (like the arch)
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: true
    output_format: text
  injects:
    gitconfig: true
    forge_signing_allowed: false
  modop_set:
    default: [long-session-discipline]
    optional: [brainstorming, rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
