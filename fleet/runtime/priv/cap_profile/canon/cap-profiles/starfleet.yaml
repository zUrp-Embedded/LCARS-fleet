# Cap-profile: starfleet
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
#
# starfleet lives OUTSIDE bwrap (host-native sysadmin): it manages host
# infrastructure (systemd, ACL, bwrap config, provisioning), which a sandbox
# would break. Like every host-native role it would run AS the human by UID
# inheritance (host_launch.sh — no UID drop, no sandbox).
kind: CapabilityProfile
metadata:
  name: starfleet
  containment: none
  # Role identity coordinates (the metadata IS the single source of the WHAT), read via
  # Fleet.CapProfile by the spawner to mint the hexspeak session_id (the SessionId encoder
  # holds no catalogue): role_index = role slot in the UUID; protected = tier spared by
  # the worker kill; fleet_level = single instance with no project dimension (repo 0000).
  # starfleet has NO pod today (host-native sysadmin, outside the fleet); these fields
  # reserve its role_index 0 slot.
  role_index: 0
  protected: true
  # fleet_level true: the runtime sysadmin does not touch projects -> fleet-level (repo 0000).
  # Inert as long as starfleet spawns no pod.
  fleet_level: true
spec:
  # Host-native system role: brief = executable instruction, never a judge. REQUIRED (schema) — never inferred.
  brief_kind: worker
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      - Bash
      - Write
      - Edit
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # Destructive patterns come from the universal baseline
    # (`_baseline-git-denied.yaml`, intangible) — not duplicated here.
    git_ops_denied: []
    outputs: ["/home/commons/starfleet/", "/var/log/fleet-starfleet.jsonl"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-doctrine-yolo
      - methodologie-regles-yolo
    skills: []  # modops are listed in modop_set
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: forever  # host-native permanent process
    model: opus        # catalogue -> --model (alias or full name; tunable)
    effort: high       # catalogue -> --effort {low,medium,high,xhigh,max}; tunable
    boot_at_start: false     # starfleet is NEVER spawned by the fleet boot (no pod today — identity reserved)
    subagent_template: null
    mcp_channels: ["fleet-control.*", "fleet-forge.*"]
    host_native: true
    max_alive_sec: null  # forever — host-native, until fleet shutdown
    heartbeat_keepalive: false
    bridge_enabled: false
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: false
    output_format: text
  injects:
    gitconfig: true
    forge_signing_allowed: true
  modop_set:
    default: []
    optional: [fire-mode, rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
