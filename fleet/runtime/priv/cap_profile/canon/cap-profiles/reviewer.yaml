# Cap-profile: reviewer
# Contract: this file + Fleet.CapProfile (@moduledoc, current SSoT).
# Schema: ../../schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: reviewer
  containment: bwrap
  # Role identity coordinates, read by the session_id builder (single source of the WHAT):
  # role_index = role slot in the hexspeak UUID.
  role_index: 5
spec:
  # PR judge ("the code does the brief" — a REVIEW). Receives a DEFUSED GateBrief (context +
  # deliverable + verdict contract, NO executable instruction — I-CBC) instead of the issue
  # body: without it (default `worker`) the reviewer would EXECUTE the build instead of
  # judging it. Entry dual of deliverable_mode (output = `payload` default: a verdict, not a git patch).
  brief_kind: judge
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # GENERIC Bash (a SCOPED pattern-list hangs in --permission-mode default). Real
      # enforcement = the MOUNT (RO/RW) + git_ops_denied (push/rebase/commit hard-denied
      # -> forge-blind AND commit-less).
      - Bash
      # Report writing: Write/Edit bounded by the RW MOUNT (not by the tool-list).
      - Write
      - Edit
      # Wake rail (Monitor loaded via ToolSearch) — required in --permission-mode default.
      - Monitor
      - ToolSearch
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # `push --force` and `reset --hard` come from the universal baseline
    # (`_baseline-git-denied.yaml`) — not duplicated here. Reviewer-specific
    # restrictions remain (writes its narrative note only, never touches
    # the workspace): no push/rebase/commit.
    git_ops_denied: ["push", "rebase", "commit"]
    outputs: ["/home/commons/reviewer/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
    skills: []  # modops are listed in modop_set
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: opus        # catalogue -> --model (alias or full name; tunable)
    effort: high       # catalogue -> --effort {low,medium,high,xhigh,max}; tunable
    boot_at_start: false
    subagent_template: code-quality-reviewer
    mcp_channels: ["fleet-control.reviewer.*"]  # fleet-control: Memory-X + coord. NO fleet-forge channel: a judge clones in-pod and returns a payload verdict — NOTHING to do with the forge.
    host_native: false
    heartbeat_keepalive: false
    bridge_enabled: false
    remote_control: false  # invisible to Claude Desktop (ephemeral, churny judge) — no --remote-control
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: false
    output_format: json
  injects:
    gitconfig: false
    forge_signing_allowed: false
  modop_set:
    default: []
    optional: [dual-review]
    incompatible: []
    # (fire-mode REMOVED — codex audit F-05 2026-07-19: its v1.5 output model — JSON on stdout,
    # self-exit one-shot — predates MCP submit_result and contradicted the runtime protocol; the
    # anti-conversation discipline lives in the base worker SP blocks.)
  project: null
