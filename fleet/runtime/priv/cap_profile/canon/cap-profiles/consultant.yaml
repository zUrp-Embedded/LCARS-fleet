# Cap-profile : consultant
# Date : 2026-05-18
# Référencé par : design-notes/ring2/cap-profiles.md (tableau récap §L109)
# Schema : ../../07_code/runtime-v2/apps/fleet_cap_profile/priv/schema/cap-profile-v2.5.json
kind: CapabilityProfile
metadata:
  name: consultant
  containment: bwrap
  # Coordonnees d'identite du role, lues par le builder de session_id (source unique du QUOI) :
  # role_index = slot role dans l'UUID hexspeak ; protected = tier epargne par le kill des workers ;
  # fleet_level = instance unique sans dimension projet (repo 0000).
  role_index: 6
  protected: false
  fleet_level: false
  slot_scope: instance  # fan-out par issue (consultant-as-judge ephemere, invisible Desktop)
spec:
  # Profil WORKER : brief exécutable par défaut. Devient juge VIA l'override per-step (`brief_kind: judge`
  # au step brief-review) — pas de profil dupliqué. REQUIS (schéma) — la judge-ness ne s'infère jamais.
  brief_kind: worker
  scope:
    allowedTools:
      - Read
      - Glob
      - Grep
      # #kill-yolo : Bash GÉNÉRIQUE (scopé = hang en --permission-mode default). Enforcement = MOUNT (RO/RW)
      # + git_ops_denied (push/reset/rebase/commit hard-denied → lecture seule côté forge ET commit).
      - Bash
      # Rapport : Write/Edit bornés par le MOUNT RW (pas la tool-list).
      - Write
      - Edit
      # #kill-yolo : rail wake (Monitor via ToolSearch) — requis en --permission-mode default.
      - Monitor
      - ToolSearch
    disallowedTools:
      - web_search
      - web_fetch
      - code_execution
      - bash_code_execution
      - text_editor_code_execution
      - tool_search_python
      - tool_search_bash
    # `push --force`, `reset --hard`, `rebase main` etc déclarés au baseline
    # universel (`_baseline-git-denied.yaml`) — pas dupliqués ici. Restent les
    # restrictions spécifiques consultant : pas de push/reset/rebase/commit
    # (rôle audit, ne touche pas le workspace).
    git_ops_denied: ["push", "reset", "rebase", "commit"]
    outputs: ["/home/commons/consultant/"]
  knowledge:
    libs:
      - methodologie-axiome-inference-vs-mecanisable
      - methodologie-protocole-design-note
      - methodologie-doctrine-yolo
      - methodologie-anti-patterns-agent-2026-05-16
    skills: []  # modops listés dans modop_set, pas dans skills (cf. F-12 audit consultant)
    mcpServers: []
    plugins: []
    monk_registry: null
    monk_instance: null
  invocation:
    lifetime_scope: one-shot
    model: opus        # catalogue → --model (alias/nom complet ; tunable)
    effort: high       # catalogue → --effort {low,medium,high,xhigh,max} ; tunable
    boot_at_start: false
    subagent_template: null
    mcp_channels: ["fleet-control.consultant.*", "fleet-forge.consultant"]  # fleet-control: Memory-X + coord ; fleet-forge: routing tickets Gitea
    host_native: false
    max_alive_sec: 7200
    heartbeat_keepalive: false
    bridge_enabled: false
    policy: hide
    rubber_duck_enabled: false
    long_session_protocol: false
    output_format: text
  injects:
    gitconfig: false
    forge_signing_allowed: false
  modop_set:
    default: [fire-mode, archive-mode]
    optional: [rubber-duck]
    incompatible: [[fire-mode, long-session-discipline]]
  project: null
