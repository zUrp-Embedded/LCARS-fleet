# Canonical event registry (subscribers-direct model = canon).
#
# `events.yaml` is a **pure registry**: its KEYS are the `authorized_event_types`
# (loaded at boot by `Fleet.EventRouter.Catalog.load!/0` → `Bus.broadcast/2`
# fail-loud on any type outside the registry). Every emitted event MUST have its key here.
#
# **Consumption** is done by **direct subscribers** (Phoenix.PubSub:
# `Bus.subscribe` + `handle_info`) — NOT by a dispatch table. The `Dispatch`
# GenServer (table `event → handle_event/1`, never wired) was REMOVED. Which
# consumer consumes which event is documented in each consumer's moduledoc
# (`AuditConsumer`, `DriftMonitor`, `Spawner.PublishConsumer`,
# `API.WS`, `Pilot.StepRunConsumer`, …). (The RAM engine `Pipeline.Executor`, once
# a consumer, is removed: the forge-driven rail `Pilot.StepRunConsumer` replaced it.)
#
# Values = `[]` (pure registry). The schema (`events-v1.json`) tolerates a non-empty
# list of `Fleet.*` handlers for a possible future re-wiring, but the runtime
# consumes none.
events:
  # --- Pod lifecycle (Spawner.Pod) ---
  # Hollow-producer cleanup: `Spawner.Pod` emits ONLY `pod.completed` + `pod.failed`
  # (call-sites verified). `pod.allocate`/`transition`/`release`/`terminated`/
  # `refuse_pattern_match` were registered but NEVER produced (0 producer, 0 type-specific
  # consumer) = registry lie (the registry must reflect reality). Removed; to re-add WITH a
  # producer if pod progression becomes observable.
  pod.completed: []
  pod.failed: []
  # pod.drift: consumed by DriftMonitor; producer LIVE (F-C043) — Fleet.Spawner.PermanentBoot
  # emits it (source :spawner) on a corrupt versioned base seed. drift_count>=3 => Cat5Escalator.
  pod.drift: []
  # CAT-5 CHAIN (partially wired, Q2 2026-07-09): `workflow_map.failed` and `audit.verdict` now have a
  # DRAFT producer (`Pilot.StepRunConsumer`, source `:workflow`) → the DriftMonitor→Cat5Escalator/
  # CoordBackend→coord rail BLINKS end-to-end on a real signal (draft, not the final signal — see the
  # per-key comments). STILL DORMANT: `oauth.refresh.failed` (never implemented on the launcher/credentials side) — no
  # honest signal to emit yet. (`pod.drift` is now LIVE via Fleet.Spawner.PermanentBoot, F-C043.) Keys kept: consumers wired + tested, ready.
  # wake.failed: emitted by `Spawner.Pod` when the onboarding kick is abandoned after N
  # attempts (agent never acked) — payload `pod_id`/`reason`/`pane`. Consumed by
  # `Fleet.Pilot.IncidentConsumer` (`type: :"wake.failed"` → `:sp_suspect` escalation, pane attached to the issue).
  # Real producer AND consumer → legitimate key (was absent = consumed-outside-registry, contracts-check red).
  wake.failed: []
  # spawn.failed: emitted by `Spawner.PublishConsumer` (source :spawner) when the dispatch of an
  # `admin.spawn.request` RAISES (CapProfile/spawn_pod fails unexpectedly) → the spawn is dropped.
  # The REST API has already replied HTTP 202 "queued" to the client BEFORE this async dispatch → without
  # this event the drop is SILENT (the admin thinks the pod is queued; zero pod, zero alarm). Twin of
  # `pod.failed`, same cycle. Payload `cap_profile_name`/`issue_id`/`reason`. Real producer; consumer
  # (dashboard/operator) to come — legitimate key (without it the broadcast would UnregisteredError → re-drop silently).
  spawn.failed: []

  # --- Credentials ---
  oauth.refresh.failed: []

  # --- Audit gatekeeper / forge tickets / tick ---
  # `audit.verdict` (2 segments) — consumed by DriftMonitor (`%Fleet.Event{source: :workflow,
  # type: :"audit.verdict"}`, routed DIRECTLY to CoordBackend.handle_decision) AND, since Q2
  # (2026-07-09), produced by a DRAFT emitter: `Pilot.StepRunConsumer.apply_verdict` broadcasts it
  # (source `:workflow`) on an escalation-worthy judge verdict, decision-v1 `{decision: "escalate",
  # reason: "audit_verdict"}`. The old key `audit.verdict.gatekeeper` (3 segments, never emitted) was
  # misaligned with the consumer → dead consumer. DRAFT: coarse verdict→decision-v1 translation.
  audit.verdict: []
  # The producer (`WebhooksGitea`, dynamic `gitea.<action>`) + the pre-registered atoms
  # (`event_router/application.ex` `to_existing_atom`) emit THESE 10 actions. Having only
  # opened/closed → the 8 others would broadcast as SILENT `UnregisteredError` (rescue `:ok`)
  # → webhook 200 OK but event never routed (silent drop). Registry aligned on the producer
  # (otherwise a `gitea.*` subscriber never sees reopened/merged/edited/…).
  gitea.opened: []
  gitea.closed: []
  gitea.reopened: []
  gitea.merged: []
  gitea.edited: []
  gitea.created: []
  gitea.synchronized: []
  gitea.deleted: []
  gitea.push: []
  gitea.unknown: []

  # --- OS signals (SignalsOS, source :event_router) — DORMANT / UNEMITTED ---
  # NOT currently emitted: `SignalsOS` is INERT (init/1 fail-loud raises; gated off by default,
  # `:start_signals`=false). These keys are pre-registered so that IF/WHEN the real producer lands
  # (F037 — a gen_event handler on `:erl_signal_server`) the broadcast is not a silent drop. No routed
  # consumer either (the drain goes through ExecStop/Shutdown, not through a signal).
  os.signal.sigusr1: []
  os.signal.sigterm: []
  os.signal.sighup: []

  # --- Admin spawn ---
  admin.spawn.request: []

  # --- Boot lifecycle (BootOrchestrator) ---
  fleet.boot_complete: []
  fleet.boot_partial: []
  fleet.boot_failed: []

  # --- Coord (Policies, source :coord) ---
  # Real producer (`Coord.Policies` → `Coord.Emitter`); consumed by `Fleet.Observation.ReadModel`
  # (routes `coord.*` into the coordination / gatekeeper decks, cf. read_model.ex @deck_prefixes). Legitimate keys (a producer emits them → silent
  # drop avoided); a consumer (dashboard / operator) will come and subscribe.
  coord.notification_routed: []
  coord.escalation_triggered: []
  coord.action_dispatched: []

  # --- Workflow-map (source :workflow) ---
  # `workflow_map.failed` — consumed by `Starfleet.DriftMonitor` (→ Cat 5) AND, since Q2 (2026-07-09),
  # produced by a DRAFT emitter: `Pilot.StepRunConsumer` broadcasts it (source `:workflow`) on a
  # `:workflow_map_load_failed` (the WorkflowMapNav single authority). The old RAM-engine producer
  # (`Pipeline.Executor`) was removed; this is the "forge-driven rail publishes a workflow_map failure
  # signal" anticipated here. DRAFT: covers the main dispatch load-failure, not yet every rail path.
  workflow_map.failed: []
  # deliverable.published (slot-freeze): emitted by Pilot.StepRunCompleter (source :workflow — the
  # publication IS a workflow op via Deliverable.publish) AFTER push + PR confirmed, carries `pod_id` (the
  # producer pod, from the pod.completed payload). Consumed by Spawner.Pod: a resident pod (pipe) goes
  # :publishing → :ready (its workspace has been READ/pushed, it can be reset for the next issue without
  # racing the push). Real producer.
  deliverable.published: []

  # --- post_extract.git (REMOVED) ---
  # `git.published`/`git.publish_failed` REMOVED: 0 producer (the RAM engine `Pipeline.Executor`
  # was removed; `Pipeline.Git.publish/1` does not broadcast) AND 0 consumer (the
  # `Starfleet.AuditConsumer` clause was RAZED 2026-07-04, cf. `audit_consumer.ex`). 0 producer +
  # 0 consumer = registry lie (the registry must reflect reality, exactly as pod.allocate/transition
  # above). The prior comment still claimed "consumed by AuditConsumer / consumer wired" — false since
  # the raze. To re-add WITH a producer AND a consumer if git publication becomes observable again.

  # --- Cat 5 broadcasts (Cat5Escalator, source :starfleet) ---
  starfleet.audit_cat5_pod_drift: []
  starfleet.audit_cat5_workflow_map_failed: []
  starfleet.audit_cat5_oauth_refresh_failed: []

  # --- TaskQueue lifecycle (source :task_queue) ---
  work_item.enqueued: []
  work_item.assigned: []
  work_item.completed: []
  work_item.cleared: []
  work_item.failed: []
  state.corrupt: []

  # --- V2 extensions (MCPWatcher / MCPMonitor) ---
  sdk.upstream_alert: []
  mcp.server_crashed: []
