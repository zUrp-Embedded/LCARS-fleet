# LCARS Fleet — Docker Compose
# Implementation detail — users interact via ./docker.sh at repo root.
# Context points to repo root (../../..) so Dockerfile COPY works.

services:
  lcars:
    build:
      context: ../../..
      dockerfile: fleet/provisioning/docker/Dockerfile
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - LCARS_REPO=${LCARS_REPO:-}
    volumes:
      - ../../../claude-home:/home/lcars/.claude
      - ../../../ready-room:/home/ready-room
