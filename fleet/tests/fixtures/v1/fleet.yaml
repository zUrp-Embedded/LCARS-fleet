# FIXTURE — minimal fleet.yaml for testing
# Mirrors real structure with test-safe values
fleet:
  version: "6.0.0-test"
  release_phase: "rc"
  release_target: "6.0.0"
  requires:
    directives: ">=6.0.0"
    protocole: ">=6.0"
    fleet: ">=6.0.0"
  project: LCARS-test
  repo: testuser/LCARS-test
  branch: main
  group: fleet
  lang: fr
  paths:
    commons: /tmp/test-commons
    handoffs: /tmp/test-handoffs
    fleet_state: /tmp/test-fleet-state
    lcars_root: /tmp/test-lcars
    homes_root: /tmp/test-homes
    ready_room: /tmp/test-ready-room
  runtime: {}
  identity:
    fleet_user: testuser
    windows_user: testuser

spool:
  root: /tmp/test-spool

instances:
  - role: starfleet
    tier: 0
    scope: boundary-os
    stateless: true
  - role: architect
    tier: 0
    scope: boundary-user
    stateless: false
  - role: engineer
    tier: 1
    scope: sas-user
    stateless: false
  - role: dev
    tier: 2
    scope: code
    stateless: false
  - role: qualifier
    tier: 2
    scope: test
    stateless: true
  - role: reviewer
    tier: 2
    scope: analysis
    stateless: true
