# SOURCE: fleet/provisioning_v2/docker/console.tmux.conf
# AUTHOR: consultant
# STARDATE: 2026-07-31
# STATUS: config tmux de la CONSOLE WEB uniquement (ttyd) — pas celle des pods
#
# Pourquoi ce fichier existe : sans lui, la console perd le haut de l'ecran. tmux possede l'ecran
# (mode alternatif), donc le scrollback de xterm.js cote navigateur ne voit RIEN — la molette ne
# remonte pas, et tout ce qui defile au-dessus du viewport est inatteignable. Les deux reglages
# ci-dessous rendent la molette et l'historique.
#
# PORTEE : ce fichier ne s'applique qu'au serveur tmux de la console (socket par defaut de
# l'humain, lance par console.sh avec `-f`). Les pods ont LEURS sockets (`-S <sock>` par pod,
# bwrap_launch) et ne sont pas concernes : aucune interference avec le sanctuaire.

# La molette entre en copy-mode et fait defiler l'historique (le comportement attendu dans un
# navigateur). Une app qui demande la souris (Claude Code en plein ecran) la recoit quand meme :
# tmux route vers l'app en mode alternatif, et vers l'historique sinon.
set -g mouse on

# 50 000 lignes de scrollback : un build, un gate ou une session d'agent depassent tres vite les
# 2 000 par defaut, et ce qui sort du buffer est perdu pour de bon.
set -g history-limit 50000

# Le terminal servi par ttyd gere 256 couleurs + le vrai gras : le dire a tmux, sinon la palette
# LCARS et le rendu de Claude Code degradent.
set -g default-terminal "tmux-256color"

# Navigation de l'historique aux touches vi (k/j, /recherche) — cheap et attendu.
setw -g mode-keys vi

# Pas de delai sur Echap : sinon la sortie d'un mode dans une app TUI traine (~500 ms percus
# comme une latence de l'interface).
set -sg escape-time 10
