# SOURCE: fleet/deploy/docker/docker-compose.yml
# AUTHOR: DrDree
# STARDATE: 2026-07-05
# STATUS: PROTO-V2 — LCARS fleet v2. UN SEUL service : la forge n'est PAS ici (cf. ci-dessous)
#
# Détail d'implémentation derrière ./docker.sh (racine repo) — l'humain ne le touche pas.
#
# LA FORGE N'EST PAS DANS CE FICHIER, ET C'EST LA DÉCISION QUI COMPTE (user) :
# LCARS est CATTLE (on ne le soigne pas, on le nuke et on redéploie) ; la forge est le PET —
# elle porte les repos, les issues, les PR, c'est-à-dire la seule copie durable du travail.
# Deux natures dans un même projet compose partagent l'interrupteur de destruction : `down -v`
# emporte les deux, et un drapeau de sécurité ne l'empêche pas — seule la séparation des projets
# le fait. La forge est donc provisionnée par l'OPÉRATEUR, avec
# l'outil qu'il veut (app TrueNAS, Docker Desktop, machine dédiée), et LCARS ne la connaît que
# par deux entrées : son URL, et un token master fourni au déploiement.
# Pour un besoin de DÉV (une forge jetable en une commande) : `docker/dev/forge-compose.yml`,
# projet SÉPARÉ, hors du chemin nominal — cf. son en-tête.
# Contexte de build = LA RACINE DU REPO (../../.. depuis CE fichier — vérifié : c'est le
# path-rot du nid v1 qui avait tué la chaîne d'avant ; le .dockerignore racine s'applique).
#
# bwrap DANS le conteneur : les pods exigent unshare/mount/pivot_root/setns (userns + mountns).
# Le profil seccomp Docker par défaut les bloque → cap SYS_ADMIN sur CE service. Trade assumé et
# documenté : la frontière de containment des PODS est bwrap À L'INTÉRIEUR (l'octogone) ; la
# frontière du conteneur, elle, est perméable aux syscalls de namespaces. PAS de
# `privileged: true` (surface bien plus large).
#
# 6-071 — L'ARBITRAGE EST MESURÉ, PLUS SUPPOSÉ, et le `seccomp=unconfined` est TOMBÉ. Quatre runs
# sur l'image du banc, `bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true` :
#
#   1. seccomp=unconfined + SYS_ADMIN ........ OK  (l'état d'avant)
#   2. seccomp=lcars-hardened + SYS_ADMIN .... OK  ← ce que ce fichier pose désormais
#   3. seccomp=lcars-hardened SANS SYS_ADMIN . KO  « No permissions to create new namespace »
#   4. seccomp DÉFAUT docker + SYS_ADMIN ..... KO  « pivot_root: Operation not permitted »
#
# Donc : le profil durci (défaut docker + les syscalls de namespace, `defaultAction: ERRNO`) suffit,
# et `SYS_ADMIN` n'est PAS retirable — mesuré, pas déduit. Le run 4 confirme au passage la prémisse
# de ce commentaire, qui n'avait jamais été vérifiée.
#
# ⚠ `apparmor=unconfined` RESTE, et ce qui manque est une MESURE, pas une décision : AppArmor n'est
# pas actif sur la boîte de dev (`docker info` → SecurityOptions sans `name=apparmor`), donc tout run
# vert y est muet sur lui. Le retirer sur cette foi-là serait répondre à une question voisine. Ce qui
# tranchera : rejouer les quatre runs sur un hôte où `docker info` annonce AppArmor — le profil
# `docker-default` refuse `mount`, donc l'attente est un KO, et c'est justement ce qu'il faut voir
# avant d'y toucher.
#
# Le chemin du profil est RELATIF au fichier compose, pas au cwd de l'appelant — vérifié par un
# contrôle : profil retiré d'à côté du compose, docker nomme le chemin absolu qu'il a tenté.

name: lcars

services:
  lcars:
    build:
      context: ../../..
      dockerfile: fleet/deploy/docker/Dockerfile
      args:
        GIT_SHA: "${LCARS_GIT_SHA:-unknown}"
        BUILD_DATE: "${LCARS_BUILD_DATE:-unknown}"
    # LE TAG EST UNE VARIABLE, ET CE N'EST PAS DU CONFORT. Ecrit en dur, un `compose build` ECRASE
    # ce tag pour tout le monde — y compris un banc qui TOURNE et qui le reference : le conteneur
    # vivant n'est pas touche (il tient son image par son id), mais l'image d'origine cesse d'etre
    # adressable et son prochain redemarrage le fait glisser en silence sur le code du dernier
    # build. Mesure du 2026-08-03, sur ce fichier : un build lance avec `LCARS_IMAGE=lcars-fleet:nuit`
    # a quand meme ecrase `:2`, parce que la variable n'etait lue nulle part ici. Le compose
    # d'installation, lui, la lisait deja — la dissymetrie etait le piege.
    #
    # Pour construire A COTE d'un banc qui travaille : `LCARS_IMAGE=lcars-fleet:<nom> docker compose build`.
    image: "${LCARS_IMAGE:-lcars-fleet:2}"
    # Le hostname se LIT dans le prompt (`\h`) et dans le titre des sessions : sans lui, docker
    # colle le hash du conteneur (`aa23b9d888c9`), illisible et different a chaque recreation.
    # `bridge` : c'est la passerelle — le poste depuis lequel on pilote, pas la machine.
    hostname: "${LCARS_HOSTNAME:-bridge}"
    environment:
      LCARS_HUMAN: "${LCARS_HUMAN:-lcars}"
      LCARS_UID: "${LCARS_UID:-1000}"
      LCARS_SSH_AUTHORIZED_KEYS: "${LCARS_SSH_AUTHORIZED_KEYS:-}"
      # La forge de l'opérateur. Pas de défaut vers un sidecar qui n'existe plus : vide =
      # les modules forge passent en instruct-only et le doctor le DIT (drift, pas panne).
      # Depuis un conteneur, l'hôte se joint par `host.docker.internal` (mesuré vivant).
      FORGE_BASE_URL: "${FORGE_BASE_URL:-}"
      # LA MEME FORGE, VUE D'UN NAVIGATEUR. `FORGE_BASE_URL` est l'adresse que le SERVEUR compose ;
      # dans un conteneur c'est le nom du service, que la machine d'une personne ne résout pas. La
      # porte du deck envoie le navigateur ICI pour s'identifier, donc une valeur interne rend
      # l'identification impossible depuis n'importe quel autre poste. Vide = on retombe sur
      # l'interne, et `55-deck-oidc` le DIT en drift plutôt que de poser une porte qui ne s'ouvre pas.
      FORGE_PUBLIC_URL: "${FORGE_PUBLIC_URL:-}"
      # Les adresses par lesquelles on entre VRAIMENT sur le deck (séparées par des virgules).
      # OAuth2 compare le `redirect_uri` EXACTEMENT : une entrée non déclarée échoue au RETOUR,
      # après l'identification, là où c'est le plus déroutant. La loopback est toujours incluse
      # par le module ; ce qui se déclare ici, c'est le reste (l'adresse de bind, le nom d'hôte).
      LCARS_DECK_ORIGINS: "${LCARS_DECK_ORIGINS:-}"
    ports:
      # SSH = la porte d'ADMIN (login-manager). Les listeners fleet restent en loopback DANS le
      # conteneur (frontière = isolation réseau) : on y accède par tunnel SSH.
      - "${LCARS_SSH_PORT:-127.0.0.1:2222}:22"
      # ⚠ PLUS AUCUN PORT DE BLOC N'EST PUBLIÉ, ET C'EST LA FIN D'UN GESTE COMMENCÉ À MOITIÉ.
      #
      # Ces lignes ont publié `21000-21029` (30 ports, 30 docker-proxy), puis six ports énumérés,
      # puis zéro. À chaque étape la mesure disait la même chose et on ne l'écoutait qu'à moitié :
      # MESURE DU 2026-08-14, dans la boîte, en LISTEN — trois écoutants seulement (`22`, `20999`,
      # `21000`), et RIEN entre 21001 et 21030. Cinq publications sur huit pointaient sur le vide,
      # dont QUATRE réservées à des humains qui n'existaient pas : ce fichier ne peut pas découvrir
      # les humains au boot, alors il pré-publiait des blocs au cas où.
      #
      # POURQUOI CE N'EST PAS NEUTRE : les listeners bindent `0.0.0.0` DANS le conteneur — c'est
      # délibéré, la frontière réelle est la publication. Donc CE BLOC EST LA FRONTIÈRE, et un port
      # publié en trop est une porte ouverte sur un service qui n'existe pas encore, dans un
      # conteneur qui porte SYS_ADMIN.
      #
      # `base+3` (webhook) : mort — voir `bin/fleet_v2`, le slot est sorti de la formule.
      # `base+0` (API) : la surface a été SUPPRIMÉE, pas dépubliée — elle n'avait aucune capacité
      #                  propre (états servis par l'observation, WS coupé, diagnostics avec jumeau
      #                  CLI, écritures sur AF_UNIX) et personne ne l'appelait.
      #
      # ⚠ PRÉ-REQUIS DE L'UID TIRÉ DE LA FORGE : tant qu'une plage était pré-publiée par bloc, un
      # UID non contigu la manquait en silence. `lcars` = id forge 3 → uid 1003 → bloc 21030, hors
      # de toute plage devinée ici. Ne PAS re-publier par bloc : ce fichier ne peut pas savoir.
      #
      # La HOME de la boîte, hors de l'espace des blocs parce qu'elle n'appartient à aucun humain :
      # c'est la porte de la boîte, et désormais la SEULE avec ssh.
      - "${LCARS_LANDING_PORT_BIND:-127.0.0.1:20999}:20999"
    volumes:
      - lcars-home:/home
      # PAS de bind-mount de la source ici, et c'est MESURÉ, pas frileux : le daemon ne voit pas
      # forcément le FS d'où l'on parle (Docker Desktop + WSL non intégrée → le bind se résout
      # dans le VM du daemon et rend un dossier VIDE, silencieusement — pire que pas de montage,
      # la fleet croirait sa source présente). La source vit donc DANS le volume d'état, posée
      # par le geste « ./docker.sh source-push » qui marche quelle que soit la topologie.
    cap_add:
      - SYS_ADMIN
    security_opt:
      # 6-071 — mesuré : ce profil suffit à bwrap, le défaut docker non (cf. l'en-tête).
      - seccomp=./lcars-hardened-seccomp.json
      - apparmor=unconfined
    # Les logs d'une boite qui tourne 24/7 grossissent SANS FIN par defaut : `docker inspect`
    # rend `json-file` avec ZERO option (mesure du 2026-07-31). L'entrypoint, ttyd, le provision
    # et le BEAM ecrivent jusqu'a remplir le disque du NAS — panne certaine, au pire moment, et
    # invisible jusque-la. 5 x 10 Mo = 50 Mo plafonnes, largement au-dessus d'un cycle de debug.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks: [lcars]

volumes:
  lcars-home:

networks:
  lcars:
