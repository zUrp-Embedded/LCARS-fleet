# SOURCE: fleet/deploy/docker/runner-compose.yml
# AUTHOR: DrDree
# STARDATE: 2026-08-01
# STATUS: runner CI — ne fait PAS partie de LCARS, comme la forge
#
# ┌──────────────────────────────────────────────────────────────────────────────────────────┐
# │ CE FICHIER N'EST PAS UN COMPOSANT DE LCARS.                                              │
# │ Le runner CI, comme la forge, appartient à l'OPÉRATEUR et se pose AVANT l'install.       │
# │ LCARS ne fabrique ni l'un ni l'autre : il consomme une forge (URL + token) et suppose    │
# │ qu'un runner répond aux labels que ses workflows demandent. Ceci est la recette qui      │
# │ marche, pas une dépendance de la boîte.                                                  │
# └──────────────────────────────────────────────────────────────────────────────────────────┘
#
# POURQUOI SÉPARÉ DE L'INSTANCE — la raison est un mode de défaillance, pas du rangement :
# un job CI exécute du code arbitraire (une dep vérolée, un tag poussé par n'importe qui). S'il
# tourne DANS l'instance, le compromettre compromet la fleet. Dans son propre projet compose, on
# le nuke et on le repose sans toucher au reste. C'est la même règle qui a sorti la forge de
# `docker-compose.yml` le 2026-07-31.
#
# CE QU'IL COÛTE, ET IL FAUT LE SAVOIR AVANT DE LE POSER : le mount du socket docker donne au
# runner le POUVOIR DAEMON — root-équivalent sur la machine hôte. C'est le trade standard d'act_runner
# et il est inhérent : construire une image depuis la CI exige de parler au daemon. La frontière de
# confiance du CI est donc le DAEMON, jamais le job. Un job hostile ne casse pas le runner : il a la
# machine. Ne pose ce fichier que sur une machine dont tu acceptes ce modèle.
#
# LANCER :   docker compose -f fleet/deploy/docker/runner-compose.yml -p lcars-runner up -d
# DÉTRUIRE : docker compose -f fleet/deploy/docker/runner-compose.yml -p lcars-runner down -v
#
# PREMIER BOOT — un token d'enregistrement est requis, minté PAR la forge (site-admin) :
#   POST /api/v1/admin/actions/runners/registration-token
#   LCARS_RUNNER_TOKEN=<token> docker compose … up -d
# Une fois enregistré, l'identité vit dans le volume `runner-data` (`.runner`) et le token n'est
# plus lu aux boots suivants. Sans token au premier boot, le service boucle EN LE DISANT — bruyant
# et honnête, jamais silencieusement inactif.

name: lcars-runner

services:
  act:
    # TAG MOUVANT, DELIBERE — runner Gitea officiel (jamais d'image custom pour l'infra CI).
    #
    # ⚠ LE NOM A CHANGE EN AMONT, ET UN TAG MOUVANT NE POUVAIT PAS LE VOIR. Gitea a renomme le
    # produit `act_runner` -> `runner` le 2026-04-30 (binaire `gitea-runner`, depot `gitea/runner`,
    # `v1.0.0` en remise a zero de version). Mesure du 2026-08-22 sur Docker Hub :
    #
    #     gitea/act_runner:latest-dind-rootless   maj 2026-04-30   <- le jour du renommage
    #     gitea/runner:latest-dind-rootless       maj 2026-08-22
    #
    # `latest` sur un nom abandonne ne bouge plus. L'arbitrage ci-dessous voulait DECOUVRIR qu'un
    # amont bouge ; l'amont a bouge en se renommant, c'est-a-dire par le seul mouvement qu'un tag
    # mouvant est structurellement incapable de rapporter. Tout banc monte apres avril recevait
    # l'image d'avril en croyant suivre la courante.
    #
    # ⚠ CE FICHIER NE SERT QUE DES BANCS. Le runner n'apparait nulle part dans les deux compose
    # du PRODUIT : en prod, la forge et le runner sont provisionnes par l'admin, avec ses choix. Le
    # pin par digest qui vivait ici ne gouvernait donc que du jetable, et il l'a gouverne trois
    # semaines sans que personne ne le rouvre.
    #
    # ⚖ ARBITRAGE USER 2026-08-20 : un banc est fait pour DECOUVRIR qu'un amont a bouge. Le figer,
    # c'est apprendre la rupture chez quelqu'un d'autre — le meme motif qui a fait tuer le rail natif
    # du runner (« deux rails, c'est un rail qui pourrit »). Discriminer une regression amont reste
    # possible et ne coute rien : un `docker run` avec un tag date. Ce n'est pas une propriete que le
    # banc doit garantir.
    #
    # LA VARIANTE, ELLE, RESTE EXIGEE : `dind-rootless`, pas `latest` nu. Elle decide si un job a un
    # daemon docker — donc si `container:` est jouable du tout — et le motif complet est juste en
    # dessous. Un `latest` sans suffixe ramenerait le montage du socket de l'hote.
    # ⚠ VARIANTE `dind-rootless`, ET LE SOCKET DE L'HOTE N'EST PLUS MONTE NULLE PART.
    #
    # CE QU'ON ENLEVE : `- /var/run/docker.sock:/var/run/docker.sock`. Avec lui, n'importe quel job
    # parle au daemon de la MACHINE — c'est-a-dire root, par conception et sans rien avoir a casser.
    # La doc Gitea le dit elle-meme : « jobs share the host's daemon and can see its other
    # containers », et un job peut lire les jetons dans l'inspection des conteneurs voisins. Sur un
    # banc jetable ca passe ; a cote de vrais services, non.
    #
    # ⚖ ARBITRAGE USER 2026-08-18 : « si on fait les 2 rails, on peut pas juste faire le bon, secure,
    # et l'utiliser aussi pour le banc ? ». Un seul rail, et c'est le bon — parce que deux rails,
    # c'est un rail qui pourrit : le natif n'avait pas tourne depuis trois semaines et il etait mort
    # sans que personne le voie.
    #
    # CE QU'ON ACHETE ET CE QU'ON PAIE. `privileged: true` est exige par la variante dind, y compris
    # rootless — mais le daemon INTERNE tourne sans root, et surtout : plus aucun job n'atteint le
    # daemon de la machine. Avec le socket il n'y avait rien a casser ; ici il faut s'echapper de son
    # conteneur de job, PUIS d'un daemon rootless. Ce n'est pas le meme ordre de difficulte.
    #
    # Mesure du 2026-08-18, les deux substrats : demarre sous Docker Desktop/WSL ET sous LMDE 7
    # natif, daemon interne 28.5.2, tire une image publique, accepte `docker load`.
    #
    # `apparmor=rootlesskit` : sur Ubuntu/Debian le profil par defaut bloque les changements de
    # namespace dont le daemon embarque a besoin (doc Gitea).
    image: gitea/runner:latest-dind-rootless
    privileged: true
    security_opt:
      - apparmor=rootlesskit
    hostname: lcars-runner
    environment:
      # La forge de l'opérateur. Pas de défaut : une URL fausse fait un runner qui tourne et ne
      # sert rien, exactement le silence que ce fichier refuse.
      GITEA_INSTANCE_URL: "${LCARS_FORGE_URL:?LCARS_FORGE_URL requis — l'URL de TA forge (ex http://10.42.0.118)}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${LCARS_RUNNER_TOKEN:-}"
      GITEA_RUNNER_NAME: "${LCARS_RUNNER_NAME:-lcars-runner}"
      # QUATRE labels, quatre besoins, un seul runner :
      #   `shell` — le label de ROUTAGE minimal que le scaffold demande (`runs-on: shell`). Ce qu'il
      #     y a derrière (alpine ici) ne porte rien : le template pose `container:` sur le job, et le
      #     daemon dind tire l'image réelle (node + langages). Le label ne fait qu'amener le job au
      #     runner ; `container:` choisit l'image. Contrat minimal que sert tout runner LCARS.
      #   `ubuntu-latest` — l'image GRASSE (`catthehacker/ubuntu:act-latest`, node + python + bash +
      #     git) que les projets user visent en `runs-on: ubuntu-latest` (forme GitHub-standard), et
      #     que `48-forge-host.sh` sert déjà côté poste. Le banc héberge aussi des projets user : il
      #     doit la servir. `check_labels` la pré-tire → le `container:` du template tape le cache.
      #   `elixir` — le gate (.gitea/workflows/gate.yml). Le job tourne dans LA MÊME image que le
      #     stage build du Dockerfile : une seule vérité toolchain, trois rendus (15-toolchain WSL,
      #     stage build, CI). Bump = le digest de la base, une seule fois.
      #     ⚠ C'est aussi ce qui rend le gate REPRODUCTIBLE : le runner hôte actuel exécute les jobs
      #     sous son propre compte système, donc la suite mesure l'environnement de ce compte et pas
      #     celui du dépôt — trois tests de sondes tombent pour cette seule raison.
      #   `dood` — la publication (.gitea/workflows/publish.yml). Le job tourne dans `docker:cli` et
      #     parle au daemon de l'HÔTE par le socket monté ci-dessous. Docker-out-of-docker : le cache
      #     de layers de la machine est réutilisé, et l'image nommée doit être résoluble par CE daemon.
      #
      # ⚠ CE DEFAUT NE SAIT PAS JOUER `mix gate`, ET IL EN SAIT MOINS QU'AVANT. L'image nommee pour
      # `elixir` est l'image de BASE du stage build, pas le stage CONSTRUIT — et depuis que cette
      # base est `ubuntu:26.04`, elle ne porte meme plus Elixir : le stage l'installe par apt, comme
      # `15-toolchain` sur un poste. Elle n'a ni erlang, ni elixir, ni git, ni tmux, ni bwrap, ni
      # bats, ni python3, que le gate exige. Le defaut reste celui-ci parce qu'un operateur
      # quelconque ne peut pas resoudre une image locale de LCARS, et parce qu'un defaut qui echoue
      # NET au premier `mix` vaut mieux qu'un defaut qui porte une toolchain PROCHE de la bonne :
      # qui veut faire tourner LE gate sert le stage build de SON build :
      #   docker build --target build -t lcars-build:<tag> -f .../Dockerfile .
      #   LCARS_RUNNER_LABELS="shell:docker://alpine:3.20,elixir:docker://lcars-build:<tag>,dood:docker://docker:cli,ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
      # ⚠ LE TAG SUIT LA BASE DU `Dockerfile`, ET RIEN NE LE VERIFIE. Un runner qui sert une
      # toolchain autre que celle du deploiement fait juger sur un OTP ce qui tourne sur un autre —
      # un mensonge operationnel, pas un ecart de confort.
      GITEA_RUNNER_LABELS: "${LCARS_RUNNER_LABELS:-shell:docker://alpine:3.20,elixir:docker://ubuntu:26.04,dood:docker://docker:cli,ubuntu-latest:docker://catthehacker/ubuntu:act-latest}"
      # Le daemon EMBARQUE, rootless : c'est lui que les jobs utilisent, plus celui de la machine.
      DOCKER_HOST: "unix:///var/run/user/1000/docker.sock"
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: "slirp4netns"
      DOCKERD_ROOTLESS_ROOTLESSKIT_MTU: "65520"
    volumes:
      - data:/data
      # ⚠ LE MAGASIN DU DAEMON INTERNE, NOMME. L'image DECLARE deja ce chemin comme volume, donc
      # docker en cree un — mais ANONYME : un `down -v` l'emporte et un `recreate` l'orpheline, et
      # les images qu'on y a semees (dont `lcars-build`, qu'aucun registre ne porte) disparaissent
      # avec. C'est le trou de l'exemple officiel, et il coute cette ligne.
      - dind:/home/rootless/.local/share/docker
    # ⚠ LE TROISIEME VOLUME DECLARE PAR L'IMAGE MEURT ICI, IL NE SE NOMME PAS.
    # `gitea/runner:*-dind-rootless` declare TROIS volumes : `/data`, `/home/rootless/.local/share/
    # docker` et `/var/lib/docker`. Les deux premiers sont nommes ci-dessus parce qu'ils PORTENT
    # quelque chose. Le troisieme est le magasin du dind ROOTFUL — or ce runner est rootless, son
    # daemon ecrit dans le second, et celui-ci reste vide.
    #
    # MESURE DU 2026-08-27, install neuve : volume ANONYME `a9019628eb78…`, 0 octet, un repertoire
    # cree au `up` et jamais ecrit. Non mappe, docker en fabrique un a chaque recreation ; le NOMMER
    # fabriquerait un objet permanent et vide, que le prochain lecteur devra elucider — exactement
    # la question qui a mene ici. `tmpfs` : le chemin reste inscriptible pour l'image, et il ne
    # survit a rien.
    tmpfs:
      - /var/lib/docker
    restart: unless-stopped

# Les cles portent le ROLE, pas le service : le projet compose prefixe deja (`bob-runner_data`).
# Les nommer `runner-*` rendait `bob-runner_runner-data` — le mot deux fois pour un seul fait.
volumes:
  data:
  dind:
