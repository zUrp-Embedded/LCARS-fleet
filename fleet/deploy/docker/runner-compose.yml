# SOURCE: fleet/deploy/docker/runner-compose.yml
# AUTHOR: DrDree
# STARDATE: 2026-08-01
# STATUS: runner CI — ne fait PAS partie de LCARS, comme la forge
#
# ┌──────────────────────────────────────────────────────────────────────────────────────────┐
# │ CE FICHIER N'EST PAS UN COMPOSANT DE LCARS.                                              │
# │ Le runner CI, comme la forge, appartient à l'OPÉRATEUR et se pose AVANT l'install.       │
# │ LCARS ne fabrique ni l'un ni l'autre : il consomme une forge (URL + token) et suppose    │
# │ qu'un runner répond aux labels que ses workflows demandent. Ceci est la recette qui      │
# │ marche, pas une dépendance de la boîte.                                                  │
# └──────────────────────────────────────────────────────────────────────────────────────────┘
#
# POURQUOI SÉPARÉ DE L'INSTANCE — la raison est un mode de défaillance, pas du rangement :
# un job CI exécute du code arbitraire (une dep vérolée, un tag poussé par n'importe qui). S'il
# tourne DANS l'instance, le compromettre compromet la fleet. Dans son propre projet compose, on
# le nuke et on le repose sans toucher au reste. C'est la même règle qui a sorti la forge de
# `docker-compose.yml` le 2026-07-31.
# LANCER :   docker compose -f fleet/deploy/docker/runner-compose.yml -p lcars-runner up -d
# DÉTRUIRE : docker compose -f fleet/deploy/docker/runner-compose.yml -p lcars-runner down -v
#
# PREMIER BOOT — un token d'enregistrement est requis, minté PAR la forge (site-admin) :
#   POST /api/v1/admin/actions/runners/registration-token
#   LCARS_RUNNER_TOKEN=<token> docker compose … up -d

name: lcars-runner

services:
  act:
    # ⚠ VARIANTE `dind-rootless`, ET LE SOCKET DE L'HOTE N'EST PLUS MONTE NULLE PART.
    #
    # CE QU'ON ENLEVE : `- /var/run/docker.sock:/var/run/docker.sock`. Avec lui, n'importe quel job
    # parle au daemon de la MACHINE — c'est-a-dire root, par conception et sans rien avoir a casser.
    #
    # CE QU'ON ACHETE ET CE QU'ON PAIE. `privileged: true` est exige par la variante dind, y compris
    # rootless — mais le daemon INTERNE tourne sans root, et surtout : plus aucun job n'atteint le
    # daemon de la machine. Avec le socket il n'y avait rien a casser ; ici il faut s'echapper de son
    # conteneur de job, PUIS d'un daemon rootless. Ce n'est pas le meme ordre de difficulte.
    #
    # `apparmor=rootlesskit` : sur Ubuntu/Debian le profil par defaut bloque les changements de
    # namespace dont le daemon embarque a besoin (doc Gitea).
    image: gitea/runner:latest-dind-rootless
    privileged: true
    security_opt:
      - apparmor=rootlesskit
    hostname: lcars-runner
    environment:
      # La forge de l'opérateur. Pas de défaut : une URL fausse fait un runner qui tourne et ne
      # sert rien, exactement le silence que ce fichier refuse.
      GITEA_INSTANCE_URL: "${LCARS_FORGE_URL:?LCARS_FORGE_URL requis — l'URL de TA forge (ex http://10.42.0.118)}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${LCARS_RUNNER_TOKEN:-}"
      GITEA_RUNNER_NAME: "${LCARS_RUNNER_NAME:-lcars-runner}"
      # ⚠ LE TAG SUIT LA BASE DU `Dockerfile`, ET RIEN NE LE VERIFIE. Un runner qui sert une
      # toolchain autre que celle du deploiement fait juger sur un OTP ce qui tourne sur un autre —
      # un mensonge operationnel, pas un ecart de confort.
      GITEA_RUNNER_LABELS: "${LCARS_RUNNER_LABELS:-shell:docker://alpine:3.20,elixir:docker://ubuntu:26.04,dood:docker://docker:cli,ubuntu-latest:docker://catthehacker/ubuntu:act-latest}"
      # Le daemon EMBARQUE, rootless : c'est lui que les jobs utilisent, plus celui de la machine.
      DOCKER_HOST: "unix:///var/run/user/1000/docker.sock"
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: "slirp4netns"
      DOCKERD_ROOTLESS_ROOTLESSKIT_MTU: "65520"
    volumes:
      - data:/data
      # ⚠ LE MAGASIN DU DAEMON INTERNE, NOMME. L'image DECLARE deja ce chemin comme volume, donc
      # docker en cree un — mais ANONYME : un `down -v` l'emporte et un `recreate` l'orpheline, et
      # les images qu'on y a semees (dont `lcars-build`, qu'aucun registre ne porte) disparaissent
      # avec. C'est le trou de l'exemple officiel, et il coute cette ligne.
      - dind:/home/rootless/.local/share/docker
    # ⚠ LE TROISIEME VOLUME DECLARE PAR L'IMAGE MEURT ICI, IL NE SE NOMME PAS.
    # `gitea/runner:*-dind-rootless` declare TROIS volumes : `/data`, `/home/rootless/.local/share/
    # docker` et `/var/lib/docker`. Les deux premiers sont nommes ci-dessus parce qu'ils PORTENT
    # quelque chose. Le troisieme est le magasin du dind ROOTFUL — or ce runner est rootless, son
    # daemon ecrit dans le second, et celui-ci reste vide.
    tmpfs:
      - /var/lib/docker
    restart: unless-stopped

# Les cles portent le ROLE, pas le service : le projet compose prefixe deja (`bob-runner_data`).
# Les nommer `runner-*` rendait `bob-runner_runner-data` — le mot deux fois pour un seul fait.
volumes:
  data:
  dind:
