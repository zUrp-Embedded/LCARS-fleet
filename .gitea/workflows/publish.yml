name: Publish image (ADR 012)

# Un TAG semver poussé → l'image se bâtit DEPUIS CETTE REF (clone frais, jamais un arbre de
# travail) et part sur la registry configurée. Destination et identité vivent dans la
# configuration du dépôt/de l'org, jamais ici :
#   vars.REGISTRY           adresse, port compris si HTTP (ex. 192.0.2.10:80)
#   vars.REGISTRY_USER      compte qui pousse (l'identité réelle est portée par le token)
#   secrets.REGISTRY_TOKEN  token à portée write:package
# Changer de destination (forge LAN → GHCR) = changer ces valeurs, pas ce fichier.
#
# Mono-arch : le multi-arch d'ADR 012 (buildx --platform amd64,arm64) viendra avec la release
# publique — il change ce fichier, et lui seul.
#
# Runner : label `dood` — le job tourne dans `docker:cli` et parle au daemon de l'HÔTE
# (socket monté par la config du runner). Le build réutilise donc le cache de layers de la
# machine, et l'image nommée doit être résoluble par CE daemon — d'où l'adresse publiée
# dans vars.REGISTRY, pas un nom de service compose.
#
# DEUX POINTS DE VUE RÉSEAU, PAS UN : `docker build/push` parlent à la registry DEPUIS LE
# DAEMON ; `docker manifest inspect` et curl parlent DEPUIS LE CONTENEUR DE JOB. Une adresse
# valable pour l'un ne l'est pas forcément pour l'autre. Les preuves passent donc par l'API
# paquets de la forge (${GITHUB_SERVER_URL}, le point de vue du job, le même que le clone) —
# jamais par `manifest inspect`. Elles supposent que la registry EST la forge (modèle gitea) ;
# le passage GHCR adapte ces deux pas, et eux seuls.
#
# Pas d'actions/checkout : le job-image n'a pas de node, et le livrable est un build de LA REF —
# un clone shallow de la ref est la garantie, pas un checkout d'arbre de CI.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: dood
    # `docker:cli` ne porte pas bash ; sans cette ligne, chaque `run:` meurt en exec bash
    # introuvable. Les steps ci-dessous sont POSIX.
    defaults:
      run:
        shell: sh
    steps:
      - name: Configuration présente (refus explicite plutôt qu'un échec obscur en aval)
        run: |
          ok=1
          [ -n "${{ vars.REGISTRY }}" ]          || { echo 'REFUS : vars.REGISTRY absent'; ok=0; }
          [ -n "${{ vars.REGISTRY_USER }}" ]     || { echo 'REFUS : vars.REGISTRY_USER absent'; ok=0; }
          [ -n "${{ secrets.REGISTRY_TOKEN }}" ] || { echo 'REFUS : secrets.REGISTRY_TOKEN absent'; ok=0; }
          [ "$ok" = 1 ]

      - name: Outillage du job
        run: apk add --no-cache git curl >/dev/null

      # AVANT le build : un tag brûlé doit coûter deux secondes, pas un gate entier.
      # Trois issues, toutes dites : absent (on continue), présent (refus — ADR 012),
      # API injoignable (refus — une garde qui ne peut pas mesurer ne laisse pas passer).
      - name: Immutabilité (ADR 012) — un tag publié ne se réécrit jamais
        run: |
          owner="$(dirname "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          pkg="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            "${GITHUB_SERVER_URL}/api/v1/packages/${owner}/container/${pkg}/${GITHUB_REF_NAME}")
          case "$code" in
            404) echo "tag ${GITHUB_REF_NAME} absent de la registry — publication permise" ;;
            200) echo "REFUS : ${GITHUB_REF_NAME} existe déjà — se tromper de ref coûte un tag brûlé, pas une réécriture."; exit 1 ;;
            *)   echo "REFUS : API paquets injoignable ou inattendue (code $code) — sans mesure, pas de push."; exit 1 ;;
          esac

      - name: Clone de la ref
        run: git clone --branch "${GITHUB_REF_NAME}" --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src

      - name: Build depuis la ref
        run: |
          GIT_SHA="$(git -C src rev-parse --short=8 HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IMAGE="${{ vars.REGISTRY }}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${GITHUB_REF_NAME}"
          echo "IMAGE=$IMAGE"     >> "$GITHUB_ENV"
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_ENV"
          docker build \
            -f src/deploy/docker/Dockerfile \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -t "$IMAGE" src

      - name: Login registry
        run: printf '%s' "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USER }}" --password-stdin

      - name: Push
        run: docker push "$IMAGE"

      - name: Preuves — le paquet est sur la forge, la révision de l'image est celle de la ref
        run: |
          owner="$(dirname "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          pkg="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            "${GITHUB_SERVER_URL}/api/v1/packages/${owner}/container/${pkg}/${GITHUB_REF_NAME}")
          [ "$code" = 200 ] || { echo "REFUS : paquet absent de la forge après push (code $code)"; exit 1; }
          rev="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [ "$rev" = "$GIT_SHA" ] || { echo "REFUS : label revision ($rev) != ref buildée ($GIT_SHA)"; exit 1; }
          echo "publié : $IMAGE (revision $rev)"

  # ─── LA VERSION : tar, .deb, porte — la Release de la forge et le registre Debian (lot 5) ────────
  # LE MÊME pack.sh que sur le poste ; « qui appuie » est la seule différence. Le job porte la
  # toolchain de gate.yml (BEAM épinglé par les planchers du provisionnement, bats, shellcheck, ruff)
  # parce que pack.sh COMMENCE par le gate : une version qui n'a pas passé le gate n'existe pas. Il
  # tourne à côté du job-image, pas après : les deux publient un objet différent du même tag, et
  # chacun porte son immutabilité (ADR 012 — le job-image sur le paquet container, pack.sh sur la
  # Release). Le jeton est un secret du runner (PACK_TOKEN : write:package + write:repository), lu
  # dans l'environnement par pack.sh — jamais en argv, jamais imprimé.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Le verdict porte sur l'arbre annoncé — et le jeton est là
        run: |
          set -eu
          got="$(git rev-parse HEAD)"
          [ "$got" = "$GITHUB_SHA" ] || { echo "source: HEAD=$got attendu $GITHUB_SHA"; exit 1; }
          [ -n "${{ secrets.PACK_TOKEN }}" ] || { echo 'REFUS : secrets.PACK_TOKEN absent (write:package + write:repository)'; exit 1; }
          # le tag est celui de la ref : c'est lui que pack.sh lit (git describe --exact-match)
          [ "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}" ] || { echo "REFUS : HEAD ne porte pas le tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Planchers de la toolchain (depuis le provisionnement)
        id: toolchain
        run: |
          set -eu
          lib=deploy/lib/provision-lib.sh
          ex="$(sed -n 's/^: "${PROV_ELIXIR_MIN:=\([^}]*\)}".*/\1/p' "$lib")"
          otp="$(sed -n 's/^: "${PROV_ELIXIR_OTP_MAJOR:=\([^}]*\)}".*/\1/p' "$lib")"
          [ -n "$ex" ] && [ -n "$otp" ] || { echo "planchers illisibles dans $lib"; exit 1; }
          echo "elixir=$ex" >> "$GITHUB_OUTPUT"
          echo "otp=$otp"   >> "$GITHUB_OUTPUT"

      - name: Environnement BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}

      - name: Bats (shell_gate)
        uses: bats-core/bats-action@4.0.0

      - name: ShellCheck, jq (shell_gate ; la release se décrit en JSON) et ruff (plancher python)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
          pip install --quiet --break-system-packages ruff

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            runtime/deps
            runtime/_build
          key: mix-${{ runner.os }}-${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('runtime/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.toolchain.outputs.elixir }}-

      - name: Deps
        working-directory: runtime
        run: mix deps.get

      - name: pack.sh --publish (gate, release, tar, .deb, porte → Release + registre Debian)
        env:
          LCARS_PACK_TOKEN: ${{ secrets.PACK_TOKEN }}
          LCARS_PACK_FORGE: ${{ github.server_url }}
          LCARS_PACK_OWNER: ${{ github.repository_owner }}
          LCARS_PACK_REPO: ${{ github.event.repository.name }}
          LCARS_PACK_DIR: ${{ runner.temp }}/lcars-packs
        run: timeout --signal=TERM --kill-after=60s 50m ./pack.sh --publish

      - name: Preuve — la release du tag est sur la forge, publiée, avec sa porte
        env:
          PACK_TOKEN: ${{ secrets.PACK_TOKEN }}
        run: |
          set -eu
          body="$(mktemp)"
          code="$(printf 'header = "Authorization: token %s"\n' "$PACK_TOKEN" \
                  | curl -sS -K - -m 10 -o "$body" -w '%{http_code}' "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          [ "$code" = 200 ] || { echo "REFUS : pas de release ${GITHUB_REF_NAME} sur la forge (code $code)"; exit 1; }
          [ "$(jq -r '.draft' "$body")" = false ] || { echo "REFUS : la release ${GITHUB_REF_NAME} est restée en brouillon"; exit 1; }
          jq -r '.assets[].name' "$body" | grep -qx 'install.sh' || { echo "REFUS : la porte install.sh n'est pas parmi les assets"; exit 1; }
          echo "publié : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME} ($(jq '.assets | length' "$body") assets)"
