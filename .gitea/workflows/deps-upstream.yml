name: Veille amont des deps

# ─── POURQUOI CE FICHIER, ET CE QU'IL REMPLACE ─────────────────────────────────────────────────
# La veille de version amont vivait DANS le plan de controle : `Fleet.Starfleet.MCPWatcher`, un
# GenServer qui armait un `send_after` hebdomadaire et sortait en HTTP vers Hex.pm depuis le
# daemon. Il etait `start_mcp_watcher: false` par defaut et n'a jamais ete active nulle part —
# donc la veille n'existait pas, et le code qui la promettait invitait quiconque a l'allumer.
#
# Surveiller une registry de paquets n'est pas le travail d'un plan de controle : ca n'a aucun
# consommateur en ligne, ca ajoute une sortie reseau au daemon, et ca ne survit pas a un
# redemarrage mieux qu'un cron. C'est du travail de CI — periodique, hors du chemin chaud, et dont
# la sortie est un rapport qu'un humain lit.
#
# ⚠ Il rend un RAPPORT, jamais un rouge. Une nouvelle version amont n'est pas un defaut : monter
# est une decision (BL-6-15 en tient la doctrine — monter est le defaut, ne pas monter demande une
# justification ecrite). Un job rouge sur la sortie d'une version transformerait cette decision en
# urgence et apprendrait a l'equipe a ignorer un rouge.

on:
  schedule:
    # Lundi 06:17. Pas 00:00 : tout le monde programme minuit, et une registry sert mieux une
    # requete a une heure que personne ne vise.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  upstream:
    runs-on: shell
    defaults:
      run:
        shell: sh
    steps:
      - name: Versions amont vs mix.lock
        run: |
          echo "Veille amont — les deps dont un ecart merite un coup d'oeil."
          echo

          # Pas d'actions/checkout : ce job n'a besoin d'aucun arbre, il interroge Hex.pm. Le
          # verrou local (`mix.lock`) est lu par la personne qui recoit le rapport ; comparer ici
          # exigerait le depot ET une toolchain Elixir pour un gain nul.
          for pkg in ex_mcp req finch plug cowlib jose; do
            latest=$(curl -sf "https://hex.pm/api/packages/${pkg}" \
                     | tr ',' '\n' | grep -m1 '"latest_stable_version"' \
                     | cut -d'"' -f4)
            printf '  %-10s amont: %s\n' "$pkg" "${latest:-illisible}"
          done

          echo
          echo "Comparer a fleet/runtime/mix.lock. Monter est le DEFAUT ; ne pas monter demande"
          echo "une justification ecrite (BL-6-15). cowlib est une posture connue : la derniere"
          echo "version porte encore ses CVE, il n'y a rien vers quoi monter."
