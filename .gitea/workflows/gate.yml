name: Gate runtime (I-CBC)

# R7 verrou — `mix gate` mécanique sur push : compile --warnings-as-errors +
# suite umbrella + lcars.contracts.check. Rouge = le commit/la branche est
# marqué KO sur la forge. Les dents de la méthodo cadrage, hardware-backed.
# Runner : host local (label `elixir`), réutilise Elixir 1.18 de la machine.

on:
  push:
    paths:
      - 'fleet/**'
      - '.gitea/workflows/gate.yml'
  pull_request:
    paths:
      - 'fleet/**'

jobs:
  gate:
    runs-on: elixir
    defaults:
      run:
        working-directory: fleet
    steps:
      # PAS D'`actions/checkout` — c'est du node, et aucune image de label n'en porte. Le job
      # mourait a cette ligne, en 0 seconde, sur `exec: "node": executable file not found in
      # $PATH` -> exit 127 : un gate qui ne rend jamais de verdict sur le depot qu'il garde
      # (mesure du 2026-08-04, premier runner de banc reellement enregistre). La regle etait deja
      # ECRITE, ailleurs : le workflow du `project_template` porte le paragraphe qui l'interdit.
      # Ce fichier lui est anterieur, il etait le seul du depot a la violer.
      # `working-directory: .` : le defaut du job pointe `fleet`, qui n'existe pas encore.
      # LE JETON N'EST PAS UNE PRECAUTION, C'EST LA CONDITION : `private: false` cote API ne dit
      # RIEN de git-over-HTTP, qui refuse l'anonyme sur cette forge (`could not read Username`,
      # exit 128 — mesure du 2026-08-04). Le jeton de job est fourni par la forge elle-meme et vit
      # le temps du run ; il marche public comme prive, sur le banc comme sur le NAS.
      - name: Source (shell — l'image du job n'a ni node ni action)
        working-directory: .
        env:
          GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init -q .
          # ON RECUPERE LE SHA, PAS LA BRANCHE. En fetchant `$GITHUB_REF`, un run qui a attendu son
          # tour obtenait la tete COURANTE de la branche, constatait `HEAD != GITHUB_SHA` et se
          # taisait — correctement, mais en se marquant `failure` sur la forge. Mesure du
          # 2026-08-14 : neuf commits ainsi marques rouges en une seconde chacun apres un
          # deblocage de file. Indistinguable au premier coup d'oeil d'un rouge de code, et c'est le
          # signal sur lequel repose la lecture du juge.
          #
          # Le SHA est fetchable en direct sur cette forge (verifie : `fetch --depth 1 <url> <sha>`
          # rend ce commit exact), donc chaque run juge SON arbre plutot que de renoncer. Le
          # controle ci-dessous reste : il devient un invariant, et un commit retire de la branche
          # par un force-push fera echouer le fetch — un vrai rouge, a sa vraie place.
          git -c http.extraheader="Authorization: Basic $(printf '%s:' "$GATE_TOKEN" | base64 -w0)" \
              fetch --depth 1 "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          # Le gate doit dire SUR QUOI il rend son verdict, ou se taire. Un vert sur un autre arbre
          # est pire qu'un rouge.
          got="$(git rev-parse HEAD)"
          [ "$got" = "$GITHUB_SHA" ] || { echo "source: HEAD=$got attendu $GITHUB_SHA — le serveur a rendu un autre objet"; exit 1; }

      - name: Toolchain (versions)
        run: |
          elixir --version
          mix --version

      - name: Hex/Rebar présents
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Deps
        run: mix deps.get

      # `MIX_ENV=test` N'EST PAS UN DETAIL D'ENVIRONNEMENT : `config/runtime.exs` est un fichier de
      # BOOT, et hors test il exige les ports que `bin/fleet_v2` calcule par humain — d'ou
      # « FLEET_API_PORT missing », fail-loud correct, sur un runner qui ne boote rien (mesure du
      # 2026-08-04). C'est exactement la ligne que joue `etc/install.sh` avant de poser la release :
      # le gate de la CI et le gate du build ne doivent pas etre deux gates.
      #
      # SANS BORNE, LE JUGE SE TAIT AU LIEU D'ECHOUER. Deux runs de banc ont cale A L'INTERIEUR de ce
      # pas, a deux endroits differents — l'un apres la suite, l'autre pendant la compilation des
      # deps : ce n'est pas un chemin de code, c'est la machine. Le second a garde l'unique runner
      # plus de deux heures, file bloquee, sans verdict et sans rouge. Un gate sans fin ne rend pas
      # un verdict tardif, il n'en rend aucun — et l'absence de rouge se lit comme du vert.
      # La borne est en `timeout(1)`, PAS en `timeout-minutes:` du job : le shell est execute par le
      # runner quoi qu'il arrive, tandis que la cle YAML dependrait de ce que cette version
      # d'act_runner en fait — et une garde qu'on ne peut pas prouver ne garde rien. Exit 124 = mur.
      # 20 min est mesure sur ce qu'elle doit LAISSER PASSER : 28 verts consecutifs, moyenne 5.9 min,
      # pire cas 10.3 min. Le double du pire vert, jamais le tour de la mediane.
      - name: Gate (compile strict + suite + contracts.check)
        run: MIX_ENV=test timeout --signal=TERM --kill-after=60s 20m mix gate
