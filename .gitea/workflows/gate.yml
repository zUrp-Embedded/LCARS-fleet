name: Gate runtime (I-CBC)

# R7 verrou — `mix gate` mécanique sur push : compile --warnings-as-errors +
# suite + lcars.contracts.check. Rouge = le commit/la branche est marqué KO sur
# la forge. Les dents de la méthodo cadrage, hardware-backed.
#
# ⚠ CE JOB TOURNE SUR `ubuntu-latest`, ET C'EST CE QUI LE REND PORTABLE. Le label `elixir` exigeait
# une image LOCALE (`lcars-build`), bâtie puis semée dans le daemon du runner : une forge qui ne
# l'avait pas ne pouvait pas jouer ce gate, et le rail poste — qui ne bâtit aucune image — n'avait
# donc aucun moyen de servir sa propre CI. `ubuntu-latest` est servi par une image PUBLIQUE que le
# runner tire seul, et l'environnement BEAM s'installe DANS le job.
#
# Elle porte node, ce que les images de label n'avaient pas : `actions/checkout` et `actions/cache`
# redeviennent utilisables, et le checkout réimplémenté à la main disparaît avec ses trois pièges.

on:
  push:
    paths:
      - 'fleet/**'
      # ⚠ `deploy/**` ET `install.sh` MANQUAIENT (DI-08, ⚖ user 2026-09-04) : ce workflow joue
      # `deploy/gate.sh`, mais un commit qui ne touchait que l'installeur ne le déclenchait pas —
      # la porte de l'installeur ne se jouait en CI que par accident, quand `fleet/` bougeait aussi.
      # `catalogues/**` et `assets/github.io/**` entrent dans l'image (stage `site`, catalogue
      # runtime) : le job `image` ci-dessous les bâtit.
      - 'deploy/**'
      - 'install.sh'
      - 'catalogues/**'
      - 'assets/github.io/**'
      # `shell_gate` audite le shell SUIVI du dépôt entier, hooks et skills compris : sans ce
      # chemin, une édition de `.claude/` casse le gate sans le déclencher, et la rougeur tombe
      # sur le commit suivant, qui n'y est pour rien.
      - '.claude/**'
      - '.gitea/workflows/gate.yml'
  pull_request:
    paths:
      - 'fleet/**'
      - 'deploy/**'
      - 'install.sh'
      - 'catalogues/**'
      - 'assets/github.io/**'
      - '.claude/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet
    steps:
      # ⚠ LE JOB JUGE **SON** SHA, JAMAIS LA TÊTE COURANTE. Un run qui a attendu son tour dans la
      # file obtiendrait sinon un arbre plus récent que celui qu'il annonce juger. `checkout` vise
      # `github.sha` par défaut sur un push ; le contrôle ci-dessous en fait un invariant vérifié
      # plutôt qu'une propriété supposée d'une action tierce.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Le verdict porte sur l'arbre annoncé
        working-directory: .
        run: |
          set -eu
          got="$(git rev-parse HEAD)"
          [ "$got" = "$GITHUB_SHA" ] || { echo "source: HEAD=$got attendu $GITHUB_SHA"; exit 1; }

      # ⚠ LES VERSIONS SE LISENT, ELLES NE SE RECOPIENT PAS. `provision-lib.sh` pose les planchers
      # de toutes les machines du parc ; les réécrire ici en ferait une seconde autorité, et c'est
      # celle qu'on ne relit pas qui finit par diverger d'un `mix compile` qui passe ailleurs.
      - name: Planchers de la toolchain (depuis le provisionnement)
        id: toolchain
        working-directory: .
        run: |
          set -eu
          lib=deploy/lib/provision-lib.sh
          # ⚠ CE SONT DES PLANCHERS, PLUS DES PINS, ET `setup-beam` SAIT LES LIRE. Le rail poste
          # epinglait `PROV_ELIXIR_VERSION` (1.18.4) parce que l'apt de la distro d'alors servait
          # 1.14 ; sur la cible (ubuntu 26.04) il sert 1.18.3, donc le pin est tombe et il ne reste
          # que « au moins ». Une specification PARTIELLE (`1.18`, `27`) demande a l'action la
          # derniere version de cette serie — ce qui est exactement ce que la distro fera de son
          # cote, et ce qu'un pin exact ici empecherait de mesurer.
          ex="$(sed -n 's/^: "${PROV_ELIXIR_MIN:=\([^}]*\)}".*/\1/p' "$lib")"
          otp="$(sed -n 's/^: "${PROV_ELIXIR_OTP_MAJOR:=\([^}]*\)}".*/\1/p' "$lib")"
          [ -n "$ex" ] && [ -n "$otp" ] || { echo "planchers illisibles dans $lib"; exit 1; }
          echo "elixir=$ex" >> "$GITHUB_OUTPUT"
          echo "otp=$otp"   >> "$GITHUB_OUTPUT"
          echo "elixir=$ex otp=$otp"

      - name: Environnement BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}

      # `mix gate` n'est pas que du mix : il enchaîne `shell_gate`, qui joue les suites bats de
      # `bin/`, `etc/` et `git-hooks/`. Sans bats, cette moitié du filet ne tourne pas —
      # et `shell_gate` le DIT (« bats=… MANQUES ») plutôt que de rendre un vert amputé.
      #
      # ⚠ `deploy/` N'EST PLUS DANS CETTE LISTE, ET C'EST POURQUOI LE PAS SUIVANT EXISTE. Ses 1294
      # cas — 73 % de tout le corpus bats — sont ceux de l'INSTALLEUR et ont leur propre porte
      # depuis le détachement. Cette ligne les a nommés jusqu'à ce commit ; la laisser telle quelle
      # aurait fait dire à la CI qu'elle joue ce qu'elle ne joue plus. Bats sert donc les DEUX pas.
      #
      # ⚠ L'ACTION OFFICIELLE, PAS UN `apt-get`. Le paquet d'une distro sert la version qu'elle a
      # figée, qui n'est pas celle sur laquelle les suites sont écrites ; le fournisseur du projet
      # sert la sienne. Même règle que pour le BEAM juste au-dessus : la CI installe l'outil À LA
      # VERSION VOULUE dans le job, elle n'hérite pas de ce que l'image traînait.
      # Les suites d'ici sont du bats NU — aucune n'appelle `bats_load_library` — donc les libs que
      # cette action pose en plus ne sont pas chargées, et rien ne dépend de leur chemin.
      - name: Bats (shell_gate)
        uses: bats-core/bats-action@4.0.0

      # `shell_gate` audite maintenant tout le shell SUIVI au même barreau que
      # `--warnings-as-errors` côté Elixir : un signalement, quelle que soit sa sévérité, est rouge.
      #
      # ⚠ `apt-get` ICI, ET PAS L'ACTION OFFICIELLE — la règle inverse de bats juste au-dessus, pour
      # une raison inverse. Ce qui compte pour bats est le comportement du runner ; ce qui compte
      # pour shellcheck est **quels contrôles existent**, et il n'a pas d'action amont qui épingle
      # une version. Le paquet de la distro en sert une, `shell_gate` IMPRIME celle qu'il a jouée,
      # et une divergence de verdict entre la CI et un poste se lit alors sur cette ligne au lieu de
      # se deviner.
      - name: ShellCheck (shell_gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck --version

      # ⚠ MEME RAISON QUE SHELLCHECK, ET MEME EXIGENCE : `shell_gate` fait ECHOUER le gate si `ruff`
      # est absent, plutot que de sauter le plancher python en silence. Sans cette etape la CI
      # rougirait — c'est voulu : un plancher qu'on peut sauter n'est pas un plancher.
      #
      # `pip` et non `apt` : la distro ne sert pas ruff, et `--break-system-packages` est le prix
      # d'un runner ephemere ou aucun venv ne survit a l'etape suivante. `ruff --version` est
      # IMPRIME pour la meme raison que celle de shellcheck : une divergence de verdict entre la CI
      # et un poste doit se lire sur cette ligne au lieu de se deviner.
      - name: Ruff (plancher python de shell_gate)
        run: pip install --quiet --break-system-packages ruff && ruff --version

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          path: |
            fleet/deps
            fleet/_build
          key: mix-${{ runner.os }}-${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('fleet/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.toolchain.outputs.elixir }}-

      - name: Deps
        run: mix deps.get

      # `MIX_ENV=test` N'EST PAS UN DETAIL D'ENVIRONNEMENT : `config/runtime.exs` est un fichier de
      # BOOT, et hors test il exige les ports que `bin/fleet_v2` calcule par humain — d'ou
      # « FLEET_API_PORT missing », fail-loud correct, sur un runner qui ne boote rien. C'est
      # exactement la ligne que joue `deploy/lib/deploy-release.sh` avant de poser la release : le gate de la CI
      # et le gate du build ne doivent pas etre deux gates.
      #
      # SANS BORNE, LE JUGE SE TAIT AU LIEU D'ECHOUER. Deux runs ont calé A L'INTERIEUR de ce pas, a
      # deux endroits differents — l'un apres la suite, l'autre pendant la compilation des deps : ce
      # n'est pas un chemin de code, c'est la machine. Le second a garde l'unique runner plus de deux
      # heures, file bloquee, sans verdict et sans rouge. Un gate sans fin ne rend pas un verdict
      # tardif, il n'en rend aucun — et l'absence de rouge se lit comme du vert.
      # La borne est en `timeout(1)`, PAS en `timeout-minutes:` du job : le shell est execute par le
      # runner quoi qu'il arrive, tandis que la cle YAML dependrait de ce que cette version
      # d'act_runner en fait — et une garde qu'on ne peut pas prouver ne garde rien. Exit 124 = mur.
      # 20 min est mesure sur ce qu'elle doit LAISSER PASSER : 28 verts consecutifs, moyenne 5.9 min,
      # pire cas 10.3 min. Le double du pire vert, jamais le tour de la mediane.
      - name: Gate (compile strict + suite + contracts.check)
        run: MIX_ENV=test timeout --signal=TERM --kill-after=60s 20m mix gate

      # ─── ET LA PORTE DE L'INSTALLEUR — SANS ELLE, CE WORKFLOW EST UN VERT AMPUTÉ ───────────────
      #
      # ⚠ LE PAS AU-DESSUS A CESSÉ DE JOUER 1294 CAS, et rien dans son nom ne le dit. Le corpus de
      # `deploy/tests` a quitté `shell_gate` au détachement de l'installeur : sans ce second pas, la
      # CI rendrait vert sur 73 % de moins qu'avant, en gardant exactement le même libellé. C'est la
      # forme même du défaut que `@test_corpora` nomme — « a corpus nobody runs rots while reporting
      # a coverage it does not provide » — au niveau du workflow cette fois.
      #
      # ⚠ ET IL EST UN PAS À PART, PAS UNE LIGNE DANS LE PRÉCÉDENT : deux logiciels, deux verdicts.
      # Un opérateur qui lit la liste des pas doit voir lequel des deux est rouge sans ouvrir le log.
      #
      # La même borne, pour la même raison : un gate sans fin ne rend pas un verdict tardif, il n'en
      # rend aucun. Mesure du 2026-09-03 sur ce poste : 1302 cas en ~7 min.
      - name: Gate de l'installeur (la chaîne d'install, bats)
        run: timeout --signal=TERM --kill-after=60s 20m bash deploy/gate.sh
  # ─── L'IMAGE ET LA DOC SE BÂTISSENT EN CI (DI-08, ⚖ user 2026-09-04) ────────────────────────
  #
  # Trois défauts du 03/09 (contexte du compose, lecteur du site, portée des contrats) sont passés
  # VERTS au gate et rouges au premier `box build` : 1247 témoins, et pas un ne bâtissait l'image.
  # Ce job la bâtit jusqu'à son stage final — donc `verify` (le doctor sur le système de fichiers de
  # l'image, qui échoue le build sur un drift) et `site` (la doc du deck, `npm run build`). Il tourne
  # sur le runner `dood` (docker de l'hôte), comme `publish.yml`, et clone la ref lui-même : ce
  # runner est une alpine nue, sans les actions.
  image:
    runs-on: dood
    defaults:
      run:
        shell: sh
    steps:
      - name: Outillage du job
        run: apk add --no-cache git >/dev/null
      - name: Clone de la ref
        run: |
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src checkout -q "${GITHUB_SHA}"
      - name: Le verdict porte sur l'arbre annoncé
        run: |
          got="$(git -C src rev-parse HEAD)"
          [ "$got" = "$GITHUB_SHA" ] || { echo "source: HEAD=$got attendu $GITHUB_SHA"; exit 1; }
      - name: Image (stages build, site, runtime, verify, final)
        run: |
          GIT_SHA="$(git -C src rev-parse --short=8 HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            -f src/deploy/docker/Dockerfile \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t "lcars-fleet:ci-${GIT_SHA}" src
      - name: Preuve — l'image porte le tampon de verify, à la révision de la ref
        run: |
          GIT_SHA="$(git -C src rev-parse --short=8 HEAD)"
          got="$(docker run --rm --entrypoint cat "lcars-fleet:ci-${GIT_SHA}" /opt/lcars/.verified)"
          [ "$got" = "$GIT_SHA" ] || { echo "tampon verify=$got attendu $GIT_SHA"; exit 1; }
      - name: Ménage — une image de CI ne reste pas sur le runner
        if: always()
        run: docker image rm -f "lcars-fleet:ci-$(git -C src rev-parse --short=8 HEAD)" >/dev/null 2>&1 || true
