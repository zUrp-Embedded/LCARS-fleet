project: cDs
target: zero2                       # ~/.rpi-target value
arch: aarch64
triplet: aarch64-linux-gnu

env_file: ~/.env.cross
sysroot: /opt/rpi-sysroot
toolchain_file: ostserver/toolchain-rpi-aarch64.cmake

build_dirs:
  indi:       build-indi            # STATIC      — rebuild: build-cycle.sh --rebuild-indi
  ostserver:  build-ostserver       # QUASI-STATIC — rebuild: build-cycle.sh --rebuild-ost
  ostmodules: build-ostmodules      # DYNAMIC      — rebuilt every cycle (default)

make_jobs: 2                        # WSL2 memory constraint — never use $(nproc)

deploy:
  user: pi
  dest: /usr/bin/
  service: ostserver
  target_ip: see project-refs.md    # fleet shared, not hardcoded here

constraints:
  ram_mb: 512                       # hard limit — every new dependency must be justified

fleet:
  build_instance: builder           # builds run here — dev does not compile
  build_script: build-cycle.sh      # incremental; phase2.sh = full rebuild reference only
  artifacts: /home/commons/artifacts/

cmake_extra_flags:
  # Type-qualified -D flags — prevent FIND_PATH/FIND_LIBRARY re-search on stale cache
  - -DOST_INCLUDE_DIR:PATH=/home/builder/ost-staging/usr/include
  - -DOST_LIBRARY_BASE:FILEPATH=/home/builder/ost-staging/usr/lib/libostbasemodule.so
  - -DOST_LIBRARY_INDI:FILEPATH=/home/builder/ost-staging/usr/lib/libostindimodule.so
