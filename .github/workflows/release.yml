# SOURCE: .github/workflows/release.yml
# STATUS: PROTO — UN tag, UN run, TROIS produits : l'image, la Release et ses assets.
#
# POURQUOI UN SEUL RUN, ET PAS TROIS GESTES : republier trois choses séparément, c'est se donner
# trois occasions de diverger — l'image d'un sha, la release d'un autre, les .deb d'un troisième.
# C'est le défaut DPL-014, et il s'est déjà produit : l'image `lcars-fleet:2` du parc portait la
# révision d'une branche de test jamais poussée, et le banc a refusé de semer un code dont il ne
# retrouvait pas l'origine. Ici le tag décide, et tout en descend.
#
# L'ORDRE N'EST PAS ARBITRAIRE. L'image d'abord, la Release ensuite, parce que la Release est
# IMMUABLE (ADR 012) : une release publiée dont l'image manque ne se répare pas, alors qu'une image
# poussée dont la release manque se rattrape en rejouant. On paie donc le long et le faillible en
# premier.
#
# LE GATE TOURNE ICI, ET C'EST `pack.sh` QUI LE JOUE — le même script qu'un poste de dev, pas une
# réimplémentation. Il refuse un arbre modifié, joue `mix gate` puis les témoins de l'installeur,
# bâtit la release Elixir, la doc, le tar, les huit .deb, génère la porte de CETTE version, et
# publie. Rien de tout cela n'est répété dans ce fichier : un workflow qui redit ce que fait le
# script finit par dire autre chose.
#
# POURQUOI PAS DE REGISTRE APT : GitHub n'en a pas. `forge-publish.sh` le DIT au lieu de le
# simuler, et les .deb restent tirables comme assets de la Release.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (doit exister et être poussé)"
        required: true

permissions:
  contents: write   # la Release est un objet du dépôt
  packages: write   # l'image

# ⚠ UNE BORNE, PARCE QU'UN JOB SANS FIN NE REND PAS UN VERDICT TARDIF — IL N'EN REND AUCUN, et
# l'absence de rouge se lit comme du vert. Mesuré ici même : le pas vendor a pendu 41 minutes avant
# qu'on l'annule à la main. La même règle que les deux gates de `.gitea/workflows/gate.yml`, qui la
# portent en `timeout(1)` ; ici la clé du job suffit, c'est GitHub qui exécute.
# 90 min : `pack.sh` enchaîne `mix gate`, les 1447 témoins de l'installeur, npm, huit nfpm et la
# montée des assets — mesuré à ~25 min sur un runner froid. Le triple du pire vert, jamais la médiane.
#
# ⚠ ET UNE CONCURRENCE PAR TAG. Deux runs du même tag publieraient deux fois : le second prend le
# refus d'immutabilité au mieux, laisse un brouillon au pire.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ⚠ `fetch-depth: 0` ET LE TAG, PAS L'ARBRE PAR DÉFAUT. `pack.sh` lit `git rev-parse HEAD` et
      # refuse un arbre modifié ; `forge-publish.sh` refuse un commit que la forge ne connaît pas.
      # Un checkout superficiel suffirait au build mais pas au verdict — on prend l'historique.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # Le pin du produit, pas une version au hasard : `deploy/lib/provision-lib.sh` porte
      # PROV_ELIXIR_PIN / PROV_ELIXIR_OTP_MAJOR, et le gate a un témoin qui exige que le pin, le
      # plancher et les ARG du Dockerfile s'accordent. On les LIT plutôt que de les recopier.
      - name: Le pin de la toolchain, lu dans la lib
        id: pin
        run: |
          set -euo pipefail
          elixir="$(sed -n 's/^: *"${PROV_ELIXIR_PIN:=\(.*\)}"/\1/p' deploy/lib/provision-lib.sh | head -1)"
          otp="$(sed -n 's/^: *"${PROV_ELIXIR_OTP_MAJOR:=\(.*\)}"/\1/p' deploy/lib/provision-lib.sh | head -1)"
          [ -n "$elixir" ] && [ -n "$otp" ] || { echo "pin introuvable dans provision-lib.sh — la lib a changé de forme"; exit 1; }
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"
          echo "otp=$otp" >> "$GITHUB_OUTPUT"
          echo "toolchain : Elixir $elixir sur OTP $otp"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.pin.outputs.otp }}
          elixir-version: ${{ steps.pin.outputs.elixir }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # `pack.sh` bâtit AUSSI la doc (assets/github.io) — sans node, pas de doc

      # ⚠ LE GATE EXIGE LE BINAIRE `claude`, ET AUCUN MODULE DE L'INSTALLEUR NE LE POSE. Le runtime
      # le résout en dur — `raise "vendor: claude binary not found in ~/.local/bin of … (fail-loud)"`
      # — donc 67 témoins de `Fleet.Spawner.*` rougissent sur un runner nu. Mesuré au premier run
      # réel de ce workflow (2026-09-08) : 3514/3583 passés, et la totalité des échecs de pod tenait
      # à ce fichier absent. La dépendance existait depuis toujours ; elle n'avait jamais été vue
      # parce que le gate n'avait jamais tourné ailleurs que sur nos postes, où `claude` est installé
      # par l'humain.
      #
      # C'est un `curl … | bash`, ce que la porte de LCARS refuse pour ELLE-MÊME. Ici c'est
      # l'installeur d'un tiers sur un runner jetable, pas notre produit sur la machine de quelqu'un.
      # ⚠ CE PAS A PENDU 41 MINUTES (mesuré, run annulé à la main). D'où la borne : sans elle le job
      # ne rend AUCUN verdict, et l'absence de rouge se lit comme du vert. `timeout` sort en 124 :
      # un mur, pas un silence.
      - name: Le binaire vendor du siège (le gate le résout en dur)
        run: |
          set -euo pipefail
          # ⚠ `curl … | bash < /dev/null` EST UN PLACEBO, mesuré : la redirection s'applique au
          # `bash -c` externe et à `curl`, JAMAIS au bash de droite du pipe, dont fd 0 EST le pipe —
          # avant comme après. L'installeur mange donc bien la suite de son propre script s'il lit
          # stdin. On télécharge, PUIS on exécute avec un stdin vide pour de bon.
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          timeout --signal=TERM --kill-after=30s 5m bash "$RUNNER_TEMP/claude-install.sh" < /dev/null
          test -x "$HOME/.local/bin/claude" || { echo "l'installeur n'a pas posé ~/.local/bin/claude"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ⚠ LES QUATRE OUTILS DE `shell_gate`, ET IL REFUSE DE SAUTER CE QU'IL NE PEUT PAS JOUER —
      # c'est ce qui les rend obligatoires plutôt qu'optionnels : « ECHEC: pytest absent — les
      # lcars_tests de token-saver ne peuvent pas tourner (pas de skip silencieux) ». Un corpus que
      # personne ne joue pourrit en annonçant une couverture qu'il ne fournit pas.
      # Mesuré au deuxième run réel (2026-09-08) : la suite ExUnit passait à 3583/3583 et le gate
      # rougissait ici, après huit minutes.
      - uses: bats-core/bats-action@4.0.0
      - name: Les outils du shell_gate (shellcheck, ruff, pytest)
        run: |
          set -euo pipefail
          # ⚠ ÉPINGLÉS, PARCE QU'UN PLANCHER D'OUTIL QUI FLOTTE NE REND PAS UN VERDICT
          # REPRODUCTIBLE — et c'est la version la plus ANCIENNE qui décide. Mesuré le 2026-09-08 :
          # le même arbre passait sur un poste (shellcheck 0.11.0, Ubuntu 26.04) et rougissait sur
          # un runner (0.9.0, Ubuntu 24.04) sur un SC2120 que 0.11 ne signale plus. La leçon avait
          # été écrite dans `deploy/lib/docker-endpoint.sh` sans être appliquée ici.
          # ⚠ ET LE PIN DE SHELLCHECK MANQUAIT ALORS QUE CE COMMENTAIRE DISAIT « ÉPINGLÉS » : seuls
          # ruff et pytest l'étaient, shellcheck venait d'`apt`, donc de la date de l'image. Corrigé
          # le 2026-09-08 par relecture hostile — la ligne d'à côté disait le contraire du code.
          # ⚠ LE BINAIRE OFFICIEL, VERSION FIXE ET SOMME VERIFIEE — PAS LE PAQUET DE LA DISTRO.
          # `apt install shellcheck` sert ce que l'image du runner porte ce mois-ci : 0.9.0 sur
          # Ubuntu 24.04, 0.11.0 sur 26.04. Mesure du 2026-09-08 : le MEME arbre passait sur un
          # poste (0.11.0) et rougissait sur un runner (0.9.0) sur un SC2120 que 0.11 ne signale
          # plus — un verdict qui depend de la date de l'image n'est pas un verdict.
          # 0.9.0 et pas la derniere : c'est la version la plus ANCIENNE qui decide, parce qu'un
          # controle retire en amont ne rend pas le code correct pour autant. Monter ce pin est un
          # geste delibere, avec la somme d'a cote.
          v=0.9.0
          sha=700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
          t="${RUNNER_TEMP:-/tmp}"
          curl -fsSL --retry 3 --max-time 120 -o "$t/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.x86_64.tar.xz"
          echo "$sha  $t/sc.tar.xz" | sha256sum -c -
          tar -xJf "$t/sc.tar.xz" -C "$t"
          sudo install -m 0755 "$t/shellcheck-v$v/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2
          pip install --quiet --break-system-packages 'ruff==0.16.6' 'pytest==8.3.4'
          ruff --version; pytest --version

      - name: Connexion au registre du dépôt
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Noms dérivés du dépôt (GHCR exige des minuscules)
        id: noms
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # ⚠ PAS `GITHUB_REF_NAME` SEUL. Sur un `workflow_dispatch`, il vaut la BRANCHE choisie
          # dans l'UI, pas `inputs.tag` — alors que le checkout, lui, prend bien le tag. Une
          # publication manuelle de 1.2.3 bâtissait donc le code du tag et le poussait en `:main`,
          # écrasant le tag roulant, avec `VERSION=main` gravé dans l'image, pendant que `pack.sh`
          # (qui fait `git describe --exact-match`) nommait la Release 1.2.3. C'est exactement la
          # divergence DPL-014 que l'en-tête dit prévenir. Trouvé par relecture hostile le 2026-09-08.
          tag="${{ inputs.tag }}"; tag="${tag:-$GITHUB_REF_NAME}"
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "le tag « $tag » n'est pas une version : ce workflow publie une VERSION, pas une branche"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 1. L'IMAGE — la plus longue et la plus faillible, donc la première.
      - name: L'image, puis le registre
        run: |
          docker buildx build \
            --build-arg "GIT_SHA=$(git rev-parse --short=8 HEAD)" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "VERSION=${{ steps.noms.outputs.tag }}" \
            -f deploy/docker/Dockerfile \
            -t "${{ steps.noms.outputs.image }}:${{ steps.noms.outputs.tag }}" \
            ${{ contains(steps.noms.outputs.tag, '-') && ' ' || format('-t {0}:latest', steps.noms.outputs.image) }} \
            --push .

      # 2. LA RELEASE — gate, artefacts, porte, publication. Le jeton ne passe jamais en argv :
      #    `pack.sh` le lit dans l'environnement, `forge-publish.sh` le donne à curl par `-K -`.
      - name: Le pack, et la publication
        env:
          LCARS_PACK_FORGE: https://github.com
          LCARS_PACK_OWNER: ${{ github.repository_owner }}
          LCARS_PACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export LCARS_PACK_REPO="${GITHUB_REPOSITORY#*/}"
          export LCARS_PACK_DIR="${RUNNER_TEMP}/lcars-packs"
          ./pack.sh --publish

      - name: Ce que le registre porte maintenant
        run: docker buildx imagetools inspect "${{ steps.noms.outputs.image }}:${{ steps.noms.outputs.tag }}"
