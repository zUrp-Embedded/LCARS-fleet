# SOURCE: .github/workflows/image.yml
# STATUS: TEST — bâtit l'image du produit et la publie sur le registre du DÉPÔT.
#
# POURQUOI PUBLIER D'ICI ET PAS DEPUIS UN POSTE : un `docker push` fait à la main crée un paquet
# rattaché à l'ORGANISATION et à aucun dépôt (`repo=aucun`), donc privé et sans héritage possible.
# Publié par ce workflow, le paquet appartient au dépôt et suit ses réglages.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Même règle que `release.yml` : une borne, et un seul run à la fois par ref — deux pushes
# rapprochés sur main pousseraient deux images sous le même tag `:main`, et c'est la seconde arrivée
# qui gagnerait, pas la plus récente.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre du depot
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Le nom du paquet est celui du depot, en minuscules — GHCR l'exige.
      - name: Nom du paquet
        id: nom
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Batir et publier
        run: |
          docker buildx build \
            --build-arg "GIT_SHA=$(git rev-parse --short=8 HEAD)" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f deploy/docker/Dockerfile \
            -t "${{ steps.nom.outputs.image }}:${{ github.sha }}" \
            -t "${{ steps.nom.outputs.image }}:main" \
            --push .

      - name: Ce que le registre porte maintenant
        run: docker buildx imagetools inspect "${{ steps.nom.outputs.image }}:main"
