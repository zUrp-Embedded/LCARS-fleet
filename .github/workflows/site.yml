# SOURCE: .github/workflows/site.yml
# STATUS: PROTO — construit et publie le site vitrine (assets/github.io) sur GitHub Pages.
#
# POURQUOI ICI ET PAS DANS assets/github.io/ : Actions ne lit les workflows QU'a la racine du
# depot. Le projet du site vit sous assets/github.io/, le workflow pointe dedans par
# working-directory.
#
# POURQUOI LE SITE EST DANS LE DEPOT DU PRODUIT : son build LIT le catalogue
# (runtime/priv/catalogue) pour en tirer les cartes, les sieges et les verdicts. Meme arbre,
# meme commit : le site ne peut pas decrire une autre version que celle qui est la — donc aucune
# question d'epinglage, aucune peremption possible, aucun mecanisme de fraicheur a maintenir.
# Corollaire assume : deplacer le catalogue CASSE ce build. C'est le comportement voulu — une
# plaquette qui ne trouve plus ce qu'elle decrit doit echouer, pas servir la version d'avant.
name: Site vitrine

on:
  push:
    branches: [main]
    # ⚠ CETTE LISTE EST LA LISTE DES ENTREES DU BUILD, ET RIEN D'AUTRE. Le site LIT le runtime pour
    # l'enumerer : chaque fichier qu'il ouvre est une entree, et une entree absente d'ici est un
    # changement qui ne redeclenche RIEN. Le mode de panne est muet dans la mauvaise direction — le
    # site reste en ligne et decrit la version d'avant, ce que l'en-tete ci-dessus dit precisement
    # vouloir empecher. Il manquait huit entrees sur dix (mesure du 2026-08-20) : renommer un outil
    # MCP, changer un defaut `LCARS_*` de `fleet` ou ajouter un cap-profile systeme ne publiait
    # rien.
    #
    # AU GRAIN DU FICHIER LU, PAS DU REPERTOIRE QUI LE CONTIENT. `runtime/lib/fleet/**` couvrirait,
    # mais rebatirait la plaquette a chaque commit de runtime — le filtre ne servirait plus a rien.
    # Un fichier renomme casse le build (`throw`), et c'est le comportement voulu.
    #
    # Le contrat `site.build_inputs` de `mix lcars.contracts.check` derive ces chemins des `join()`
    # des sources du site et refuse toute divergence : cette liste ne se maintient pas a la main.
    paths:
      - 'assets/**'
      - '.github/workflows/site.yml'
      # catalogue.js — le catalogue metier, le schema de verdict, et les DEUX sources Elixir dont il
      # tire le layout et les regles d'un catalogue.
      - 'runtime/priv/catalogue/**'
      - 'runtime/priv/workflow/schema/gate-decision.json'
      - 'runtime/lib/fleet/catalogue.ex'
      - 'runtime/lib/fleet/layout.ex'
      # catalogue.js + tools.js — les cap-profiles SYSTEME (le compte des sieges livres par defaut).
      - 'runtime/priv/catalogue-system/cap_profile/cap-profiles/**'
      # cli.js + catalogue.js + tools.js — les launchers dont il extrait verbes et env vars.
      # ⚠ LE REPERTOIRE ENTIER, ET C'EST LE SEUL DES SIX QUI LE SOIT. `cli.js` lit `join(BIN, name)`
      # avec un nom DYNAMIQUE : les trois fichiers d'aujourd'hui ne sont pas une liste close, et un
      # quatrieme launcher lu par le site retomberait dans le trou qu'on vient de boucher. Le grain
      # suit ce que la source peut dire, pas ce qu'elle fait ce mois-ci.
      - 'runtime/bin/**'
      # tools.js — les outils MCP declares, et la delegation.
      - 'runtime/lib/fleet/mcp/pod_tools.ex'
      - 'runtime/lib/fleet/mcp/pod_tools/delegation.ex'
      # catalogue.js — les catalogues d'EXEMPLE, qui vivent HORS de `priv/` (livres comme templates
      # a forker). La page equipage montre desormais un siege PAR CATALOGUE, celui de demonstration
      # compris : sans cette ligne, ajouter un siege a `web-demo` ne rebatit pas la vitrine qui le
      # decrit. Le repertoire entier, comme `runtime/bin/**` et pour la meme raison — la lecture est
      # DYNAMIQUE (`join(dir, f)` sur un `readdirSync`), donc les fichiers d'aujourd'hui ne sont pas
      # une liste close.
      - 'catalogues/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assets/github.io/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets/github.io/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
