# SOURCE: .github/workflows/site.yml
# STATUS: construit et publie le site vitrine (assets/github.io) sur GitHub Pages
#
# Actions ne lit les workflows qu'à la racine du dépôt : celui-ci travaille dans assets/github.io.
# Le build du site lit le catalogue et le runtime du même commit ; un fichier lu qui disparaît fait
# échouer le build plutôt que servir la version d'avant.
name: Site vitrine

on:
  push:
    branches: [main]
    # les entrées du build, au grain du fichier lu : une entrée absente d'ici ne republie rien quand
    # elle change ; le contrat site.build_inputs de « mix lcars.contracts.check » dérive cette liste
    # des sources du site et refuse toute divergence
    paths:
      - 'assets/**'
      - '.github/workflows/site.yml'
      # catalogue.js : le catalogue métier, le schéma de verdict, le layout et les règles d'un catalogue
      - 'runtime/priv/catalogue/**'
      - 'runtime/priv/workflow/schema/gate-decision.json'
      - 'runtime/lib/fleet/catalogue.ex'
      - 'runtime/lib/fleet/layout.ex'
      # catalogue.js, tools.js : les cap-profiles système
      - 'runtime/priv/catalogue-system/cap_profile/cap-profiles/**'
      # cli.js, catalogue.js, tools.js : les lanceurs, lus par un nom calculé, d'où le répertoire entier
      - 'runtime/bin/**'
      # tools.js : les outils MCP déclarés et la délégation
      - 'runtime/lib/fleet/mcp/pod_tools.ex'
      - 'runtime/lib/fleet/mcp/pod_tools/delegation.ex'
      - 'runtime/lib/fleet/mcp/pod_tools/delegation/**'
      # catalogue.js : les catalogues d'exemple hors de priv/, lus par parcours du répertoire
      - 'catalogues/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages n'existe que sur GitHub : la forge d'une installation, qui porte le même dépôt, ne publie rien
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/github.io
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assets/github.io/package-lock.json
      - run: npm ci
      # la base du site est celle de Pages : « / » pour un site d'organisation, « /<repo>/ » pour un site de projet
      - run: npm run build
        env:
          LCARS_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets/github.io/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
