name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    continue-on-error: true  # temporary — 65/87 scripts fail pre-Phase 2. Remove after Phase 2.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: bash fleet/tests/run-shellcheck.sh
        timeout-minutes: 5

  checkbashisms:
    name: Portability Check
    runs-on: ubuntu-24.04
    continue-on-error: true  # temporary — not all scripts checked yet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install devscripts
        run: sudo apt-get update -qq && sudo apt-get install -y devscripts

      - name: Run checkbashisms
        run: bash fleet/tests/run-checkbashisms.sh

  tests:
    name: Bats Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run tests
        run: bash fleet/tests/run-tests.sh
        timeout-minutes: 10

  pytest:
    name: Python Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pytest
        run: sudo apt-get install -y python3-pytest python3-pytest-cov

      - name: Run pytest
        run: pytest fleet/tests/python/ -v --tb=short

  # coverage:
  #   name: Coverage (kcov)
  #   DISABLED — kcov builds cmake from source (~5min), crashes on fleet-env source chains,
  #   and consumed most of the GitHub Actions quota. Re-enable when kcov is pre-built or cached.
  #   See: work/TODO/v7-et-plus/ for coverage backlog.
