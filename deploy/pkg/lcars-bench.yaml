# SOURCE: deploy/pkg/lcars-bench.yaml
# AUTHOR: bob
# STARDATE: 2026-09-05
# STATUS: nFPM — `lcars-bench`, LE JETABLE : rien de pose, un paquet de gestes — seme l'humain
#         de demonstration (PROV_DEMO_HUMAN) ; le SEUL humain qu'apt a le droit de retirer.
name: lcars-bench
arch: all
platform: linux
version: ${LCARS_VERSION}
release: ${LCARS_DEB_RELEASE}
section: admin
priority: optional
maintainer: LCARS fleet <fleet@lcars.local>
homepage: https://github.com/lordzurp/LCARS-fleet
description: |
  LCARS - le banc : seme un humain de demonstration sur la forge et sur la machine
  L'axe destination (40-RAILS § 13) : un poste de TRAVAIL ne seme personne, un banc si.
  postinst nomme l'humain (PROV_DEMO_HUMAN, defaut « lcars ») a la recette de la forge et au
  convergeur ; apt remove retire ce compte ET son home — c'est le seul humain que dpkg a le
  droit de retirer, parce qu'il l'a cree et qu'il est declare jetable.
depends:
  - lcars-forge
  - lcars-workstation | lcars-container
scripts:
  postinstall: ./lcars-bench/postinst
  preremove: ./lcars-bench/prerm
  postremove: ./lcars-bench/postrm
