# SOURCE: deploy/pkg/lcars-workstation.yaml
# AUTHOR: bob
# STARDATE: 2026-09-05
# STATUS: nFPM — `lcars-workstation`, LE RAIL NATIF : un paquet de gestes (postinst = provision
#         apply du rail poste). Les unites systemd, le tmpfiles et les ancres de /etc/lcars ne
#         sont pas possedes par dpkg : leur contenu est DERIVE (port, siege, forge) par 64/25/66.
name: lcars-workstation
arch: all
platform: linux
version: ${LCARS_VERSION}
release: ${LCARS_DEB_RELEASE}
section: admin
priority: optional
maintainer: LCARS fleet <fleet@lcars.local>
homepage: https://github.com/lordzurp/LCARS-fleet
description: |
  LCARS - le rail natif : services systemd, comptes de service, consoles, jetons
  postinst = provision apply des modules du rail poste (44 45 46 60 61 62 63 64 65 66, plus
  48 49 si lcars-forge est la). Sans lcars-forge, la forge est FOURNIE : FORGE_BASE_URL dans
  l'environnement ou dans /etc/lcars/forge.conf. apt remove arrete et retire les unites ;
  l'etat (/etc/lcars, /opt/lcars/var) suit le paquet lcars.
depends:
  - lcars
  - systemd
scripts:
  postinstall: ./lcars-workstation/postinst
  preremove: ./lcars-workstation/prerm
  postremove: ./lcars-workstation/postrm
