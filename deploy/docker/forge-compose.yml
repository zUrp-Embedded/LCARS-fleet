# SOURCE: deploy/docker/forge-compose.yml
# AUTHOR: consultant
# STARDATE: 2026-07-31
# STATUS: forge JETABLE du BANC — livrée avec la beta, ce n'est pas une forge de production
#
# ┌──────────────────────────────────────────────────────────────────────────────────────────┐
# │ CE FICHIER N'EST PAS LE DÉPLOIEMENT DE TA FORGE.                                         │
# │ En production, TU provisionnes ta forge avec l'outil que tu veux (app TrueNAS, Docker    │
# │ Desktop, machine dédiée) et tu donnes à LCARS deux choses : son URL et un token master.  │
# │ LCARS ne fabrique pas la forge, il vérifie qu'elle tient le contrat.                     │
# └──────────────────────────────────────────────────────────────────────────────────────────┘
#
# Elle se monte en une commande et se jette sans regret. Elle vit dans son PROPRE projet compose
# (`-p lcars-devforge` en autonome, `-p <projet>forge` sous `bench-up.sh`), donc ses volumes lui
# appartiennent et AUCUNE commande de `box` ne peut les atteindre — c'est tout l'intérêt.
#
# LANCER :   docker compose -f deploy/docker/forge-compose.yml -p lcars-devforge up -d
# DÉTRUIRE : docker compose -f deploy/docker/forge-compose.yml -p lcars-devforge down -v
#
# BRANCHER LCARS DESSUS : attacher le conteneur LCARS au réseau de CE projet, puis pointer
#   l'URL sur le nom de service :
#     docker network connect lcars-devforge_default <conteneur-lcars>
#     FORGE_BASE_URL=http://gitea:3000
#   (`host.docker.internal` n'est PAS une option par défaut sous Linux — il faut un
#    `extra_hosts: host-gateway`. Le réseau partagé est le chemin qui marche sans supposition.)
#
# DEUX VARIABLES, PAS UNE, et elles ne sont pas interchangeables :
#   ROOT_URL veut un PORT NU, `ports` veut une adresse de bind complète. Une seule variable pour
#   les deux produit `ROOT_URL=http://127.0.0.1:127.0.0.1:3301/` dès qu'on passe une adresse, et
#   Gitea refuse de démarrer en boucle.

name: lcars-devforge

services:
  gitea:
    # PIN par digest — 1.26.1 = la version validée avec le runtime (marqueurs, tokens, webhooks).
    image: gitea/gitea:1.26.1-rootless@sha256:4c4256497e2e237ddebdd30986c7ce52cb6f936b3e90c34bb9f4665714599f62
    hostname: devforge
    environment:
      GITEA__server__ROOT_URL: "${LCARS_DEVFORGE_ROOT_URL:-http://gitea:3000/}"
      GITEA__server__HTTP_PORT: "3000"
      # Démarrage headless (recette officielle) : sans ce verrou, une forge vierge sert le
      # wizard /install — `/` répond 200, l'API 404, le healthcheck reste rouge à vie et il n'y
      # a RIEN à automatiser. Mesuré au premier drill.
      GITEA__security__INSTALL_LOCK: "true"
      # Le rail CI du triangle. Le runner, lui, est à l'opérateur : une forge de dév n'en a pas
      # besoin pour que LCARS soit développable.
      GITEA__actions__ENABLED: "true"
      # L'INSCRIPTION EST LIBRE, ET C'EST LE MODÈLE, pas un oubli : un compte tout seul est INERTE,
      # et l'unique acte d'enrollment est l'ajout à l'équipe `humans` par un propriétaire d'org.
      # Ajouter une validation admin à l'inscription ajouterait un geste qui ne trie rien.
      GITEA__service__DISABLE_REGISTRATION: "false"
      # LCARS livre donc une forge dont les comptes ne sont PAS restreints (le défaut Gitea est
      # `false`, l'absence de ligne suffit). Un admin qui veut la ceinture la remet chez lui : on ne
      # la lui reprend pas, et `50-forge.sh` la sonde et lui dit ce qu'elle coûte à ses humains.
      # L'UI affiche le `full_name` a la place du login. Les comptes de role sont
      # `<catalogue>_<role>` — un username Gitea est unique a l'INSTANCE, donc sans prefixe deux
      # catalogues nommant chacun un `dev` se partagent un compte. Le full_name porte le nom du role,
      # et ce reglage fait que le prefixe ne subsiste que dans l'URL et l'API. Mesure sur une forge
      # de preuve : la fiche de `system_architect` titre « architect », le login passe en secondaire.
      #
      # ⚠ C'est un reglage de l'INSTANCE Gitea, pas un objet d'API : la recette tofu ne peut pas le
      # poser. Sur une forge PREEXISTANTE (le cas de la production), c'est un geste d'operateur dans
      # son app.ini — ici, la forge est jetable et nous appartient, donc il est cable.
      GITEA__ui__DEFAULT_SHOW_FULL_NAME: "true"
      #
      # L'UPLOAD WEB EST DISQUALIFIÉ, PAS LIMITÉ — et c'est une garde de SÉCURITÉ, pas d'hygiène.
      # Le gate d'adoption cherche un ARBRE `.claude/` ; l'UI de la forge aplatit une arborescence
      # déposée par drag&drop, donc `.claude/settings.json` arrive en `settings.json` à la racine.
      #
      # ⚠ `_0x2E_` n'est pas une coquette : une section INI qui porte un point s'écrit comme ça en
      # variable d'env, parce qu'une clé d'env ne peut contenir que `0-9A-Z_`. Mesuré dans le
      # binaire de l'image (`gitea config edit-ini --apply-env`), pas deviné — écrit
      # `GITEA__repository__upload__ENABLED`, le réglage ne vise AUCUNE section connue et ne fait
      # rien, en silence.
      GITEA__repository_0x2E_upload__ENABLED: "false"
    ports:
      - "${LCARS_DEVFORGE_BIND:-127.0.0.1}:${LCARS_DEVFORGE_PORT:-3300}:3000"
    volumes:
      - data:/var/lib/gitea
      - config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/version"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  data:
  config:
