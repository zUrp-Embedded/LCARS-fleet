# SOURCE: deploy/docker/runner-compose.yml
# AUTHOR: DrDree
# STARDATE: 2026-09-12
# STATUS: le runner CI de la forge jetable — un projet compose à lui, enrôlé par forge-runner.sh
#
# Un job de CI exécute du code arbitraire : dans son propre projet compose, le runner se détruit
# et se repose sans toucher à l'instance ni à la forge.
#
#   POST /api/v1/admin/actions/runners/registration-token   (site-admin) rend le jeton du premier démarrage
#   LCARS_FORGE_URL=<forge> LCARS_RUNNER_TOKEN=<jeton> docker compose --env-file deploy/installer-constants.env -f deploy/docker/runner-compose.yml -p <projet>-runner up -d

name: lcars-runner

services:
  act:
    # variante dind rootless : aucun job n'atteint le daemon de la machine (le socket de l'hôte n'est
    # monté nulle part) ; `privileged` est exigé par la variante, le daemon interne tourne sans root ;
    # `apparmor=rootlesskit` : le profil par défaut d'Ubuntu bloque les changements d'espace de noms du daemon embarqué
    image: gitea/runner:latest-dind-rootless
    privileged: true
    security_opt:
      - apparmor=rootlesskit
    hostname: lcars-runner
    environment:
      GITEA_INSTANCE_URL: "${LCARS_FORGE_URL:-}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${LCARS_RUNNER_TOKEN:-}"
      GITEA_RUNNER_NAME: lcars-runner
      GITEA_RUNNER_LABELS: "${LCARS_RUNNER_LABELS:-${PROV_RUNNER_LABELS:?PROV_RUNNER_LABELS absent — les constantes de l'installeur, par --env-file}}"
      DOCKER_HOST: "unix:///var/run/user/1000/docker.sock"
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: "slirp4netns"
      DOCKERD_ROOTLESS_ROOTLESSKIT_MTU: "65520"
    volumes:
      - data:/data
      # le magasin du daemon interne, nommé : anonyme, un `down -v` l'emporterait avec les images semées
      - dind:/home/rootless/.local/share/docker
    # le troisième volume déclaré par l'image est le magasin du dind rootful, vide ici
    tmpfs:
      - /var/lib/docker
    restart: unless-stopped

volumes:
  data:
  dind:
