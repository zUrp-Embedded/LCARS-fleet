# SOURCE: deploy/docker/docker-compose.secrets.yml
# AUTHOR: bob
# STARDATE: 2026-09-13
# STATUS: l'override compose qui monte les secrets de l'hôte dans le conteneur, en lecture seule sous /run/secrets/
#
# « deploy/container config » écrit les secrets côté hôte (`~/.lcars/container/<projet>.secrets/`) et
# nomme les deux fichiers par LCARS_CONTAINER_MASTER_TOKEN et LCARS_CONTAINER_SEED ; l'init de
# l'instance les importe au boot. Deux fichiers vides veulent dire « pas de secret » : compose exige
# qu'ils existent. `deploy/container` ajoute cet override (`-f`) à `docker-compose.yml` pour la pose.
services:
  lcars:
    secrets:
      - forge_master_token
      - forge_seed_password
secrets:
  forge_master_token:
    file: "${LCARS_CONTAINER_MASTER_TOKEN:?LCARS_CONTAINER_MASTER_TOKEN absent — cet override ne se joue que par deploy/container, qui le pose}"
  forge_seed_password:
    file: "${LCARS_CONTAINER_SEED:?LCARS_CONTAINER_SEED absent}"
