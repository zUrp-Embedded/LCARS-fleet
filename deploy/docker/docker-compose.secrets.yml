# SOURCE: deploy/docker/docker-compose.secrets.yml
# AUTHOR: bob
# STARDATE: 2026-09-04
# STATUS: PROTO-V2 — l'override compose qui MONTE les secrets de l'hote dans le conteneur (lot 6, container config)
#
# ⚖ user 2026-09-04 (Q1, chantier deploy-independance) : « container config » configure ENV et SECRETS
# COTE HOTE ; le produit les importe au premier boot (init de l'instance). Le modele est celui de
# Docker : les secrets sont des FICHIERS de l'hote, montes en lecture seule sous `/run/secrets/`, et
# le conteneur n'a rien a demander a personne pour demarrer.
#
# Ce fichier est un OVERRIDE : `deploy/container` l'ajoute (`-f`) a `docker-compose.yml` apres avoir pose
# les deux fichiers (vides = pas de secret — compose exige qu'ils EXISTENT). Il n'est pas dans le
# compose principal pour que ce dernier reste jouable NU (`docker compose -f docker-compose.install.yml
# up`, le banc, le swap) : ces chemins-la gardent la voie d'avant, le geste `config-token` DANS le
# conteneur, que « container config » joue aussi quand le conteneur tourne deja (rotation au jour 400).
#
# `LCARS_CONTAINER_SECRETS` : le repertoire de l'hote, pose par `deploy/container` (`~/.lcars/container/<projet>.secrets`).
services:
  lcars:
    secrets:
      - forge_master_token
      - forge_seed_password
secrets:
  forge_master_token:
    file: "${LCARS_CONTAINER_SECRETS:?LCARS_CONTAINER_SECRETS absent — cet override ne se joue que par deploy/container, qui le pose}/forge-master.token"
  forge_seed_password:
    file: "${LCARS_CONTAINER_SECRETS:?LCARS_CONTAINER_SECRETS absent}/forge-seed.pass"
