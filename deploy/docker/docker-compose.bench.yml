# SOURCE: deploy/docker/docker-compose.bench.yml
# AUTHOR: DrDree
# STARDATE: 2026-09-13
# STATUS: surcouche de banc — le conteneur rejoint le réseau de la forge jetable dès sa création
#
# Ni l'amorçage de la forge (admin, jeton, graine, semis) ni son démarrage ni celui du runner : ce
# sont des gestes contre des services qui tournent, enchaînés par `bench/bench-up.sh`.

services:
  lcars:
    # le réseau de la forge est branché à la création : le nom de service `gitea` résout avant le premier boot
    networks:
      - lcars
      - devforge

networks:
  # externe : le réseau appartient au projet de la forge, compose ne le crée ni ne le détruit ici
  devforge:
    external: true
    name: "${LCARS_DEVFORGE_NETWORK:-lcars-devforge_default}"
